# Read-only deploy key for the private game repository pxldi/dice-and-doom.
# bench-job fetches the commit it should measure with it, over ssh.github.com
# on port 443. The public half is registered on that repository as a deploy
# key without write access; deleting it there revokes this Secret.
#
# To replace the key, from the repo root in bash:
#
#   ssh-keygen -q -t ed25519 -N "" -f /dev/shm/bench-key
#   sops set kubernetes/apps/survivorlike-bench/deploy-key-secret.yaml \
#     '["stringData"]["deploy-key"]' "$(jq -Rs . < /dev/shm/bench-key)"
#   gh repo deploy-key add /dev/shm/bench-key.pub --repo pxldi/dice-and-doom \
#     --title "rechenzentrum survivorlike-bench"
#   shred -u /dev/shm/bench-key /dev/shm/bench-key.pub
