---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: branding
  namespace: branding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: branding
  template:
    metadata:
      labels:
        app: branding
    spec:
      initContainers:
        # git-sync is a native sidecar: restartPolicy Always inside
        # initContainers means it starts before nginx and then keeps running for
        # the life of the pod.
        #
        # It used to be a plain init container that cloned once, which made an
        # asset-only commit invisible until somebody deleted the pod. That cost
        # two manual `rollout restart`s on 2026-09-02 alone, and worse, it made
        # "the file is in git" and "the file is on the web" two different facts
        # with nothing reconciling them.
        #
        # On the token: a GitHub App installation token rather than a PAT. The
        # static PAT in branding-secret stopped working when the repo moved to
        # the pxldi-labs org, and git-sync then crash-looped 4090 times over 14
        # days without anyone noticing, because the previous ReplicaSet kept
        # serving. Another PAT would only reschedule that failure.
        #
        # This reuses the App renovate already authenticates as, so the private
        # key is the only long-lived secret. NOTE the request body: an
        # installation token defaults to everything the App can do, which here
        # includes contents:write on every selected repo. Scoping it down at mint
        # time is the whole reason this is better than a PAT and not just
        # different. A token lives an hour, so the loop re-mints at 45 minutes.
        - name: git-sync
          image: alpine/git:2.45.2
          restartPolicy: Always
          command:
            - sh
            - -c
            - |
              set -eu
              apk add --no-cache curl openssl jq rsync >/dev/null

              b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }

              mint() {
                now=$(date +%s)
                header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64)
                payload=$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' \
                  "$((now - 60))" "$((now + 540))" "${APP_ID}" | b64)
                sig=$(printf '%s.%s' "$header" "$payload" \
                  | openssl dgst -sha256 -sign /app-key/private-key.pem | b64)
                jwt="${header}.${payload}.${sig}"

                resp=$(curl -sS -X POST \
                  -H "Authorization: Bearer ${jwt}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  -d '{"repositories":["rechenzentrum"],"permissions":{"contents":"read"}}' \
                  "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens") \
                  || { echo "could not reach the GitHub API" >&2; return 1; }

                token=$(printf '%s' "$resp" | jq -r '.token // empty')
                if [ -z "$token" ]; then
                  # Never echo the raw response on success -- it carries the token.
                  echo "failed to mint installation token:" >&2
                  printf '%s' "$resp" | jq -r '.message // "unknown error"' >&2
                  return 1
                fi
                # The token is written to a tmpfs rather than passed as an env
                # var, so it never appears in the Deployment spec or in
                # `kubectl describe`.
                printf '%s' "$token" > /token/token
                date +%s > /token/minted
                echo "token minted, expires $(printf '%s' "$resp" | jq -r '.expires_at')"
              }

              sync_once() {
                if [ ! -s /token/minted ] \
                  || [ "$(( $(date +%s) - $(cat /token/minted) ))" -ge 2700 ]; then
                  mint || return 1
                fi

                rm -rf /tmp/repo
                git clone --quiet --depth=1 \
                  "https://x-access-token:$(cat /token/token)@github.com/pxldi-labs/rechenzentrum.git" \
                  /tmp/repo || return 1

                # Each directory served has to be named here, and mounted by
                # subPath into the nginx container below. Anything else under
                # branding/ in the repo is not published.
                #
                # rsync --delete rather than cp, so a file deleted in git leaves
                # the site. It also has to write into the existing directory: the
                # subPath mounts below bind these three by inode, and replacing a
                # directory would leave nginx serving the old one.
                for dir in icons wallpapers fonts; do
                  mkdir -p "/assets/$dir"
                  rsync -a --delete "/tmp/repo/branding/$dir/" "/assets/$dir/" || return 1
                done

                rm -rf /tmp/repo
                date +%s > /assets/.synced
              }

              while true; do
                if sync_once; then
                  echo "synced at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                else
                  # Whatever is already in the volume stays on the web. The
                  # liveness probe below is what makes a long failure visible.
                  echo "sync failed, serving what is already there" >&2
                fi
                sleep "${SYNC_INTERVAL}"
              done
          env:
            - name: SYNC_INTERVAL
              value: "300"
            - name: APP_ID
              valueFrom:
                secretKeyRef:
                  name: branding-app
                  key: APP_ID
            - name: INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: branding-app
                  key: INSTALLATION_ID
          # nginx does not start until this succeeds, so the site is never up
          # with an empty volume behind it.
          startupProbe:
            exec:
              command: ["test", "-f", "/assets/.synced"]
            periodSeconds: 2
            failureThreshold: 60
          # Six missed syncs restarts the sidecar, which puts a failing sync in
          # the pod's events instead of leaving it silent. nginx keeps serving
          # across that restart.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test "$(( $(date +%s) - $(cat /assets/.synced) ))" -lt 1800
            periodSeconds: 60
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
          volumeMounts:
            - name: assets
              mountPath: /assets
            - name: app-key
              mountPath: /app-key
              readOnly: true
            - name: token
              mountPath: /token
      containers:
        - name: nginx
          image: nginx:1.27.4-alpine
          ports:
            - containerPort: 80
              name: http
          # Publishing a directory takes two edits, not one: git-sync has to copy
          # it into the assets volume AND it needs a subPath mount here. Adding
          # only the copy leaves the files in the volume and off the web, which
          # is how fonts/ 404ed after it was already being synced.
          volumeMounts:
            - name: assets
              mountPath: /usr/share/nginx/html/icons
              subPath: icons
            - name: assets
              mountPath: /usr/share/nginx/html/wallpapers
              subPath: wallpapers
            - name: assets
              mountPath: /usr/share/nginx/html/fonts
              subPath: fonts
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          # /healthz is served by the nginx config in the ConfigMap and does
          # not touch the git-sync volume, so it stays honest if a sync fails.
          # Verified 200 against the running pod.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: assets
          emptyDir: {}
        - name: app-key
          secret:
            secretName: branding-app
            items:
              - key: private-key.pem
                path: private-key.pem
            defaultMode: 0400
        - name: token
          emptyDir:
            # Keep the installation token off disk.
            medium: Memory
        - name: nginx-config
          configMap:
            name: branding-nginx-config
