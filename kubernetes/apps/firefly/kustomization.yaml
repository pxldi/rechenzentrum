---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: firefly
resources:
  - secret.yaml
  - importer-secret.yaml
  - pvc.yaml
  - deployment.yaml
  - importer.yaml
  - pico.yaml
  - cronjob.yaml
  - ingress.yaml
components:
  # Egress: Postgres in this namespace, exchange rates from the internet, and
  # the API server for CNPG's instance manager.
  - ../../../components/default-deny-egress
  - ../../../components/allow-dns
  - ../../../components/allow-intra-namespace-egress
  - ../../../components/allow-internet-egress
  - ../../../components/allow-egress-to-apiserver
  # Ingress: Traefik and this namespace only. See deployment.yaml for why
  # monitoring is not on this list.
  - ../../infrastructure-config/networkpolicies/default-deny-ingress
  - ../../infrastructure-config/networkpolicies/allow-intra-namespace
  - ../../infrastructure-config/networkpolicies/allow-from-traefik

labels:
  - pairs:
      app.kubernetes.io/name: firefly
      app.kubernetes.io/instance: firefly
      app.kubernetes.io/component: application
      app.kubernetes.io/part-of: rechenzentrum
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
    includeTemplates: false
