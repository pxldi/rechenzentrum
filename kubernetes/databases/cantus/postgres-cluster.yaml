---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cantus-postgresql
  namespace: media
spec:
  # barman already backs this database up to rechenzentrum-cnpg, base plus WAL
  # (see objectstore.yaml). Velero's filesystem backup was copying pgdata and
  # pg-wal into rechenzentrum-backups on top of that -- a crash-consistent
  # duplicate that is not a reliable restore path, and 4.7 GiB per weekly run
  # across all clusters. The emptyDirs are pure scratch; they go too.
  #
  # The annotation this replaces sat on the Cluster and read "true". Velero
  # reads backup-volumes on the *pod*, and wants a volume list, so it never did
  # anything. inheritedMetadata is what actually reaches the pods.
  inheritedMetadata:
    annotations:
      backup.velero.io/backup-volumes-excludes: pgdata,pg-wal,shm,scratch-data,plugins
  # Backups. Without this the cluster has no archive at all — see
  # objectstore.yaml for where it writes and how long it keeps it.
  #
  # isWALArchiver: exactly one plugin may own archive_command. This is the only
  # plugin here, so it is the one.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cantus-postgresql-backup
        # Pinned rather than defaulted. On a restore you point a new Cluster
        # at this same store with recovery serverName set to this value, while
        # the new cluster archives under a different one — leaving them equal
        # has the recovered cluster overwrite the history it restored from.
        serverName: cantus-postgresql

  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6

  postgresql:
    shared_preload_libraries: []

  # No credentials secret: CNPG generates cantus-postgresql-app, whose uri key
  # is the connection string Schall reads. Nothing to keep in SOPS.
  bootstrap:
    initdb:
      database: cantus
      owner: cantus

  # Every CNPG cluster in this repo was BestEffort — no requests at all — which
  # put all six databases at the front of the kubelet's eviction queue, ahead of
  # every stateless web frontend that did declare something. 741Mi peak over 7d — the busiest database here
  #
  # Requests only. A memory limit on Postgres converts a spike into an OOM kill
  # in the middle of a transaction; an honest request instead makes a runaway
  # the most-over-request pod on the node, which is what eviction ranks on.
  resources:
    requests:
      memory: "768Mi"
      cpu: "100m"
  storage:
    storageClass: local-ssd
    size: 10Gi

  walStorage:
    storageClass: local-ssd
    size: 5Gi
