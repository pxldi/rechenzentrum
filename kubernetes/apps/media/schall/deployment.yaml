apiVersion: apps/v1
kind: Deployment
metadata:
  name: schall
  namespace: media
  labels:
    app: schall
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: schall
  template:
    metadata:
      labels:
        app: schall
      annotations:
        backup.velero.io/backup-volumes-excludes: "music,downloads,uploads"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Match slskd's downloads volume group so mounting its PVC does not
        # recursively relabel the provider's files. The container still has a
        # distinct primary UID/GID and sees that volume read-only.
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: schall
          image: ghcr.io/pxldi/schall:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: SCHALL_HTTP_ADDRESS
              value: ":8080"
            # Generated by CNPG alongside the cluster; nothing to keep in SOPS.
            - name: SCHALL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cantus-postgresql-app
                  key: uri
            - name: SCHALL_LOG_LEVEL
              value: "info"
            # Every /api/ request needs a credential: the X-authentik-* headers
            # beside the proxy key Traefik adds, or an app token. Without this
            # Schall serves anything that reaches the pod.
            - name: SCHALL_AUTH
              value: "proxy"
            - name: SCHALL_AUTH_PROXY_KEY
              valueFrom:
                secretKeyRef:
                  name: cantus-auth
                  key: proxy-key
            - name: SCHALL_LIBRARY_ALLOWED_ROOTS
              value: "/music"
            - name: SCHALL_DOWNLOAD_INBOX_PATH
              value: "/downloads"
            - name: SCHALL_IMPORT_LIBRARY_PATH
              value: "/music"
            # The other way music arrives: a ripped disc or a Bandcamp purchase
            # uploaded through the browser. It lands here first and is only
            # copied into /music once all of it has arrived, which is why this
            # cannot be a folder under /music — a scan would index the half of
            # an upload that had.
            - name: SCHALL_UPLOAD_STAGING_PATH
              value: "/uploads"
            - name: SCHALL_MUSICBRAINZ_USER_AGENT
              value: "Schall/0.1.0 (https://cantus.pxldi.de)"
            # No SCHALL_NAVIDROME_PATH_MAP: cantus-music-pvc is mounted at
            # /music on both sides now, so the two already name the same file
            # and the identity mapping is the correct one. Set it again the day
            # the mounts stop agreeing — playlist sync compares paths exactly
            # and refuses rather than guessing, so a mount it cannot translate
            # is a pass that recognises nothing.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: music
              mountPath: /music
            # Writable so Schall can remove a source it has imported when its
            # retention setting says delete. slskd writes folders 2775 and files
            # 664 as 568:568 (SLSKD_UMASK), and Schall carries group 568 through
            # fsGroup, so no chown is needed. Schall never deletes a copy it
            # refused or holds for review; only imported audio, after the
            # library copy is confirmed (schall internal/downloads/importer.go).
            - name: downloads
              mountPath: /downloads
            # Staging for browser uploads. Writable, and never a music folder.
            - name: uploads
              mountPath: /uploads
            # The root filesystem is read-only, so scratch space has to be given
            # rather than assumed. Schall transcodes a held copy to MP3 here
            # before a person can listen to it, and without somewhere to write
            # that, the one question no identifier can answer cannot be asked.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
      volumes:
        - name: music
          persistentVolumeClaim:
            claimName: cantus-music-pvc
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads-pvc
        # A claim rather than scratch space: an upload that failed its checks
        # keeps its bytes so somebody can look at why and discard it, and a
        # restart in the middle of that would otherwise take the evidence with
        # it. Nothing here is worth backing up — what survives moves to /music.
        - name: uploads
          persistentVolumeClaim:
            claimName: cantus-uploads-pvc
        # Deliberately not a PVC. Every preview is reproducible from the file it
        # came from and is pruned after a day, so losing the lot on a restart
        # costs one re-encode. The limit is what stops a review session filling
        # the node.
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
