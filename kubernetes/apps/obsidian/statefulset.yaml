---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: obsidian-sync
  namespace: obsidian-sync
  labels:
    app: obsidian-sync
spec:
  replicas: 1
  serviceName: obsidian-sync
  selector:
    matchLabels:
      app: obsidian-sync
  template:
    metadata:
      labels:
        app: obsidian-sync
      annotations:
        backup.velero.io/backup-volumes: "data"
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - sh
            - -c
            - |
              echo "Current permissions:"
              ls -lan /opt/couchdb/data
              echo "Fixing permissions for CouchDB (UID 5984)..."
              chown -Rv 5984:5984 /opt/couchdb/data
              chmod -Rv 755 /opt/couchdb/data
              echo "New permissions:"
              ls -lan /opt/couchdb/data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
        - name: copy-config
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - sh
            - -c
            - cp -v /config/obsidian.ini /local.d/obsidian.ini
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: local-d
              mountPath: /local.d
      containers:
        - name: couchdb
          image: couchdb:3.5.3@sha256:3611ce43bd32fe2368997fd41ec6e7270ec8d84aa5fc13c9828e5b15fd6bafe8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5984
              name: http
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/Berlin"
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: obsidian-sync-secret
                  key: COUCHDB_USER
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: obsidian-sync-secret
                  key: COUCHDB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
            # CouchDB reads every *.ini in local.d at start. The image's
            # entrypoint runs `find /opt/couchdb ! -user couchdb -exec chown`
            # under `set -e`, and chown fails on a read-only ConfigMap mount,
            # so the ini is copied into a writable emptyDir by the init
            # container instead of being mounted here directly.
            - name: local-d
              mountPath: /opt/couchdb/etc/local.d
          livenessProbe:
            httpGet:
              path: /
              port: 5984
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 5984
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: obsidian-sync-data-pvc
        - name: config
          configMap:
            name: obsidian-sync-config
        - name: local-d
          emptyDir: {}
