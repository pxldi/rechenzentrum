---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: overleaf
resources:
  - helmrelease.yaml
  - mongo-statefulset.yaml
  - mongo-service.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - pvc.yaml
  - secret.yaml
  - ingress.yaml
components:
  # Egress. The web container reaches overleaf-mongo and overleaf-redis by
  # Service name here, so the intra-namespace twin is required. The internet
  # rule is for OVERLEAF_EMAIL_SMTP_HOST, which is an external relay on 587.
  # allow-egress-to-ingress is a precaution for OVERLEAF_SITE_URL: it is an
  # identity setting rather than something the app fetches, but a pxldi.de name
  # resolves to the node or to the public address depending on which upstream
  # CoreDNS last asked, so a call to it would fail intermittently without this.
  - ../../../components/default-deny-egress
  - ../../../components/allow-dns
  - ../../../components/allow-intra-namespace-egress
  - ../../../components/allow-internet-egress
  - ../../../components/allow-egress-to-ingress
  - ../../infrastructure-config/networkpolicies/default-deny-ingress
  - ../../infrastructure-config/networkpolicies/allow-intra-namespace
  - ../../infrastructure-config/networkpolicies/allow-from-traefik
  - ../../infrastructure-config/networkpolicies/allow-from-monitoring
  - ../../infrastructure-config/networkpolicies/allow-from-homepage

# Resource metadata only: preserve existing Service/Deployment selectors and pod templates.
labels:
  - pairs:
      app.kubernetes.io/name: overleaf
      app.kubernetes.io/instance: overleaf
      app.kubernetes.io/component: application
      app.kubernetes.io/part-of: rechenzentrum
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
    includeTemplates: false
