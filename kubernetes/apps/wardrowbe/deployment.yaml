apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardrowbe-backend
  namespace: wardrowbe
  labels:
    app: wardrowbe-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wardrowbe-backend
  template:
    metadata:
      labels:
        app: wardrowbe-backend
      annotations:
        backup.velero.io/backup-volumes: uploads
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: backend
          image: ghcr.io/anyesh/wardrowbe:backend-1.5.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: TZ
              value: Europe/Berlin
            - name: DEBUG
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wardrowbe-credentials
                  key: DATABASE_URL
            - name: REDIS_URL
              value: redis://wardrowbe-redis:6379
            - name: STORAGE_PATH
              value: /data/uploads
            - name: APP_URL
              valueFrom:
                configMapKeyRef:
                  name: wardrowbe-config
                  key: APP_URL
            - name: AI_INTERNAL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: wardrowbe-config
                  key: AI_INTERNAL_ENABLED
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: wardrowbe-config
                  key: LOG_LEVEL
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: wardrowbe-uploads
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardrowbe-worker
  namespace: wardrowbe
  labels:
    app: wardrowbe-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wardrowbe-worker
  template:
    metadata:
      labels:
        app: wardrowbe-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wait-for-backend
          image: ghcr.io/anyesh/wardrowbe:backend-1.5.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - until curl -fsS http://wardrowbe-backend:8000/api/v1/health; do sleep 5; done
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      containers:
        - name: worker
          image: ghcr.io/anyesh/wardrowbe:backend-1.5.1
          imagePullPolicy: IfNotPresent
          command:
            - arq
            - app.workers.worker.WorkerSettings
          env:
            - name: TZ
              value: Europe/Berlin
            - name: DEBUG
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wardrowbe-credentials
                  key: DATABASE_URL
            - name: REDIS_URL
              value: redis://wardrowbe-redis:6379
            - name: STORAGE_PATH
              value: /data/uploads
            - name: APP_URL
              valueFrom:
                configMapKeyRef:
                  name: wardrowbe-config
                  key: APP_URL
            - name: AI_INTERNAL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: wardrowbe-config
                  key: AI_INTERNAL_ENABLED
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: wardrowbe-config
                  key: LOG_LEVEL
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: wardrowbe-uploads
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardrowbe-frontend
  namespace: wardrowbe
  labels:
    app: wardrowbe-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wardrowbe-frontend
  template:
    metadata:
      labels:
        app: wardrowbe-frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: ghcr.io/anyesh/wardrowbe:frontend-1.5.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: TZ
              value: Europe/Berlin
            - name: DEV_MODE
              value: "true"
            - name: NEXTAUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: wardrowbe-config
                  key: NEXTAUTH_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: wardrowbe-credentials
                  key: NEXTAUTH_SECRET
            - name: BACKEND_URL
              value: http://wardrowbe-backend:8000
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
