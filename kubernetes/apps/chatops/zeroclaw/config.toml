# ZeroClaw, the Telegram agent. Validated against v0.8.5 with
# `zeroclaw config list` and `zeroclaw doctor` before it was committed.
#
# Secrets are not in here. They arrive as environment variables from the
# chatops-credentials Secret using ZeroClaw's schema-mirror grammar
# (ZEROCLAW_<path with __ separators>): the Telegram bot token and the list of
# Telegram user ids allowed to talk to the bot.
schema_version = 3

# The model runs on the operator's ChatGPT subscription through the Codex
# backend, not a metered API key. requires_openai_auth reads ZeroClaw's own
# `openai-codex` auth profile, which lives encrypted on the PVC and is created
# once by hand with a device-code login (docs/CHATOPS.md). It is a separate
# login from claudebox's: Codex refresh tokens rotate and allow one owner, so
# sharing one would make the two log each other out. The model must be an
# exact ID the Codex backend serves to a ChatGPT account, and that list moves
# (gpt-5.4 was dropped): ~/.codex/models_cache.json on any machine with the
# Codex CLI shows the current slugs.
[providers.models.openai.default]
model = "gpt-5.6-sol"
wire_api = "responses"
requires_openai_auth = true

[agents.haus]
enabled = true
model_provider = "openai.default"
risk_profile = "haus"
runtime_profile = "default"
channels = ["telegram.home"]
mcp_bundles = ["homelab"]
cron_jobs = ["planning_nudge", "evening_check"]

[agents.haus.workspace]
# On the PVC, so memory survives a restart. SOUL.md and AGENTS.md are mounted
# into it from the ConfigMap.
path = "/zeroclaw-data/zeroclaw/agents/haus/workspace"

# Supervised: reads run on their own, the Tandoor and calendar writes put an approve/deny
# keyboard in the Telegram chat first. log_cooked, append_note and
# log_learned run on their own: they record a fact and are cheap to undo,
# and the vault keeps history. write_note replaces a whole note, so it asks. allowed_tools pins the
# built-ins to memory and the clock; MCP tools are admitted by the SDK's
# `<server>__<tool>` rule, so shell, file, http and browser tools are out.
[risk_profiles.haus]
level = "supervised"
allowed_tools = ["memory_recall", "memory_store", "memory_search", "time"]
auto_approve = [
  "memory_recall", "memory_store", "memory_search", "time",
  "tandoor__search_recipes", "tandoor__get_recipe", "tandoor__list_meal_plan",
  "tandoor__list_meal_types", "tandoor__list_keywords",
  "tandoor__leftovers", "tandoor__recipes_for_leftovers", "tandoor__log_cooked",
  "tandoor__list_shopping_list",
  "calendar__list_calendars", "calendar__list_events", "calendar__search_events",
  "vault__list_notes", "vault__read_note", "vault__search_notes",
  "vault__append_note", "vault__log_learned",
  "paperless__search_documents", "paperless__list_documents", "paperless__get_document",
  "paperless__list_labels",
  "homeassistant__who_is_home", "homeassistant__list_entities", "homeassistant__get_state",
  "homelab__list_services", "homelab__list_workloads", "homelab__workload_status",
  "homelab__pod_logs", "homelab__events", "homelab__flux_status", "homelab__backups",
]
always_ask = [
  "tandoor__create_recipe", "tandoor__update_recipe", "tandoor__add_meal_plan",
  "tandoor__set_pack_size", "tandoor__move_meal_plan",
  "tandoor__add_shopping_item", "tandoor__remove_shopping_item",
  "calendar__create_event", "calendar__move_event", "calendar__delete_event",
  "vault__write_note",
  "paperless__update_document", "paperless__create_tag",
  "homeassistant__turn_on", "homeassistant__turn_off",
]

# The image is distroless: no sh anywhere. ZeroClaw's native runtime still
# resolves runtime.shell at startup and, when it is missing, fails the whole
# channels component ("runtime.shell \"sh\" was not found on PATH"), so
# Telegram never starts. The check only wants an executable file, and the
# shell tool is not in allowed_tools, so point it at the ZeroClaw binary:
# anything that did try to run a shell command would fail rather than run.
[runtime]
shell = "/usr/local/bin/zeroclaw"

[runtime_profiles.default]

[channels.telegram.home]
enabled = true
# bot_token: ZEROCLAW_channels__telegram__home__bot_token

[peer_groups.telegram_home]
channel = "telegram.home"
agents = ["haus"]
# external_peers: ZEROCLAW_peer_groups__telegram_home__external_peers, a JSON
# list of numeric Telegram user ids. Non-empty, so the one-time /bind pairing
# flow (which would try to rewrite this read-only file) never runs.
external_peers = []

# The two proactive nudges. Declared here rather than with `zeroclaw cron
# add` so they live in git; the scheduler syncs them into its database at
# startup and config wins over the database copy. `delivery.to` is the chat
# id; the env-override grammar cannot reach into `[cron.<alias>]`, so the
# render-config init container substitutes the placeholder from a Secret
# before ZeroClaw reads this file. Announce mode delivers whatever the agent answers, and an empty answer
# becomes "agent job executed", so each prompt says to answer exactly
# NO_REPLY when there is nothing to say; that sentinel is the only thing
# the scheduler suppresses. session_target = "main" keeps the nudge in the
# conversation, so a reply like "1" or "ja" is understood.
[cron.planning_nudge]
name = "Kochplanung"
job_type = "agent"
schedule = { kind = "cron", expr = "0 16 * * 0,2,4", tz = "Europe/Berlin" }
session_target = "main"
prompt = """Es ist Nachmittag. Prüfe mit tandoor__list_meal_plan, ob für heute und die nächsten zwei Tage schon ein Essen geplant ist. Wenn für heute oder morgen etwas geplant ist, antworte mit exakt NO_REPLY und sonst nichts.
Wenn nicht: hole tandoor__leftovers und tandoor__recipes_for_leftovers und schlage 2 bis 3 Rezepte vor, nummeriert. Reste zuerst, besonders was bald abläuft; kürzlich Gekochtes auslassen. Pro Vorschlag eine Zeile: Name, Portionen, was fehlt. Höchstens 8 Zeilen insgesamt, keine Einleitung. Schließe mit einem Satz: Antworte mit der Nummer, dann plane ich es für heute Abend ein und setze das Fehlende auf die Einkaufsliste."""
delivery = { mode = "announce", channel = "telegram.home", to = "@TELEGRAM_CHAT_ID@", best_effort = true }

[cron.evening_check]
name = "Abendcheck"
job_type = "agent"
schedule = { kind = "cron", expr = "0 20 * * *", tz = "Europe/Berlin" }
session_target = "main"
prompt = """Es ist Abend. Prüfe mit tandoor__list_meal_plan, was für heute geplant war. Wenn für heute nichts geplant ist, antworte mit exakt NO_REPLY und sonst nichts.
Wenn etwas geplant ist, frage in einem Satz: Hast du <Titel> gekocht? Keine Einleitung, keine Erklärung, nichts weiter."""
delivery = { mode = "announce", channel = "telegram.home", to = "@TELEGRAM_CHAT_ID@", best_effort = true }

[memory]
# No embedding provider is configured, so keyword search rather than a hybrid
# that silently degrades to it.
search_mode = "bm25"

[mcp]
enabled = true

[[mcp.servers]]
name = "tandoor"
transport = "http"
url = "http://tandoor-mcp.chatops.svc.cluster.local:8000/mcp"

[[mcp.servers]]
name = "homelab"
transport = "http"
url = "http://homelab-mcp.chatops.svc.cluster.local:8000/mcp"

[[mcp.servers]]
name = "calendar"
transport = "http"
url = "http://calendar-mcp.chatops.svc.cluster.local:8000/mcp"

[[mcp.servers]]
name = "vault"
transport = "http"
url = "http://vault-mcp.chatops.svc.cluster.local:8000/mcp"

[[mcp.servers]]
name = "paperless"
transport = "http"
url = "http://paperless-mcp.chatops.svc.cluster.local:8000/mcp"

[[mcp.servers]]
name = "homeassistant"
transport = "http"
url = "http://homeassistant-mcp.chatops.svc.cluster.local:8000/mcp"

[mcp_bundles.homelab]
servers = ["tandoor", "homelab", "calendar", "vault", "paperless", "homeassistant"]

# The dashboard stays on the pod's loopback. Nothing routes to it, and the
# liveness probe uses `zeroclaw status` rather than an HTTP port.
[gateway]
host = "127.0.0.1"
port = 42617
require_pairing = true
check_updates = false

# The subscription path is recorded at $0 per call (ZeroClaw cannot see the
# plan's allowance), so these caps only bite on a metered provider.
[cost]
enabled = true
daily_limit_usd = 3.0
monthly_limit_usd = 30.0
warn_at_percent = 80
