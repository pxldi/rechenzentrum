---
# House only for now. The first passkey is registered from home, before invite-
# only signup is on; then the route goes public so the phone works at the gym.
# The passkey is bound to the hostname, not to the route, so it keeps working.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opengym
  namespace: opengym
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`gym.pxldi.de`)
      middlewares:
        - name: internal-only
          namespace: traefik
      services:
        - name: opengym
          port: 80
