---
apiVersion: v1
kind: Service
metadata:
  name: sure-web
  namespace: sure
spec:
  selector:
    app.kubernetes.io/name: sure
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure-web
  namespace: sure
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sure
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sure
        app.kubernetes.io/component: web
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:18
          command:
            - sh
            - -c
            - |
              until pg_isready -h sure-db -p 5432 -U "$POSTGRES_USER"; do
                echo "waiting for db..."
                sleep 2
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: sure-env
                  key: POSTGRES_USER
      containers:
        - name: web
          image: ghcr.io/we-promise/sure:0.7.4
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: sure-env
            - secretRef:
                name: sure-secrets
          volumeMounts:
            - name: app-storage
              mountPath: /rails/storage
          readinessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: sure-app-storage
