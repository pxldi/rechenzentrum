# The Actions cache and the Docker daemon's image and build cache. Nothing here
# needs a backup: the runner's identity is in secret.yaml, and images are
# pulled again. No Velero annotation on purpose.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runner-data
  namespace: forgejo-runner
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-ssd
  resources:
    requests:
      storage: 50Gi
