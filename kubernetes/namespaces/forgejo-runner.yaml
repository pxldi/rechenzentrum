---
# privileged: the Docker daemon that runs the Actions jobs needs it, which
# baseline forbids and PSA cannot exempt per pod. The runner and its daemon are
# the only workload here, so the label covers exactly one pod.
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo-runner
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.33
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: latest
    kubernetes.io/metadata.name: forgejo-runner
