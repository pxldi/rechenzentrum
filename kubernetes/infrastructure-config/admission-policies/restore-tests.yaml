---
# The second lock on the weekly restore tests' write access, in the shape of
# homelab-mcp-actions. RBAC gives each test account create on CNPG Clusters or
# Velero Restores, and create cannot be narrowed by name or content:
#
#   a Cluster could name the production ObjectStore with WAL archiving on,
#   and a recovered copy archiving under the production serverName would
#   overwrite the history it came from;
#   a Restore could map any backed-up namespace, secrets included, into a
#   namespace its creator can read.
#
# This policy holds each grant to the one object the test makes:
#
#   Cluster create   named restore-test, one instance, bootstrapped by recovery,
#                    no spec.plugins (so no WAL archiver), no spec.backup, no
#                    superuser access, no extra env or projected volumes
#   Restore create   in velero, one of three names, each restoring its one
#                    source namespace (gotify weekly; immich and nextcloud
#                    monthly) into velero-restore-test only, pods, claims and their PVs
#                    only (Velero never creates a file-system-backed PV; it
#                    needs to see it to provision a new one), no hooks, never
#                    overwriting what exists
#   delete           only those names (RBAC says the same)
#
# It matches nothing but requests from the four test ServiceAccounts.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restore-tests
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [postgresql.cnpg.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [clusters]
      - apiGroups: [velero.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [restores]
  matchConditions:
    - name: restore-test-accounts-only
      expression: >-
        request.userInfo.username in [
          'system:serviceaccount:tandoor:restore-test-runner',
          'system:serviceaccount:immich:restore-test-runner',
          'system:serviceaccount:media:restore-test-runner',
          'system:serviceaccount:velero-restore-test:restore-test']
  variables:
    - name: isCluster
      expression: request.resource.resource == 'clusters'
    - name: isRestore
      expression: request.resource.resource == 'restores'
    - name: name
      expression: >-
        request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name
    # Each test Restore and the one namespace it may read.
    - name: restoreSources
      expression: >-
        {'velero-restore-test-gotify': 'gotify',
         'velero-restore-test-immich-library': 'immich',
         'velero-restore-test-nextcloud-data': 'nextcloud'}
  validations:
    # RBAC grants no update; this keeps it that way if a Role ever widens.
    - expression: request.operation != 'UPDATE'
      message: A restore test account may create and delete, never update.
      reason: Forbidden
    - expression: >-
        !variables.isCluster || variables.name == 'restore-test'
      message: A restore test may only create or delete the Cluster named restore-test.
      reason: Forbidden
    - expression: >-
        !variables.isRestore || (request.namespace == 'velero' &&
          variables.name in variables.restoreSources)
      message: >-
        A restore test may only create or delete its own named Restores in
        velero.
      reason: Forbidden
    - expression: >-
        !variables.isCluster || request.operation != 'CREATE' || (
          (!has(object.spec.instances) || object.spec.instances == 1) &&
          has(object.spec.bootstrap) && has(object.spec.bootstrap.recovery) &&
          (!has(object.spec.plugins) || size(object.spec.plugins) == 0) &&
          !has(object.spec.backup) &&
          !(has(object.spec.enableSuperuserAccess) && object.spec.enableSuperuserAccess) &&
          !has(object.spec.env) && !has(object.spec.envFrom) &&
          !has(object.spec.projectedVolumeTemplate))
      message: >-
        A restore test Cluster must be a single recovery instance with no
        plugins, no backup, no superuser access and no extra env or volumes.
      reason: Forbidden
    - expression: >-
        !variables.isRestore || request.operation != 'CREATE' || (
          has(object.spec.includedNamespaces) &&
          object.spec.includedNamespaces == [variables.restoreSources[variables.name]] &&
          has(object.spec.namespaceMapping) &&
          object.spec.namespaceMapping == {variables.restoreSources[variables.name]: 'velero-restore-test'} &&
          has(object.spec.includedResources) &&
          size(object.spec.includedResources) > 0 &&
          object.spec.includedResources.all(r, r in ['pods', 'persistentvolumeclaims', 'persistentvolumes']) &&
          !has(object.spec.hooks) &&
          (!has(object.spec.resourceModifier) ||
            object.spec.resourceModifier.name.startsWith('velero-restore-test-')) &&
          (!has(object.spec.existingResourcePolicy) ||
            object.spec.existingResourcePolicy == 'none'))
      message: >-
        A restore test Restore may only bring its own app's pods, claims and
        PVs into velero-restore-test, without hooks, overwriting nothing.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: restore-tests
spec:
  policyName: restore-tests
  # Deny from the start, like homelab-mcp-actions: the grants are new and must
  # never exist without it.
  validationActions: [Deny, Audit]
  matchResources: {}
