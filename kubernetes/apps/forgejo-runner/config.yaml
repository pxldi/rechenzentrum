# forgejo-runner daemon configuration. deployment.yaml appends the `server`
# section at start, because the runner's UUID lives in the Secret and this
# repository is public.
log:
  level: info
runner:
  labels:
    - ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-24.04
    - ubuntu-24.04:docker://ghcr.io/catthehacker/ubuntu:act-24.04
  # One job at a time. Two would compete for the node with everything else.
  capacity: 1
  timeout: 3h
  fetch_timeout: 5s
  fetch_interval: 5s
cache:
  enabled: true
  dir: /data/cache
container:
  # Jobs get their own bridge network per run inside the pod's daemon.
  network: ""
  privileged: false
  # Do not hand the daemon's socket to job containers.
  docker_host: "-"
  valid_volumes: []
