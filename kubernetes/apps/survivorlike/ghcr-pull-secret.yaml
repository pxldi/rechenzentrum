# Pull credential for ghcr.io/pxldi/survivorlike-asset-viewer, which is
# private. As committed it holds an empty {"auths":{}}: valid, so Flux applies
# it, but the pull fails until a token is set.
#
# Token: a classic GitHub personal access token with read:packages and
# nothing else. Set it from the repo root in bash, so it never touches a
# plaintext file or the shell history:
#
#   read -rs TOKEN
#   sops set kubernetes/apps/survivorlike/ghcr-pull-secret.yaml \
#     '["stringData"][".dockerconfigjson"]' \
#     "$(jq -cn --arg a "$(printf 'pxldi:%s' "$TOKEN" | base64 -w0)" \
#       '{auths: {"ghcr.io": {auth: $a}}} | tojson')"
#   unset TOKEN
apiVersion: v1
kind: Secret
metadata:
    name: ghcr-pull
    namespace: survivorlike
type: kubernetes.io/dockerconfigjson
