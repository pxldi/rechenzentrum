---
# Builds livesync-bridge for the bot's vault mirror in kubernetes/apps/chatops.
# Same shape as homelab-mcp-image.yml: pull requests build and smoke-test, a
# push to main or a manual run publishes, tagged with the commit it built.
name: LiveSync Bridge Image

on:
  # So a build can be started by hand once ENABLE_IMAGE_PUBLISH is set,
  # without a commit to trigger it.
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "images/livesync-bridge/**"
      - ".github/workflows/livesync-bridge-image.yml"
  push:
    branches: ["main"]
    paths:
      - "images/livesync-bridge/**"
      - ".github/workflows/livesync-bridge-image.yml"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/livesync-bridge
  # On a pull_request `github.sha` is the ephemeral merge commit; the branch
  # head is the commit that actually holds the Dockerfile.
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    if: vars.ENABLE_IMAGE_PUBLISH == 'true'
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: images/livesync-bridge/Dockerfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: images/livesync-bridge
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ env.SHA }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:main', env.IMAGE) || '' }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}
          provenance: false

      # With no peers configured the bridge must still start and say so.
      - name: Smoke-test the bridge
        run: |
          set -euo pipefail
          mkdir -p /tmp/dat && echo '{"peers":[]}' > /tmp/dat/config.json
          docker run -d --rm --name bridge --user 1993:1993 \
            -v /tmp/dat:/app/dat:ro "${IMAGE}:sha-${SHA}"
          for _ in $(seq 1 30); do
            if docker logs bridge 2>&1 | grep -q "LiveSync Bridge is now started"; then break; fi
            sleep 1
          done
          docker logs bridge 2>&1 | grep -q "LiveSync Bridge is now started"
          docker stop bridge >/dev/null
