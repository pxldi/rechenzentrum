---
name: Main Push Watchdog

# `main` has no branch protection and cannot have any: rulesets are a paid
# feature on private repositories and `pxldi-labs` is on the Free plan, so
# every protection endpoint answers 403. Merging to `main` is what deploys to
# the cluster, which makes an unreviewed push an unreviewed deploy.
#
# Two credentials can do it today and neither is a person sitting at a
# keyboard: `pxldi-agent` has write access, and Renovate's GitHub App
# credential lives in a pod inside the cluster it deploys to.
#
# This cannot prevent that. It notices it, within about a minute, and says so
# out loud — which is the difference between "nobody merged anything odd" as a
# belief and as a checked fact.
#
# It runs on GitHub-hosted infrastructure: a push that breaks the cluster
# would take an in-cluster detector with it, and this is precisely the case
# where that happens.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_notification:
        description: >-
          Send a test alert regardless of how the last commit arrived. The
          Gotify hop is otherwise only exercised by a real unreviewed push,
          which is when you least want to find out it was misconfigured.
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  check-provenance:
    if: vars.ENABLE_NOTIFICATIONS == 'true'
    name: Did every pushed commit come from a PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Look up the associated pull request for each commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
          # github.event.commits is absent on workflow_dispatch, and a force
          # push can report commits that no longer resolve. Both are handled
          # below rather than assumed away.
          EVENT_PATH_COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json, os, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          raw = os.environ.get("EVENT_PATH_COMMITS") or "null"
          try:
              commits = json.loads(raw) or []
          except json.JSONDecodeError:
              commits = []

          def api(path):
              r = subprocess.run(["gh", "api", path], capture_output=True, text=True)
              if r.returncode != 0:
                  return None
              return json.loads(r.stdout)

          unreviewed = []
          for c in commits:
              sha = c.get("id") or ""
              if not sha:
                  continue
              # The listPullRequestsAssociatedWithCommit endpoint. A squash
              # merge, a merge commit and a rebase merge all resolve to their
              # PR here; a commit pushed straight to main resolves to nothing.
              pulls = api(f"repos/{repo}/commits/{sha}/pulls")
              if pulls is None:
                  # Unresolvable (force push, or the commit is already gone).
                  # Treat as suspicious rather than silently fine — a force
                  # push to main is itself worth waking up for.
                  unreviewed.append(f"{sha[:8]} — could not resolve (force push?)")
                  continue
              if not pulls:
                  msg = (c.get("message") or "").splitlines()[0][:72]
                  author = (c.get("author") or {}).get("name", "unknown")
                  unreviewed.append(f"{sha[:8]} by {author} — {msg}")

          if os.environ.get("TEST_NOTIFICATION") == "true":
              unreviewed = ["Verifying the Gotify delivery path end to end."]
              title = "Main push watchdog test (no real unreviewed push)"
          else:
              title = f"Unreviewed push to main: {len(unreviewed)} commit(s)"

          print(f"count={len(unreviewed)}")
          print(f"title={title}")
          # Multi-line step outputs need a delimiter. Commit messages are
          # repository content and therefore attacker-influenced, so the
          # delimiter is checked against the payload rather than assumed
          # absent: a commit message containing the delimiter would otherwise
          # let a pushed commit write arbitrary step outputs.
          body = "\n".join(unreviewed)
          delim = "PUSH_EOF"
          while delim in body:
              delim += "_X"
          print(f"detail<<{delim}")
          print(body)
          print(delim)
          PY

      - name: Notify Gotify
        if: steps.check.outputs.count != '0'
        env:
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          DETAIL: ${{ steps.check.outputs.detail }}
          TITLE: ${{ steps.check.outputs.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Header, not ?token=, so the token stays out of proxy access logs.
          curl -sS --fail-with-body -X POST \
            "https://gotify.pxldi.de/message" \
            -H "X-Gotify-Key: ${GOTIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(jq -n \
              --arg title "${TITLE}" \
              --arg message "${DETAIL}

          These commits reached main without an associated pull request, which
          means they deployed to the cluster without review. If this was not
          you, check what pxldi-agent and the in-cluster Renovate credential
          have been doing.

          ${RUN_URL}" \
              '{title: $title, message: $message, priority: 8}')"

      - name: Fail the run so it is also visible in the Actions UI
        if: steps.check.outputs.count != '0' && !inputs.test_notification
        run: |
          echo "::error::${{ steps.check.outputs.count }} commit(s) reached main without a PR"
          exit 1
