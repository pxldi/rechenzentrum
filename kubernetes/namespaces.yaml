apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespaces
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/namespaces
  # Namespace deletion cascades to workloads and PVCs. Retirement is explicit.
  prune: false
  wait: true
  timeout: 5m
