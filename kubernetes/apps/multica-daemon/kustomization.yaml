---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: multica-daemon
resources:
  - namespace.yaml
  - pvc.yaml
  - secret.yaml
  - entrypoint-configmap.yaml
  - deployment.yaml
components:
  # No ingress of any kind: the daemon dials out to the server and serves
  # nothing. No allow-from-traefik, no Service.
  - ../../infrastructure-config/networkpolicies/default-deny-ingress
  - ../../infrastructure-config/networkpolicies/allow-from-monitoring
