---
# Firefly III's database. On CNPG from the start: WAL is archived to B2 and a
# base backup runs daily, so a restore can go to any point in the last 30 days.
# The audit of 2026-09-25 found nine app databases backed up only as live file
# copies; this one is not added to that list.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: firefly-db
  namespace: firefly
spec:
  inheritedMetadata:
    annotations:
      backup.velero.io/backup-volumes-excludes: pgdata,pg-wal,shm,scratch-data,plugins
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: firefly-db-backup
        serverName: firefly-db

  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6

  bootstrap:
    initdb:
      database: firefly
      owner: firefly
      secret:
        name: firefly-db-credentials

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
  storage:
    storageClass: local-ssd
    size: 5Gi

  walStorage:
    storageClass: local-ssd
    size: 2Gi
