# Planka: kanban boards for the game projects. Boards live in Postgres, uploads
# on planka-data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planka
  namespace: planka
  labels:
    app: planka
spec:
  replicas: 1
  # planka-data is RWO on the one node, and every start runs the database
  # migrations, so two pods must never run at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: planka
  template:
    metadata:
      labels:
        app: planka
      annotations:
        backup.velero.io/backup-volumes: data
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Planka has no theme setting. On the running image, this:
      # 1. builds generated.css from Planka's compiled CSS with remap.js (a dark
      #    copy of every rule that sets a light neutral colour),
      # 2. copies theme.css beside it,
      # 3. copies index.ejs and links both after Planka's own stylesheet.
      # Both are served from /app/public/custom. A failed remap leaves
      # generated.css empty; a release without </head> starts unthemed.
      initContainers:
        - name: inject-theme
          image: ghcr.io/plankanban/planka:2.3.1@sha256:f767ab97b878265ea1fff826867718d6ffa95dac04cd979fb5db82489806fb51
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              node /theme/remap.js /app/public/assets/index-*.css > /custom/generated.css \
                || { echo "remap.js failed; generated.css is empty" >&2; : > /custom/generated.css; }
              cp /theme/theme.css /custom/theme.css
              sed 's#</head>#<link rel="stylesheet" href="<%- basePath %>/custom/generated.css"><link rel="stylesheet" href="<%- basePath %>/custom/theme.css"></head>#' \
                /app/views/index.ejs > /views/index.ejs
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: theme
              mountPath: /theme
              readOnly: true
            - name: custom
              mountPath: /custom
            - name: views
              mountPath: /views
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      containers:
        - name: planka
          image: ghcr.io/plankanban/planka:2.3.1@sha256:f767ab97b878265ea1fff826867718d6ffa95dac04cd979fb5db82489806fb51
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 1337
          env:
            - name: TZ
              value: Europe/Berlin
            - name: BASE_URL
              value: https://todo.pxldi.de
            # Traefik passes the client address (externalTrafficPolicy Local),
            # and the sign-in rate limit is keyed on it.
            - name: TRUST_PROXY
              value: "true"
            - name: LOG_FILE
              value: none
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: planka-app
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: planka-app
                  key: SECRET_KEY
            # The first admin. Planka refuses to edit or delete the account
            # whose email is set here, which keeps one admin for good.
            - name: DEFAULT_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: planka-app
                  key: DEFAULT_ADMIN_EMAIL
            - name: DEFAULT_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: planka-app
                  key: DEFAULT_ADMIN_USERNAME
            - name: DEFAULT_ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: planka-app
                  key: DEFAULT_ADMIN_NAME
            - name: DEFAULT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: planka-app
                  key: DEFAULT_ADMIN_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # The start script refuses to run unless .tmp and logs are writable.
          # /tmp holds the config of the outgoing-request proxy it starts.
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: views
              mountPath: /app/views
              readOnly: true
            - name: custom
              mountPath: /app/public/custom
              readOnly: true
            - name: scratch
              mountPath: /app/.tmp
              subPath: app-tmp
            - name: scratch
              mountPath: /app/logs
              subPath: logs
            - name: scratch
              mountPath: /tmp
              subPath: tmp
          # Every start migrates the database before the port opens.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: planka-data
        - name: scratch
          emptyDir: {}
        - name: views
          emptyDir: {}
        - name: custom
          emptyDir: {}
        - name: theme
          configMap:
            name: planka-theme
