# Forgejo: the house git forge. Repositories and LFS live on forgejo-data,
# everything else in Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app: forgejo
spec:
  replicas: 1
  # forgejo-data is RWO on the one node and Forgejo migrates the database on
  # start, so two pods must never run at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
      annotations:
        backup.velero.io/backup-volumes: data
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forgejo
          # Long-term support line; Renovate keeps it on the newest patch.
          image: codeberg.org/forgejo/forgejo:15.0.12-rootless@sha256:b670d7724274e1d5c7801b76017b7267e6e5432aa4fe8bed49f781d09476b9dd
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: TZ
              value: Europe/Berlin
            # The rootless image turns FORGEJO__section__KEY variables into
            # app.ini on every start. app.ini sits on an emptyDir, so every
            # secret that must survive a restart comes from the Secret below.
            - name: FORGEJO__server__DOMAIN
              value: git.pxldi.de
            - name: FORGEJO__server__ROOT_URL
              value: https://git.pxldi.de/
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            # No SSH service: clones use HTTPS only.
            - name: FORGEJO__server__DISABLE_SSH
              value: "true"
            - name: FORGEJO__server__LFS_START_SERVER
              value: "true"
            - name: FORGEJO__database__DB_TYPE
              value: postgres
            - name: FORGEJO__database__HOST
              value: forgejo-postgresql-rw:5432
            - name: FORGEJO__database__NAME
              value: forgejo
            - name: FORGEJO__database__USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-credentials
                  key: username
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-credentials
                  key: password
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: forgejo-app
                  key: SECRET_KEY
            - name: FORGEJO__security__INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-app
                  key: INTERNAL_TOKEN
            - name: FORGEJO__oauth2__JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-app
                  key: JWT_SECRET
            - name: FORGEJO__server__LFS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-app
                  key: LFS_JWT_SECRET
            # The admin registered on the first start. New accounts come from
            # the admin panel only.
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            - name: FORGEJO__service__REQUIRE_SIGNIN_VIEW
              value: "true"
            - name: FORGEJO__actions__ENABLED
              value: "true"
            - name: FORGEJO__log__MODE
              value: console
            - name: FORGEJO__cache__ADAPTER
              value: memory
            - name: FORGEJO__session__PROVIDER
              value: db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
            - name: config
              mountPath: /etc/gitea
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 768Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
