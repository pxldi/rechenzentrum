---
# Builds survivorlike-bench, the headless Godot image for the game's balance
# benches in kubernetes/apps/survivorlike-bench. Same shape as
# livesync-bridge-image.yml: pull requests build and smoke-test, a push to main
# or a manual run publishes, tagged with the commit it built.
name: Survivorlike Bench Image

on:
  # So a build can be started by hand once ENABLE_IMAGE_PUBLISH is set,
  # without a commit to trigger it.
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "images/survivorlike-bench/**"
      - ".github/workflows/survivorlike-bench-image.yml"
  push:
    branches: ["main"]
    paths:
      - "images/survivorlike-bench/**"
      - ".github/workflows/survivorlike-bench-image.yml"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/survivorlike-bench
  # On a pull_request `github.sha` is the ephemeral merge commit; the branch
  # head is the commit that actually holds the Dockerfile.
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    if: vars.ENABLE_IMAGE_PUBLISH == 'true'
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign trades this token for a short-lived certificate.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: images/survivorlike-bench/Dockerfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/survivorlike-bench
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ env.SHA }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:main', env.IMAGE) || '' }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}
          provenance: false

      # Scans the image just built: loaded locally on a pull request, pulled
      # from GHCR after a push. The first step lists HIGH and CRITICAL in the
      # job log; the second fails the build on a CRITICAL with a fix available.
      # An unfixed one does not fail, because no change here could clear it.
      - name: List high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ env.SHA }}
          severity: HIGH,CRITICAL
          format: table
      - name: Gate on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ env.SHA }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-setup-trivy: true

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless: the signature binds the pushed digest to this workflow in this
      # repository through GitHub's OIDC identity, so there is no key to keep.
      # Check one with
      #   cosign verify "$IMAGE@<digest>" \
      #     --certificate-identity-regexp '^https://github.com/pxldi/rechenzentrum/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the pushed digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # The game is private and not in the image, so this checks what can be
      # checked without it: the engine version, the glibc the game's native
      # library needs, and that bench-job rejects a queue entry without
      # --jobs before it fetches anything.
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint godot "${IMAGE}:sha-${SHA}" --headless --version \
            | grep -q '^4\.7\.2\.stable'
          glibc=$(docker run --rm --entrypoint ldd "${IMAGE}:sha-${SHA}" --version | head -1 | awk '{print $NF}')
          echo "glibc $glibc"
          printf '2.43\n%s\n' "$glibc" | sort -CV
          mkdir -p /tmp/results && chmod 777 /tmp/results
          if docker run --rm -v /tmp/results:/results -e REF=main -e RUN=ci \
              -e QUEUE='[{"name":"x","cmd":["tools/run_bench.py"]}]' "${IMAGE}:sha-${SHA}"; then
            echo "bench-job accepted a queue entry without --jobs" >&2; exit 1
          fi
          grep -q "must pass --jobs" /tmp/results/ci/job.log
