---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - helmrelease.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - db-dump.yaml
  - healthchecks-secret.yaml
components:
  - ../../infrastructure-config/networkpolicies/default-deny-ingress
  - ../../infrastructure-config/networkpolicies/allow-intra-namespace
  - ../../infrastructure-config/networkpolicies/allow-from-traefik
