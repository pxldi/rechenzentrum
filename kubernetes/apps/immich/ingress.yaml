---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich
  namespace: immich
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`photos.pxldi.de`)
      middlewares:
        - name: internal-or-cluster
          namespace: traefik
      services:
        - name: immich-server
          port: 2283
---
# The same routes on the Cloudflare Tunnel entrypoint, without the house
# allowlist: the remote address there is a cloudflared pod.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich-tunnel
  namespace: immich
spec:
  entryPoints:
    # Public through the Cloudflare Tunnel; family members use it off the tailnet.
    - tunnel
  routes:
    - kind: Rule
      match: Host(`photos.pxldi.de`)
      services:
        - name: immich-server
          port: 2283
