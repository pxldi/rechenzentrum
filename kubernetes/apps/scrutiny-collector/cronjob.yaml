---
# Reads SMART data from every disk smartctl finds and posts it to the web API
# in the scrutiny namespace. The only privileged pod of the two: opening raw
# block and NVMe devices for SMART needs it, and this namespace exists so the
# workload-baseline exception covers nothing else.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scrutiny-collector
  namespace: scrutiny-collector
spec:
  # Once a day. A read of SMART counters writes nothing to a disk; the HDDs
  # spin down after 2 hours idle (nix/modules/quiet.nix), so this wakes a
  # sleeping one at most once a day. No `-n standby`: it would also skip the
  # HDDs on most days, and smartctl --info has no such switch.
  schedule: "30 2 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: scrutiny-collector
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          containers:
            - name: collector
              image: ghcr.io/analogj/scrutiny:v0.10.0-collector@sha256:372493d3edf473571b806efb5922e8868537af644b3817536695cae05abd4f2c
              # The wait is for k3s's NetworkPolicy controller: it adds a new
              # pod's address to the allow rules a few seconds after the pod
              # starts. The collector posts within a millisecond, so without
              # the wait every run was refused on its way to the API.
              command:
                - sh
                - -c
                - sleep 20 && exec /opt/scrutiny/bin/scrutiny-collector-metrics run
              env:
                - name: COLLECTOR_API_ENDPOINT
                  value: http://scrutiny.scrutiny.svc.cluster.local:8080
                - name: COLLECTOR_HOST_ID
                  value: rechenzentrum
              securityContext:
                privileged: true
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                # Device metadata (model, serial, WWN) smartctl --scan uses.
                - name: udev
                  mountPath: /run/udev
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: udev
              hostPath:
                path: /run/udev
                type: Directory
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
