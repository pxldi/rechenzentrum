---
apiVersion: v1
kind: ConfigMap
metadata:
  name: obsidian-sync-config
  namespace: obsidian-sync
data:
  obsidian.ini: |
    [couchdb]
    single_node=true
    max_document_size = 50000000

    [chttpd]
    max_http_request_size = 4294967296

    [chttpd_auth]
    authentication_redirect = /_utils/session.html

    # require_valid_user is off on purpose: the liveness probe does an
    # unauthenticated GET / and CouchDB would answer 401, which kubelet
    # counts as a failure. Both databases carry an admin-only _security
    # instead, so anonymous requests are refused per database.

    [httpd]
    WWW-Authenticate = Basic realm="administrator"
    enable_cors = true
    bind_address = 0.0.0.0

    [cors]
    origins = app://obsidian.md,capacitor://localhost,http://localhost
    credentials = true
    methods = GET, PUT, POST, HEAD, DELETE
    headers = accept, authorization, content-type, origin, referer, x-csrf-token
