---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grimmory
  namespace: grimmory
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 12h
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3

  values:
    controllers:
      main:
        type: deployment
        replicas: 1

        containers:
          main:
            image:
              repository: ghcr.io/grimmory-tools/grimmory
              tag: "v3.3.3"
              pullPolicy: IfNotPresent

            env:
              - name: TZ
                value: "Europe/Berlin"
              - name: USER_ID
                value: "1000"
              - name: GROUP_ID
                value: "1000"
              - name: DATABASE_URL
                value: "jdbc:mariadb://grimmory-mariadb:3306/grimmory"
              - name: DATABASE_USERNAME
                value: "grimmory"
              - name: DATABASE_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: grimmory-credentials
                    key: DB_PASSWORD
              - name: DISK_TYPE
                value: "LOCAL"

            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/healthcheck
                    port: 6060
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/healthcheck
                    port: 6060
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/healthcheck
                    port: 6060
                  periodSeconds: 10
                  failureThreshold: 3

            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"

    service:
      main:
        controller: main
        ports:
          http:
            port: 6060

    persistence:
      data:
        existingClaim: grimmory-data-pvc
        globalMounts:
          - path: /app/data
      books:
        existingClaim: grimmory-books-pvc
        globalMounts:
          - path: /books
      bookdrop:
        existingClaim: grimmory-bookdrop-pvc
        globalMounts:
          - path: /bookdrop
