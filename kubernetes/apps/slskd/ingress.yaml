---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: slskd
  namespace: slskd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`slskd.pxldi.de`)
      kind: Rule
      middlewares:
        - name: authentik-forward-auth
          namespace: traefik
      services:
        - name: slskd
          port: 5030
