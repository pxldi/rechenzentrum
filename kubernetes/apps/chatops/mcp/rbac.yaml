---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-mcp
  namespace: chatops
---
# What the Telegram agent may see of the cluster, through the homelab MCP
# server and nothing else. get/list/watch only, and no Secrets, ConfigMaps or
# ServiceAccounts: "read-only" that can read a Secret is not read-only.
# Narrower than claudebox's agent-read on purpose; that one serves an
# interactive coding session, this one serves a chat bot.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-mcp-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "pods/log", "pods/status", "events", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "helmrepositories", "ocirepositories"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["velero.io"]
    resources: ["backups", "schedules", "backupstoragelocations"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-mcp-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homelab-mcp-read
subjects:
  - kind: ServiceAccount
    name: homelab-mcp
    namespace: chatops
---
# The three writes behind homelab-mcp's action tools, each asked for in the
# chat first. Every grant here is narrowed again by the homelab-mcp-actions
# admission policy (infrastructure-config/admission-policies): a pod delete
# is refused in the protected namespaces and on CNPG instances, a Flux patch
# may set the reconcile annotation and nothing else, and a Backup may not
# carry hooks or another storage location. Deleting a pod cannot change what
# runs; it only restarts it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-mcp-act
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["patch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-mcp-act
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homelab-mcp-act
subjects:
  - kind: ServiceAccount
    name: homelab-mcp
    namespace: chatops
