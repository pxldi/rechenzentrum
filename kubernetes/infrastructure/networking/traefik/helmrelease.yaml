apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: 42.4.3
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 12h

  install:
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    # If traefik is evicted nothing is reachable — including Authentik, and
    # including the dashboards you would use to work out why. Verified against
    # chart 41.3.0 with `helm template` that this key actually renders into the
    # Deployment's pod spec, rather than being one more silently ignored value.
    priorityClassName: rechenzentrum-critical

    deployment:
      replicas: 1
      # Copies the CrowdSec bouncer's source into plugin-src before Traefik
      # starts (images/traefik-crowdsec-plugin). The image is pinned by digest
      # and stays in the node's containerd cache, so this needs no network.
      initContainers:
        - name: crowdsec-plugin
          image: ghcr.io/pxldi/traefik-crowdsec-plugin:sha-37ed45eed57f7040b6ad0ed1520bb5747945137d@sha256:7b251e628be1c9c4956ce01d207b0c2199aefaab50b7886ccffc45c32e26a6b4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: plugin-src
              mountPath: /plugins-local
      additionalVolumes:
        - name: plugin-src
          emptyDir:
            sizeLimit: 16Mi

    # No additionalArguments: the chart already passes --api.dashboard=true.
    # The dashboard is served only through the `dashboard` IngressRoute
    # (infrastructure-config/traefik/dashboard-ingress.yaml), which names
    # api@internal behind internal-only and forward-auth. --api.insecure=true
    # used to serve the same API unauthenticated on the `traefik` entrypoint,
    # where any pod could read every router and middleware, proxy keys
    # included.

    ports:
      web:
        port: 8000
        expose:
          default: true
        exposedPort: 80
        protocol: TCP

      websecure:
        port: 8443
        expose:
          default: true
        exposedPort: 443
        protocol: TCP
        http3:
          enabled: true
        # CrowdSec's decisions apply to every HTTPS route. The LAN, the tailnet
        # and Anthropic's connector range are trusted in the middleware itself.
        http:
          middlewares:
            - traefik-crowdsec-bouncer@kubernetescrd

      # Traffic from the Cloudflare Tunnel (infrastructure/networking/cloudflared).
      # Plain HTTP inside the cluster; TLS ends at Cloudflare's edge. Only the
      # routes meant to be public list this entrypoint, so internal-only routes
      # cannot be reached through the tunnel at all.
      #
      # Every request here arrives from a cloudflared pod, so the client
      # address is taken from X-Forwarded-For, trusted from the pod range.
      # A compromised pod could forge that header, but only on the routes bound
      # to this entrypoint, which are public anyway. It would gain nothing an
      # internet client does not have, beyond misleading CrowdSec and the apps'
      # brute-force counters about who it is.
      tunnel:
        port: 8090
        expose:
          default: false
        protocol: TCP
        forwardedHeaders:
          trustedIPs:
            - 10.42.0.0/16
        http:
          middlewares:
            - traefik-crowdsec-bouncer@kubernetescrd

      metrics:
        port: 9100
        expose:
          default: false
        protocol: TCP

      # The `traefik` entrypoint now carries only /ping, which Traefik's own
      # readiness and liveness probes GET on 8080. It stays off the
      # LoadBalancer Service and has no NetworkPolicy allowance: the kubelet's
      # probes come from the node, which kube-router always admits. Anything
      # that stopped it listening would fail both probes and take every route
      # in the cluster down with it.
      traefik:
        expose:
          default: false

    service:
      # The chart passes `service.spec` straight into the Service spec; keys set
      # directly under `service` are ignored, which is why the first attempt at
      # externalTrafficPolicy silently did nothing.
      spec:
        type: LoadBalancer
        # Traefik logged 10.42.0.1 as the client for every request: with the
        # default Cluster policy k3s's servicelb masquerades the source address
        # before Traefik sees it. Local skips that rewrite. This is a
        # single-node cluster, so every endpoint is node-local and the usual
        # Local caveat about unbalanced traffic does not apply.
        externalTrafficPolicy: Local
        # A tailnet request does not match the LoadBalancer IP, so kube-proxy
        # ignores it and the packet falls through to the svclb pod's hostPort,
        # which masquerades: Traefik logged 10.42.0.241 for a request to the
        # node's tailnet address while a LAN request logged 192.168.8.101.
        # Listing that address here makes kube-proxy own it under the same
        # Local policy.
        externalIPs:
          - 100.122.211.109

    log:
      level: INFO

    accessLog:
      enabled: true
      # CrowdSec's bad-user-agent scenarios read this field, and it was "-" on
      # every line while all headers were dropped. Only User-Agent is kept;
      # Referer and the rest can carry tokens.
      fields:
        headers:
          names:
            User-Agent: keep

    # The CrowdSec bouncer (infrastructure-config/traefik/middleware-crowdsec.yaml),
    # loaded as a local plugin from the plugin-src volume above instead of
    # downloaded from plugins.traefik.io on every start: after a power cut the
    # node is up before the router has internet, and a failed download would
    # break every route behind the bouncer until Traefik restarts.
    experimental:
      localPlugins:
        crowdsec-bouncer:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          mountPath: /plugins-local/src/github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          type: localPath
          volumeName: plugin-src

    # Traefik served per-service request counters on :9100 from the start, and
    # nothing read them. On 2026-09-25 Nextcloud returned 503 to every client
    # for 19 hours while its probes stayed green; a 5xx-rate rule on these
    # counters would have caught it, and the only history anyone could find
    # was the 8 days since the pod last restarted. The chart's Service and
    # ServiceMonitor make Prometheus keep them. Rules: prometheusrule.yaml.
    metrics:
      prometheus:
        service:
          enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s

    ingressRoute:
      dashboard:
        enabled: false

    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true

    persistence:
      enabled: true
      storageClass: local-ssd
      size: 1Gi
      path: /data

    resources:
      requests:
        cpu: 100m
        memory: 128Mi

    tlsStore:
      default:
        defaultCertificate:
          secretName: pxldi-de-tls
