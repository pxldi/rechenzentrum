---
# Architect's Exodus world. No pod mounts it, so Velero skips it; it is kept so
# the world can be resumed or copied out. local-ssd is node-local.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data
  namespace: minecraft
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-ssd
  resources:
    requests:
      storage: 30Gi
