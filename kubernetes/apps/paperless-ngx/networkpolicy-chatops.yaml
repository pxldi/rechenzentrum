---
# The document MCP server in chatops reads and tags documents over the API.
# It is the only pod in that namespace allowed in: the agent itself never
# talks to Paperless directly and never holds the token.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-paperless-mcp
spec:
  podSelector:
    matchLabels:
      app: paperless
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: chatops
          podSelector:
            matchLabels:
              app: paperless-mcp
      ports:
        - protocol: TCP
          port: 8000
