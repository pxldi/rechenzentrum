apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
  namespace: cloudflare-ddns
spec:
  # Off since 2026-11-27. The house has no line of its own; the WAN address
  # this would publish is a shared flat's, with no port forwards. Public
  # hostnames go through the Cloudflare Tunnel (../cloudflared) instead.
  replicas: 0
  selector:
    matchLabels:
      app: cloudflare-ddns
  template:
    metadata:
      labels:
        app: cloudflare-ddns
    spec:
      # if the public A record goes stale nothing is reachable from outside
      priorityClassName: rechenzentrum-critical
      containers:
        - name: cloudflare-ddns
          image: favonia/cloudflare-ddns:1.15.1
          env:
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-credentials
                  key: CLOUDFLARE_API_TOKEN
            - name: DOMAINS
              valueFrom:
                secretKeyRef:
                  name: cloudflare-credentials
                  key: CLOUDFLARE_SUBDOMAIN
            - name: PROXIED
              valueFrom:
                secretKeyRef:
                  name: cloudflare-credentials
                  key: CLOUDFLARE_PROXIED
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
