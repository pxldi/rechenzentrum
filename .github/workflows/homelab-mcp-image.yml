---
# Builds the image behind the two MCP servers in kubernetes/apps/chatops.
#
# Pull requests build and smoke-test but do not push; a push to main or a
# manual run publishes, tagged with the commit it built. So the tag a Deployment
# pins only exists after the PR that adds the Dockerfile has merged, which is
# why the manifests land in a second PR (see docs/CHATOPS.md).
name: Homelab MCP Image

on:
  # So a build can be started by hand once ENABLE_IMAGE_PUBLISH is set,
  # without a commit to trigger it.
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "images/homelab-mcp/**"
      - "tests/test_mcp_gate.py"
      - "tests/test_tandoor_tools.py"
      - "tests/test_opengym_mcp.py"
      - ".github/workflows/homelab-mcp-image.yml"
  push:
    branches: ["main"]
    paths:
      - "images/homelab-mcp/**"
      - "tests/test_mcp_gate.py"
      - "tests/test_tandoor_tools.py"
      - "tests/test_opengym_mcp.py"
      - ".github/workflows/homelab-mcp-image.yml"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/homelab-mcp
  # On a pull_request `github.sha` is the ephemeral merge commit; the branch
  # head is the commit that actually holds the Dockerfile.
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # Both jobs run the same steps. A pull request gets `check` and a token that
  # can only read, so code from a branch never holds packages: write or an OIDC
  # token. The login, push and sign steps also test the event themselves.
  check:
    if: github.event_name == 'pull_request' && vars.ENABLE_IMAGE_PUBLISH == 'true'
    name: Build and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps: &build-steps
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: images/homelab-mcp/Dockerfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: images/homelab-mcp
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ env.SHA }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ env.SHA }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:main', env.IMAGE) || '' }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}
          provenance: false

      # Scans the image just built: loaded locally on a pull request, pulled
      # from GHCR after a push. The first step lists HIGH and CRITICAL in the
      # job log; the second fails the build on a CRITICAL with a fix available.
      # An unfixed one does not fail, because no change here could clear it.
      - name: List high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ env.SHA }}
          severity: HIGH,CRITICAL
          format: table
      - name: Gate on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ env.SHA }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-setup-trivy: true

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab  # v4.1.4

      # Keyless: the signature binds the pushed digest to this workflow in this
      # repository through GitHub's OIDC identity, so there is no key to keep.
      # Check one with
      #   cosign verify "$IMAGE@<digest>" \
      #     --certificate-identity-regexp '^https://github.com/pxldi/rechenzentrum/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the pushed digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # The servers must come up and answer /health as uid 1000 on a
      # read-only root filesystem, which is how the Deployments run them.
      - name: Smoke-test the servers
        run: |
          set -euo pipefail
          for mod in tandoor_mcp vault_mcp; do
            docker run -d --rm --name "$mod" --read-only --user 1000:1000 \
              -e TANDOOR_TOKEN=smoke -p 8000:8000 \
              "${IMAGE}:sha-${SHA}" python -m "$mod"
            for _ in $(seq 1 20); do
              if curl -sf http://127.0.0.1:8000/health; then echo; break; fi
              sleep 1
            done
            curl -sf http://127.0.0.1:8000/health | grep -q "\"server\":\"${mod%_mcp}\""
            docker stop "$mod" >/dev/null
          done

      # The vault server is the one claude.ai reaches. With OAUTH_ISSUER set it
      # must publish the resource metadata, refuse /mcp without a token and
      # say in the 401 where the metadata is; without it, /mcp answers an
      # untokened initialize.
      - name: Smoke-test the vault server's token check
        run: |
          set -euo pipefail
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}'
          post() {
            curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
              -d "$init" http://127.0.0.1:8000/mcp
          }
          wait_healthy() {
            for _ in $(seq 1 20); do
              if curl -sf http://127.0.0.1:8000/health; then echo; return; fi
              sleep 1
            done
            return 1
          }
          docker run -d --rm --name vault_open --read-only --user 1000:1000 \
            -p 8000:8000 "${IMAGE}:sha-${SHA}" python -m vault_mcp
          wait_healthy
          test "$(post)" = 200
          docker stop vault_open >/dev/null
          docker run -d --rm --name vault_locked --read-only --user 1000:1000 \
            -e OAUTH_ISSUER=https://auth.example.test/application/o/vault-mcp/ \
            -e OAUTH_AUDIENCE=smoke \
            -e OAUTH_RESOURCE_URL=http://127.0.0.1:8000/mcp \
            -p 8000:8000 "${IMAGE}:sha-${SHA}" python -m vault_mcp
          wait_healthy
          curl -sf http://127.0.0.1:8000/.well-known/oauth-protected-resource/mcp \
            | grep -q 'auth.example.test/application/o/vault-mcp/'
          test "$(post)" = 401
          curl -si -X POST -H 'Content-Type: application/json' -d "$init" http://127.0.0.1:8000/mcp \
            | grep -qi '^www-authenticate: Bearer .*resource_metadata='
          docker stop vault_locked >/dev/null

      # The recipe server is the second one claude.ai reaches; same contract
      # as the vault's, without the untokened run that the first smoke test
      # already covers.
      - name: Smoke-test the recipe server's token check
        run: |
          set -euo pipefail
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}'
          docker run -d --rm --name tandoor_locked --read-only --user 1000:1000 \
            -e TANDOOR_TOKEN=smoke \
            -e OAUTH_ISSUER=https://auth.example.test/application/o/tandoor-mcp/ \
            -e OAUTH_AUDIENCE=smoke \
            -e OAUTH_RESOURCE_URL=http://127.0.0.1:8000/mcp \
            -p 8000:8000 "${IMAGE}:sha-${SHA}" python -m tandoor_mcp
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/health; then echo; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/.well-known/oauth-protected-resource/mcp \
            | grep -q 'auth.example.test/application/o/tandoor-mcp/'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d "$init" http://127.0.0.1:8000/mcp)
          test "$code" = 401
          docker stop tandoor_locked >/dev/null

      # The tests that need the SDK (the token gate, the recipe tools against a
      # fake Tandoor) run in the image. Then the gate must start as the
      # Deployment runs it, refuse /mcp without a token, and refuse to start
      # without OAUTH_ISSUER.
      - name: Test the token gate and the recipe tools
        run: |
          set -euo pipefail
          docker run --rm --read-only --user 1000:1000 -v "$PWD/tests:/tests:ro" -w /tests \
            "${IMAGE}:sha-${SHA}" python -m unittest -v test_mcp_gate test_tandoor_tools 2>&1 \
            | tee /tmp/sdk-tests.log
          if grep -q 'skipped' /tmp/sdk-tests.log; then echo "SDK tests were skipped"; exit 1; fi
          if docker run --rm --read-only --user 1000:1000 -e UPSTREAM_URL=http://upstream.test/mcp \
            "${IMAGE}:sha-${SHA}" python -m mcp_gate; then
            echo "the gate started without a token check"; exit 1
          fi
          docker run -d --rm --name gate --read-only --user 1000:1000 \
            -e UPSTREAM_URL=http://upstream.test/mcp \
            -e OAUTH_ISSUER=https://auth.example.test/application/o/snacky-mcp/ \
            -e OAUTH_AUDIENCE=smoke \
            -e OAUTH_RESOURCE_URL=http://127.0.0.1:8000/mcp \
            -p 8000:8000 "${IMAGE}:sha-${SHA}" python -m mcp_gate
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/health; then echo; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health | grep -q '"server":"gate"'
          curl -sf http://127.0.0.1:8000/.well-known/oauth-protected-resource/mcp \
            | grep -q 'auth.example.test/application/o/snacky-mcp/'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{}' http://127.0.0.1:8000/mcp)
          test "$code" = 401
          docker stop gate >/dev/null

      # The openGym server: its write tests run against a fake openGym in the
      # image, then it must start as the Deployment runs it and refuse /mcp
      # without a token.
      - name: Test the openGym server
        run: |
          set -euo pipefail
          docker run --rm --read-only --user 1000:1000 -v "$PWD/tests:/tests:ro" \
            "${IMAGE}:sha-${SHA}" python -m unittest discover -s /tests -p 'test_opengym_mcp.py' -v 2>&1 \
            | tee /tmp/opengym-tests.log
          if grep -q 'skipped' /tmp/opengym-tests.log; then echo "openGym tests were skipped"; exit 1; fi
          docker run -d --rm --name opengym_locked --read-only --user 1000:1000 \
            -e OPENGYM_TOKEN=smoke \
            -e OAUTH_ISSUER=https://auth.example.test/application/o/opengym-mcp/ \
            -e OAUTH_AUDIENCE=smoke \
            -e OAUTH_RESOURCE_URL=http://127.0.0.1:8000/mcp \
            -p 8000:8000 "${IMAGE}:sha-${SHA}" python -m opengym_mcp
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/health; then echo; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health | grep -q '"server":"opengym"'
          curl -sf http://127.0.0.1:8000/.well-known/oauth-protected-resource/mcp \
            | grep -q 'auth.example.test/application/o/opengym-mcp/'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{}' http://127.0.0.1:8000/mcp)
          test "$code" = 401
          docker stop opengym_locked >/dev/null

  publish:
    if: github.event_name != 'pull_request' && vars.ENABLE_IMAGE_PUBLISH == 'true'
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign trades this token for a short-lived certificate.
      id-token: write
    steps: *build-steps
