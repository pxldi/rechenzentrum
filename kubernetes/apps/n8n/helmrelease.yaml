---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: n8n
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 12h
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3

  values:
    controllers:
      main:
        type: deployment
        replicas: 1

        containers:
          main:
            image:
              repository: n8nio/n8n
              tag: "2.36.6"
              pullPolicy: IfNotPresent

            env:
              - name: TZ
                value: "Europe/Berlin"
              - name: N8N_HOST
                value: "automation.pxldi.de"
              - name: N8N_PORT
                value: "5678"
              - name: N8N_PROTOCOL
                value: "https"
              - name: N8N_PATH
                value: "/"
              - name: WEBHOOK_URL
                value: "https://automation.pxldi.de/"
              - name: DB_TYPE
                value: "postgresdb"
              - name: DB_POSTGRESDB_HOST
                value: "n8n-postgresql-rw"
              - name: DB_POSTGRESDB_PORT
                value: "5432"
              - name: DB_POSTGRESDB_DATABASE
                value: "n8n"
              - name: DB_POSTGRESDB_USER
                value: "n8n"
              - name: DB_POSTGRESDB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: n8n-credentials
                    key: POSTGRES_PASSWORD
              - name: N8N_ENCRYPTION_KEY
                valueFrom:
                  secretKeyRef:
                    name: n8n-credentials
                    key: N8N_ENCRYPTION_KEY
              - name: N8N_JWT_HEADER_AUTH_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: n8n-credentials
                    key: N8N_JWT_HEADER_AUTH_TOKEN
              - name: EXECUTIONS_DATA_SAVE_ON_ERROR
                value: "all"
              - name: EXECUTIONS_DATA_SAVE_ON_SUCCESS
                value: "all"
              - name: EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS
                value: "true"
              - name: WORKFLOW_CALLER_POLICY_DEFAULT_OPTION
                value: "workflowsFromSameOwner"

            # /healthz/readiness is n8n's own readiness route — it reports the
            # database connection, not just that the HTTP server answers, which
            # matters here because Postgres is a separate CNPG cluster. Verified
            # 200 against the running pod, as were / and /healthz.
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/readiness
                    port: 5678
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  timeoutSeconds: 5

            resources:
              requests:
                memory: "512Mi"
                cpu: "100m"

    service:
      main:
        controller: main
        ports:
          http:
            port: 5678

    ingress:
      main:
        enabled: true
        className: "traefik"
        hosts:
          - host: automation.pxldi.de
            paths:
              - path: /
                service:
                  identifier: main
                  port: http

    persistence:
      data:
        existingClaim: n8n-data-pvc
        globalMounts:
          - path: /home/node/.n8n
