---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matter-server-data
  namespace: home-assistant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-ssd
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  namespace: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matter-server
  template:
    metadata:
      labels:
        app: matter-server
    spec:
      # home automation; its failure is noticed by people in the house, not by a dashboard
      priorityClassName: rechenzentrum-critical
      nodeSelector:
        kubernetes.io/hostname: rechenzentrum
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: matter-server
          image: ghcr.io/home-assistant-libs/python-matter-server:8.1.0
          # 96Mi average / 106Mi peak over 7d.
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
          ports:
            - containerPort: 5580
              name: websocket
          # tcpSocket rather than httpGet, deliberately. A GET / does answer 200
          # today, but this is a WebSocket server and that route is incidental —
          # if it moves on an upgrade the pod goes permanently NotReady and Home
          # Assistant loses its Matter bridge. The listener being up is the
          # honest question for a WS service, and it cannot regress that way.
          readinessProbe:
            tcpSocket:
              port: websocket
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
          env:
            - name: MATTER_SERVER_STORAGE_PATH
              value: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matter-server-data
---
apiVersion: v1
kind: Service
metadata:
  name: matter-server
  namespace: home-assistant
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: matter-server
  ports:
    - port: 5580
      targetPort: 5580
      name: websocket
