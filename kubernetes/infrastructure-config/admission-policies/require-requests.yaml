---
# A container with no resources.requests is BestEffort, which puts it at the
# *front* of the kubelet's eviction queue -- ahead of every workload that did
# declare something. On a node already at ~80% memory requests, that is not a
# tidiness issue: it decides what dies first when the box is squeezed.
#
# #911 established the discipline by hand and #984 closed the last seven gaps,
# all of them buried in third-party charts. This is the ratchet that keeps it
# closed, because the next chart bump is exactly how an unrequested container
# arrives unnoticed.
#
# Same shape and same reasoning as require-pinned-images: a
# ValidatingAdmissionPolicy rather than a webhook, so the CEL runs in-process in
# the apiserver -- no deployment to be down, no certificate to expire, and no
# failurePolicy dilemma. Deny is safe *because* the invariant already holds;
# zero violations means nothing can be blocked today, and a block later is the
# guardrail doing its job. It will not be silent either: a rejected apply fails
# the Kustomization or HelmRelease, which #928 turns into a Gotify alert.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: require-requests
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
  variables:
    # Regular containers only. initContainers are deliberately excluded:
    # requiring requests on them pulls in fourteen workloads across nextcloud,
    # sure, wardrowbe, home-assistant, multica-daemon and velero's plugin init
    # -- third-party chart surgery for containers that live seconds and are not
    # what the scheduler packs the node with.
    - name: containers
      expression: object.spec.template.spec.containers
  validations:
    # Both cpu and memory. A request for one and not the other still leaves the
    # container BestEffort for the dimension it omitted, and memory is the one
    # this node actually runs out of.
    - expression: >-
        variables.containers.all(c,
          has(c.resources) && has(c.resources.requests) &&
          'cpu' in c.resources.requests && 'memory' in c.resources.requests)
      messageExpression: >-
        'every container must declare resources.requests for both cpu and ' +
        'memory; these do not: ' +
        variables.containers.filter(c,
          !(has(c.resources) && has(c.resources.requests) &&
            'cpu' in c.resources.requests &&
            'memory' in c.resources.requests)).map(c, c.name).join(', ')
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: require-requests
spec:
  policyName: require-requests
  matchResources:
    # kube-system is excluded, and it is the only exclusion. Its remaining
    # offenders are k3s's own svclb-* DaemonSets, generated by the service
    # controller and not manageable from git -- enforcing here would break every
    # LoadBalancer Service on the node and there would be no way to fix it.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system"]
  validationActions: [Deny, Audit]
