---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - pvcs.yaml
  - prowlarr
  - radarr
  - sonarr
  - sabnzbd
  - jellyfin
  - navidrome
  - seerr
  - cantus
  - networkpolicy-egress-slskd.yaml
components:
  # Egress. Nine workloads that talk to each other by Service name: the *arr
  # apps to prowlarr and sabnzbd, seerr to jellyfin, cantus to its own Postgres.
  # The internet rule is for indexers, usenet and metadata; the API server for
  # the cantus CNPG instance. networkpolicy-egress-slskd.yaml adds slskd, which
  # left this namespace but is still Cantus's download path.
  - ../../../components/default-deny-egress
  - ../../../components/allow-dns
  - ../../../components/allow-intra-namespace-egress
  - ../../../components/allow-internet-egress
  - ../../../components/allow-egress-to-ingress
  - ../../../components/allow-egress-to-apiserver
  - ../../infrastructure-config/networkpolicies/default-deny-ingress
  - ../../infrastructure-config/networkpolicies/allow-intra-namespace
  - ../../infrastructure-config/networkpolicies/allow-from-traefik
  - ../../infrastructure-config/networkpolicies/allow-from-monitoring
  - ../../infrastructure-config/networkpolicies/allow-from-homepage
