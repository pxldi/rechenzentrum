apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-config
  namespace: glance
data:
  glance.yml: |
    server:
      port: 8080

    theme:
      background-color: 240 8 9
      primary-color: 217 92 83
      positive-color: 145 70 55
      negative-color: 0 72 63

    pages:
      - name: Home
        columns:
          - size: small
            widgets:
              - type: clock
                hour-format: 24h

              - type: weather
                location: Konstanz, Germany
                units: metric
                hour-format: 24h

              - type: markets
                title: Portfolio
                markets:
                  - symbol: VWCE.DE
                    name: Vanguard FTSE All-World
                  - symbol: BTC-USD
                    name: Bitcoin

          - size: full
            widgets:
              - type: bookmarks
                title: " "
                groups:
                  - title: Media
                    links:
                      - title: Jellyfin
                        url: https://jellyfin.pxldi.de
                        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/jellyfin.svg
                      - title: Navidrome
                        url: https://music.pxldi.de
                        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/navidrome.svg
                      - title: Grimmory
                        url: https://books.pxldi.de
                        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/booklore.svg

              - type: bookmarks
                title: " "
                groups:
                  - title: Acquisition
                    links:
                      - title: Seerr
                        url: https://seerr.pxldi.de
                        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/seerr.svg
                      - title: Sonarr
                        url: https://sonarr.pxldi.de
                        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/sonarr.svg
                      - title: Radarr
                        url: https://radarr.pxldi.de
                        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/radarr.svg
                      - title: Prowlarr
                        url: https://prowlarr.pxldi.de
                        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/prowlarr.svg
                      - title: SABnzbd
                        url: https://sabnzbd.pxldi.de
                        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/sabnzbd.svg
                      - title: slskd
                        url: https://slskd.pxldi.de
                        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/slskd.svg
                      - title: JDownloader
                        url: https://download.pxldi.de
                        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/jdownloader.svg

              - type: bookmarks
                title: " "
                groups:
                  - title: Tools
                    links:
                      - title: Tandoor
                        url: https://recipes.pxldi.de
                        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/tandoor-recipes.svg
                      - title: Fredy
                        url: https://immo.pxldi.de
                        icon: https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/home-search.svg
                      - title: SearXNG
                        url: https://search.pxldi.de
                        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/searxng.svg
                      - title: Overleaf
                        url: https://latex.pxldi.de
                        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/overleaf.svg
                      - title: AdventureLog
                        url: https://travel.pxldi.de
                        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/adventure-log.svg
                      - title: Gotify
                        url: https://gotify.pxldi.de
                        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/gotify.svg
                      - title: n8n
                        url: https://automation.pxldi.de
                        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/n8n.svg
                      - title: Paperless
                        url: https://paperless.pxldi.de
                        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/paperless.svg

          - size: small
            widgets:
              - type: repository
                title: rechenzentrum
                repository: pxldi-labs/rechenzentrum
                token: ${GITHUB_TOKEN}
                pull-requests-limit: 5
                issues-limit: 5

              - type: releases
                title: Homelab Updates
                repositories:
                  - glanceapp/glance
                  - goauthentik/authentik
                  - immich-app/immich
                  - paperless-ngx/paperless-ngx
                  - n8n-io/n8n
                token: ${GITHUB_TOKEN}

              - type: search
                search-engine: searxng
                url: https://search.pxldi.de

      - name: Reddit
        columns:
          - size: full
            widgets:
              - type: reddit
                subreddit: selfhosted
                show-thumbnails: true
              - type: reddit
                subreddit: homelab
                show-thumbnails: true
              - type: reddit
                subreddit: gaming
                show-thumbnails: true

      - name: News
        columns:
          - size: full
            widgets:
              - type: rss
                title: Tagesschau
                feeds:
                  - url: https://www.tagesschau.de/xml/rss2/
                    title: Tagesschau
              - type: rss
                title: Golem
                feeds:
                  - url: https://rss.golem.de/rss.php?feed=RSS2.0
                    title: Golem.de
              - type: rss
                title: Tech
                feeds:
                  - url: https://www.theverge.com/rss/index.xml
                    title: The Verge
                  - url: https://www.heise.de/rss/heise-atom.xml
                    title: heise online
              - type: rss
                title: Hacker News
                feeds:
                  - url: https://hnrss.org/frontpage
                    title: Hacker News
