---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: sabnzbd
      version: "25.9.0"
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    securityContext:
      container:
        runAsUser: 568
        runAsGroup: 568
      pod:
        fsGroup: 568
    workload:
      main:
        podSpec:
          annotations:
            backup.velero.io/backup-volumes-excludes: "downloads"
    env:
      TZ: "Europe/Berlin"
    persistence:
      config:
        enabled: true
        existingClaim: sabnzbd-config-pvc
      downloads:
        enabled: true
        type: pvc
        existingClaim: downloads-pvc
        mountPath: /downloads
        readOnly: false
