---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: palworld
resources:
  - secret.yaml
  - pvcs.yaml
  - deployment.yaml
  # No Service. The LoadBalancer bound 8211/udp on the node for a router port
  # forward, and the house has had no port forwards since 2026-11-27, so it
  # held a node port open for a server at 0 replicas. Players would need a
  # route in again (a tunnel or the tailnet) before it comes back.
  - networkpolicy.yaml
components:
  # Egress. Server list registration and update checks.
  - ../../../components/default-deny-egress
  - ../../../components/allow-dns
  - ../../../components/allow-internet-egress
  - ../../infrastructure-config/networkpolicies/default-deny-ingress
  - ../../infrastructure-config/networkpolicies/allow-intra-namespace
  - ../../infrastructure-config/networkpolicies/allow-from-monitoring

# Resource metadata only: preserve existing Service/Deployment selectors and pod templates.
labels:
  - pairs:
      app.kubernetes.io/name: palworld
      app.kubernetes.io/instance: palworld
      app.kubernetes.io/component: application
      app.kubernetes.io/part-of: rechenzentrum
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
    includeTemplates: false
