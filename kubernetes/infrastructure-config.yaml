apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-config
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: infrastructure
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure-config
  prune: true
  # Same reasoning as infrastructure.yaml. No HelmReleases here -- admission
  # policies, cert issuers and the shared NetworkPolicy components -- so this
  # settles in seconds and 5m stays generous.
  wait: true
  timeout: 5m
