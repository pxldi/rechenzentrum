---
apiVersion: v1
kind: Service
metadata:
  name: vault-mcp
  namespace: chatops
spec:
  selector:
    app: vault-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
    # The claude.ai copy; only the IngressRoute forwards to it.
    - name: claude
      port: 8001
      targetPort: claude
