---
# The document MCP server in chatops reads and tags documents over the API,
# and the files sidecar in the zeroclaw pod uploads what people send the bot.
# Only those two pods are allowed in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-paperless-mcp
spec:
  podSelector:
    matchLabels:
      app: paperless
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: chatops
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["paperless-mcp", "zeroclaw"]
      ports:
        - protocol: TCP
          port: 8000
