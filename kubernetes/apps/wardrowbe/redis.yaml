apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wardrowbe-redis
  namespace: wardrowbe
spec:
  serviceName: wardrowbe-redis
  replicas: 1
  selector:
    matchLabels:
      app: wardrowbe-redis
  template:
    metadata:
      labels:
        app: wardrowbe-redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: redis:8.10.1-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-ssd
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wardrowbe-redis
  namespace: wardrowbe
spec:
  clusterIP: None
  selector:
    app: wardrowbe-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
