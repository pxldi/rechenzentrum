apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: survivorlike
resources:
  - ghcr-pull-secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - follower.yaml
components:
  - ../../../components/safe-rollout
  # Static files only; the page loads three.js from a CDN in the browser, not
  # from here. So no egress beyond DNS. follower.yaml opens ghcr.io and the API
  # server for its own Job pods.
  - ../../../components/default-deny-egress
  - ../../../components/allow-dns
  - ../../infrastructure-config/networkpolicies/default-deny-ingress
  - ../../infrastructure-config/networkpolicies/allow-from-traefik

# Resource metadata only: preserve existing Service/Deployment selectors and pod templates.
labels:
  - pairs:
      app.kubernetes.io/name: asset-viewer
      app.kubernetes.io/instance: asset-viewer
      app.kubernetes.io/component: application
      app.kubernetes.io/part-of: rechenzentrum
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
    includeTemplates: false
