---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: anchor-postgresql
  namespace: anchor
spec:
  # barman backs this database up to rechenzentrum-cnpg (objectstore.yaml).
  # A Velero file copy of a live pgdata is only crash-consistent, so Velero
  # skips these volumes. Velero reads the annotation on the pod, hence
  # inheritedMetadata.
  inheritedMetadata:
    annotations:
      backup.velero.io/backup-volumes-excludes: pgdata,pg-wal,shm,scratch-data,plugins
  # Backups. Without this the cluster has no archive at all — see
  # objectstore.yaml for where it writes and how long it keeps it.
  #
  # isWALArchiver: exactly one plugin may own archive_command. This is the only
  # plugin here, so it is the one.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: anchor-postgresql-backup
        # Pinned rather than defaulted. On a restore you point a new Cluster
        # at this same store with recovery serverName set to this value, while
        # the new cluster archives under a different one — leaving them equal
        # has the recovered cluster overwrite the history it restored from.
        serverName: anchor-postgresql

  instances: 1
  # The plain tag is the Debian bullseye build this data directory was
  # created on. Other bases change glibc collations; see renovate.json.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533

  postgresql:
    shared_preload_libraries: []

  bootstrap:
    initdb:
      database: anchor
      owner: anchor
      secret:
        name: anchor-credentials

  # Requests only. A memory limit on Postgres converts a spike into an OOM kill
  # in the middle of a transaction; an honest request instead makes a runaway
  # the most-over-request pod on the node, which is what eviction ranks on.
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
  storage:
    storageClass: local-ssd
    size: 10Gi

  walStorage:
    storageClass: local-ssd
    size: 5Gi
