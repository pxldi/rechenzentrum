---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure-worker
  namespace: sure
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sure
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sure
        app.kubernetes.io/component: worker
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:18
          command:
            - sh
            - -c
            - |
              until pg_isready -h sure-db -p 5432 -U "$POSTGRES_USER"; do
                echo "waiting for db..."
                sleep 2
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: sure-env
                  key: POSTGRES_USER
      containers:
        - name: worker
          image: ghcr.io/we-promise/sure:0.7.4
          command: ["bundle", "exec", "sidekiq"]
          envFrom:
            - configMapRef:
                name: sure-env
            - secretRef:
                name: sure-secrets
          volumeMounts:
            - name: app-storage
              mountPath: /rails/storage
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: sure-app-storage
