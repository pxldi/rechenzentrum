---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero-ui
  namespace: velero
spec:
  interval: 30m
  chart:
    spec:
      chart: velero-ui
      version: "1.2.0"
      sourceRef:
        kind: HelmRepository
        name: otwld-charts
        namespace: velero
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    configuration:
      general:
        veleroNamespace: "velero"
        # Chart 1.x needs a JWT signing passphrase; it lives in secret-jwt.yaml.
        secretPassPhrase:
          existingSecret: velero-ui-jwt
          key: pass_phrase

    # The chart's default is `clusterAdministratorName: cluster-admin`, which
    # bound this web app to write access on every object in the cluster. Repoint
    # the binding at a read-only ClusterRole (rbac.yaml); the namespaced Roles the
    # chart still creates in `velero` keep every backup and restore action working.
    rbac:
      create: true
      clusterAdministrator: true
      clusterAdministratorName: velero-ui-cluster-reader

    ingress:
      enabled: false

    # The app's own login ran on the chart's default credentials, which 0.12
    # refuses to start with. The route already requires the LAN or tailnet
    # and an Authentik login (ingress.yaml), so the second login goes.
    env:
      - name: BASIC_AUTH_ENABLED
        value: "false"

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
