apiVersion: v1
kind: ConfigMap
metadata:
  name: branding-nginx-config
  namespace: branding
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        location / {
            add_header Access-Control-Allow-Origin "*";
            add_header Cache-Control "public, max-age=3600";
            try_files $uri $uri/ =404;
        }

        location /health {
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }
