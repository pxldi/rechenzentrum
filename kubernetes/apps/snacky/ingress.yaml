# The web port only. The MCP port has no route: the assistant reaches it over
# the cluster network. Authentik only, without the house allowlist, so the phone
# reaches it on mobile data without the tailnet (docs/EXPOSURE.md, exceptions).
# Priority 10 matches the rest of the repo's IngressRoutes.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: snacky
  namespace: snacky
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`snacky.pxldi.de`)
      priority: 10
      middlewares:
        - name: authentik-forward-auth
          namespace: traefik
      services:
        - name: snacky
          port: 8080
