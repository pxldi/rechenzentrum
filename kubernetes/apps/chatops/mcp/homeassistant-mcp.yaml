---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant-mcp
  namespace: chatops
  labels:
    app: homeassistant-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant-mcp
  template:
    metadata:
      labels:
        app: homeassistant-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: homeassistant-mcp
          image: ghcr.io/pxldi/homelab-mcp:sha-d81d9e722f7b7595ffeedc7520e61d8b1bb88514
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "homeassistant_mcp"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HASS_URL
              value: http://home-assistant.home-assistant.svc.cluster.local:8123
            - name: HASS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chatops-homeassistant
                  key: HASS_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # The kubernetes client writes certificate material to a temp file
          # when it loads a config, and a read-only root has nowhere for it.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant-mcp
  namespace: chatops
spec:
  selector:
    app: homeassistant-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
