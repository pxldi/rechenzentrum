---
# An untagged or :latest image reference is unreproducible by construction: the
# same manifest resolves to a different build tomorrow, a rollback rolls back to
# nothing in particular, and Renovate cannot see a version to bump. Nothing in
# this cluster does it today — all 92 workloads carry an explicit tag or digest —
# so this is a ratchet, not a cleanup.
#
# A ValidatingAdmissionPolicy rather than a webhook on purpose. The CEL runs
# in-process in the apiserver, so there is no deployment to be down, no
# certificate to expire, and no failurePolicy dilemma: the class of outage that
# makes admission webhooks risky here does not exist for this.
#
# Deny is safe *because* the invariant already holds. Zero violations means
# nothing can be blocked today, and a block later is the guardrail working. It
# also will not be silent — a rejected apply fails the Kustomization or
# HelmRelease, which #928 turns into a Gotify alert.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: require-pinned-images
spec:
  # In-process evaluation, so Fail carries none of the availability risk it
  # would for a webhook.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
  variables:
    - name: containers
      expression: >-
        object.spec.template.spec.containers +
        (has(object.spec.template.spec.initContainers)
          ? object.spec.template.spec.initContainers : [])
  validations:
    # Pinned means either a digest, or a tag that is not "latest". The tag test
    # is lastIndexOf(':') > lastIndexOf('/') rather than a plain contains(':'),
    # because a registry with a port — registry.example:5000/image — has a colon
    # that is not a tag. Comparing positions is what distinguishes them.
    - expression: >-
        variables.containers.all(c,
          c.image.contains('@') ||
          (c.image.lastIndexOf(':') > c.image.lastIndexOf('/') &&
           !c.image.endsWith(':latest')))
      messageExpression: >-
        'every container image must be pinned to an explicit tag or digest; ' +
        'these are not: ' +
        variables.containers.filter(c,
          !(c.image.contains('@') ||
            (c.image.lastIndexOf(':') > c.image.lastIndexOf('/') &&
             !c.image.endsWith(':latest')))).map(c, c.image).join(', ')
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: require-pinned-images
spec:
  policyName: require-pinned-images
  # Cluster-wide. There is no namespace where an unpinned image is correct, and
  # third-party charts are exactly where one would arrive unnoticed.
  matchResources: {}
  # Audit alongside Deny so a rejection also lands in the apiserver audit log,
  # not only in the failed apply.
  validationActions: [Deny, Audit]
