---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wealthfolio
resources:
  - secret.yaml
  - deployment.yaml
  - backup.yaml
  - ingress.yaml
components:
  # Egress: market quotes and exchange rates from the internet; the backup job
  # installs sqlite3 from the alpine mirrors.
  - ../../../components/default-deny-egress
  - ../../../components/allow-dns
  - ../../../components/allow-internet-egress
  # Ingress: Traefik only. The app has no login of its own
  # (WF_AUTH_REQUIRED=false), so nothing else may reach it.
  - ../../infrastructure-config/networkpolicies/default-deny-ingress
  - ../../infrastructure-config/networkpolicies/allow-from-traefik

labels:
  - pairs:
      app.kubernetes.io/name: wealthfolio
      app.kubernetes.io/instance: wealthfolio
      app.kubernetes.io/component: application
      app.kubernetes.io/part-of: rechenzentrum
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
    includeTemplates: false
