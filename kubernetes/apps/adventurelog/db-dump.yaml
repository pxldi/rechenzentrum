---
# Nightly logical dump of the AdventureLog database (PostGIS).
# It goes to the adventurelog-db-dumps volume.
#
# Velero copies that volume file by file while Postgres runs, so the data
# directory it carries off is only crash-consistent, and a restore from it is
# Postgres recovering from a crash. pg_dump reads one snapshot of the database
# and gives a file that restores on any server of the same or newer major.
# The raw copy stays in the backup next to it.
#
# The dump goes onto a volume the database pod mounts:
# Velero's file-system backup only copies volumes of pods that are running at
# 02:20, and this Job's pod is not. RWO binds a volume to a node, not a pod, so
# the Job mounts it beside the running database.
#
# Same shape as karakeep/backup.yaml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: adventurelog-db-dump
  namespace: adventurelog
spec:
  # Before Velero's daily run at 02:20 UTC in summer and winter, and clear of
  # the 03:00 WAN drop. The five dumps are ten minutes apart.
  schedule: "30 1 * * *"
  # Suspended while the app is parked: there is no database to dump.
  suspend: true
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              # pg_dump 15, the server's major. Plain Postgres rather than the
              # server's PostGIS image, which has no wget: a dump of a PostGIS
              # database only names the extension, so the client needs none
              # of it. A restore needs a PostGIS server.
              image: postgres:15.20-alpine@sha256:e18480a22d6e48f4d816a6696769b1ec09ac73a824c5649e49c7d8b684913f3d
              command:
                - sh
                - -c
                - |
                  set -eu
                  # healthchecks.io: a start ping, then the exit status from the
                  # EXIT trap, so a failed dump, a hung one and a night the job
                  # never ran all reach a phone without this node. busybox wget,
                  # which the alpine image already has. Failed pings are ignored
                  # and an empty key skips them.
                  hc() {
                    [ -n "${HC_PING_KEY:-}" ] || return 0
                    for _ in 1 2 3; do
                      wget -q -T 10 -O /dev/null \
                        "https://hc-ping.com/${HC_PING_KEY}/adventurelog-db-dump$1" && return 0
                      sleep 5
                    done
                    return 0
                  }
                  trap 'hc "/$?"' EXIT
                  hc /start
                  # Owner and group only: the dump holds what the database holds.
                  umask 027
                  mkdir -p /volume/dumps
                  rm -f /volume/dumps/*.partial
                  out="/volume/dumps/adventurelog-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  pg_dump --format=custom --file="$out.partial"
                  # A dump pg_restore cannot read is not kept, and the older
                  # ones are not rotated out for it.
                  pg_restore --list "$out.partial" >/dev/null
                  mv "$out.partial" "$out"
                  printf 'wrote %s (%s)\n' "$out" "$(du -h "$out" | cut -f1)"

                  # Three nights here; Velero keeps the history. The file just
                  # written is held out of the list, so a clock that has moved
                  # backwards cannot delete it.
                  ls -1t /volume/dumps/adventurelog-*.dump | grep -v -F "$out" |
                    tail -n +3 | while read -r stale; do rm -f "$stale"; done
              env:
                - name: PGHOST
                  value: adventurelog-db
                - name: PGDATABASE
                  value: adventurelog
                - name: PGUSER
                  value: adventurelog
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: adventurelog-secret
                      key: POSTGRES_PASSWORD
                - name: HC_PING_KEY
                  valueFrom:
                    secretKeyRef:
                      name: healthchecks
                      key: ping-key
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: dumps
                  mountPath: /volume
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 512Mi
          volumes:
            # A volume of its own, also mounted into the database pod so that
            # Velero backs it up. The database volume is the data directory
            # itself, and the media volume is served by the app.
            - name: dumps
              persistentVolumeClaim:
                claimName: adventurelog-db-dumps
