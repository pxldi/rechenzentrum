---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: image-automation
  namespace: flux-system
spec:
  # Suspended, not deleted. Schall is the only image this automation ever
  # updated, and it now follows a mutable tag while it is under active
  # development; left running, this would keep rewriting that line back to a
  # pinned tag every five minutes and quietly undo it.
  #
  # Unsuspend, and restore the setter marker on the cantus deployment, when
  # Schall is versioned and the manifest should record what is running again.
  suspend: true
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: flux
        email: flux@pxldi.de
      # Changed.Changes holds update.Change values, whose fields are OldValue,
      # NewValue, and Setter. There is no ImageRef.
      messageTemplate: |
        chore(images): update image tags

        {{ range .Changed.Changes -}}
        - {{ .OldValue }} -> {{ .NewValue }}
        {{ end }}
        Automated image tag update by Flux image automation.
    push:
      branch: automation/images
  update:
    path: ./kubernetes
    strategy: Setters
