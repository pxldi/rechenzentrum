---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: radarr
      version: "27.13.1"
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    workload:
      main:
        podSpec:
          annotations:
            backup.velero.io/backup-volumes-excludes: "media,downloads"
    env:
      TZ: "Europe/Berlin"
    metrics:
      main:
        enabled: false
    persistence:
      config:
        enabled: true
        existingClaim: radarr-config-pvc
      media:
        enabled: true
        type: pvc
        existingClaim: media-pvc
        mountPath: /media
        readOnly: false
      downloads:
        enabled: true
        existingClaim: downloads-pvc
        mountPath: /downloads
