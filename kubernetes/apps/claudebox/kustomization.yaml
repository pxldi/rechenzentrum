---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: claudebox
# Generated, so the name carries a content hash and the Deployment's volume
# reference changes whenever server.mjs does: nothing in this cluster reloads a
# pod on a ConfigMap edit, and a session would otherwise keep running the old
# server until the next unrelated restart. Same reasoning as karakeep-config.
#
# These files are a copy of ~/projects/codex-mcp on the workstation, which is
# not a git repository. Copying is the cost of keeping this deployable from
# git alone; a change there has to be copied here by hand.
configMapGenerator:
  - name: claudebox-codex-mcp
    files:
      - codex-mcp/server.mjs
      - codex-mcp/monitor.mjs
      - codex-mcp/package.json
  # livesync-bridge's config with placeholders; the pod's render-bridge-config
  # init container fills in the credentials and the passphrase from the
  # claudebox-vault Secret. Same shape as vault-bridge-config in chatops.
  - name: claudebox-bridge-config
    files:
      - config.json=bridge-config.json
resources:
  - rbac.yaml
  - pvc.yaml
  - secret.yaml
  - secret-vault.yaml
  - entrypoint-configmap.yaml
  - managed-settings-configmap.yaml
  - deployment.yaml
  - networkpolicy-egress.yaml
components:
  # No ingress of any kind: the servers dial out to the Anthropic API and serve
  # nothing. No allow-from-traefik, no Service, no IngressRoute — same shape as
  # the multica daemon, which this repository no longer deploys.
  # Egress. An agent workspace: it clones repositories, installs packages and
  # drives this cluster. networkpolicy-egress.yaml adds the API server, which it
  # has a ServiceAccount token and RBAC for.
  - ../../../components/default-deny-egress
  - ../../../components/allow-dns
  - ../../../components/allow-internet-egress
  - ../../infrastructure-config/networkpolicies/default-deny-ingress
  - ../../infrastructure-config/networkpolicies/allow-from-monitoring

# Resource metadata only: preserve existing Service/Deployment selectors and pod templates.
labels:
  - pairs:
      app.kubernetes.io/name: claudebox
      app.kubernetes.io/instance: claudebox
      app.kubernetes.io/component: application
      app.kubernetes.io/part-of: rechenzentrum
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
    includeTemplates: false
