---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendar-mcp
  namespace: chatops
  labels:
    app: calendar-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calendar-mcp
  template:
    metadata:
      labels:
        app: calendar-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: calendar-mcp
          image: ghcr.io/pxldi/homelab-mcp:sha-e5382336d06b03f82fb67edfeccfe4f2d3d08609
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "calendar_mcp"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: CALDAV_URL
              value: http://nextcloud.nextcloud.svc.cluster.local:8080/remote.php/dav/
            # Nextcloud answers only to its trusted_domains, so the public name
            # goes out as the Host header; traffic still stays in the cluster.
            - name: CALDAV_HOST
              value: cloud.pxldi.de
            - name: CALDAV_USER
              value: leopold
            - name: CALDAV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chatops-caldav
                  key: CALDAV_PASSWORD
            - name: TZ
              value: Europe/Berlin
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # The kubernetes client writes certificate material to a temp file
          # when it loads a config, and a read-only root has nowhere for it.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: calendar-mcp
  namespace: chatops
spec:
  selector:
    app: calendar-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
