---
# Firefly Pico, the phone front end: dashboard and quick entry. It keeps only
# its own settings in SQLite; every transaction lives in Firefly, reached
# in-cluster over the API with a token the user pastes into Pico's settings.
# House only and behind authentik, like Firefly itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-pico
  namespace: firefly
  labels:
    app: firefly-pico
spec:
  replicas: 1
  # The SQLite file is on a volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: firefly-pico
  template:
    metadata:
      labels:
        app: firefly-pico
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's www-data is uid 1000 in group 82.
        runAsUser: 1000
        runAsGroup: 82
        fsGroup: 82
        seccompProfile:
          type: RuntimeDefault
        # The image runs nginx as www-data on port 80.
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      containers:
        - name: pico
          image: cioraneanu/firefly-pico:1.12.0@sha256:4cb2da17a223df07d3393a76500dd954256bf98eb785293a1c24dede71b2e779
          env:
            - name: FIREFLY_URL
              value: http://firefly.firefly.svc.cluster.local:8080
            - name: TZ
              value: Europe/Berlin
          ports:
            - containerPort: 80
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/www/html/database/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: firefly-pico-data
---
apiVersion: v1
kind: Service
metadata:
  name: firefly-pico
  namespace: firefly
  labels:
    app: firefly-pico
spec:
  selector:
    app: firefly-pico
  ports:
    - port: 80
      targetPort: http
      name: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: firefly-pico-data
  namespace: firefly
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-ssd
  resources:
    requests:
      storage: 1Gi
