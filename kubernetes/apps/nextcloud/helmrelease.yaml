---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 30m
  chart:
    spec:
      chart: nextcloud
      version: "9.4.1"
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: flux-system
      interval: 12h
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    image:
      repository: nextcloud
      tag: 35.0.2@sha256:3f05f4d5eded9d3d029e617926500645cca6344710364737a374088f6811095a
      flavor: apache
      pullPolicy: IfNotPresent

    replicaCount: 1

    nextcloud:
      host: cloud.pxldi.de
      username: admin
      existingSecret:
        enabled: true
        secretName: nextcloud-credentials
        usernameKey: NEXTCLOUD_USERNAME
        passwordKey: NEXTCLOUD_PASSWORD
      trustedDomains:
        - cloud.pxldi.de
        - pxldi.de
        - nextcloud.nextcloud.svc.cluster.local
      datadir: /var/www/html/data
      # The image starts as root: the entrypoint copies and chowns the code and
      # runs occ through su as www-data, and Apache binds 80 and then runs its
      # workers as www-data, signalling them from the root parent. Those are the
      # capabilities added back; the other default ones (MKNOD, NET_RAW,
      # SYS_CHROOT, SETFCAP, SETPCAP, FSETID) are dropped.
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
          add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE, KILL, AUDIT_WRITE]
      configs:
        custom.config.php: |-
          <?php
          $CONFIG = array (
            'trusted_proxies' => array('10.0.0.0/8'),
            'overwrite.cli.url' => 'https://cloud.pxldi.de',
            'overwriteprotocol' => 'https',
          );
      phpConfigs:
        upload-limit.ini: |-
          upload_max_filesize = 10G
          post_max_size = 10G
          memory_limit = 512M
      defaultConfigs:
        .htaccess: true
        apache-pretty-urls.config.php: true
        apcu.config.php: true
        apps.config.php: true
        autoconfig.php: true
        redis.config.php: true
        reverse-proxy.config.php: true
        s3.config.php: false
        smtp.config.php: false
        swift.config.php: false
        upgrade-disable-web.config.php: true

    phpClientHttpsFix:
      enabled: true
      protocol: https

    internalDatabase:
      enabled: false

    externalDatabase:
      enabled: true
      type: postgresql
      host: nextcloud-postgresql
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud-credentials
        usernameKey: POSTGRES_USER
        passwordKey: POSTGRES_PASSWORD

    postgresql:
      enabled: true
      global:
        postgresql:
          auth:
            database: nextcloud
            username: nextcloud
            existingSecret: nextcloud-credentials
            secretKeys:
              userPasswordKey: POSTGRES_PASSWORD
      primary:
        # The chart's policy allows 5432 from every pod in the cluster, and
        # policies add up, so the namespace default-deny could not close it.
        # Without it, allow-intra-namespace is the only way in.
        networkPolicy:
          enabled: false
        persistence:
          enabled: true
          storageClass: local-ssd
          size: 10Gi
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"

    # redis.yaml runs the cache on the official image. The bitnami subchart
    # is pinned to bitnamilegacy/redis, which no longer gets security fixes.
    redis:
      enabled: false
    externalRedis:
      enabled: true
      host: nextcloud-cache
      port: "6379"
      existingSecret:
        enabled: true
        secretName: nextcloud-credentials
        passwordKey: redis-password

    persistence:
      enabled: true
      nextcloudData:
        enabled: true
        existingClaim: nextcloud-data-pvc

    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"

    livenessProbe:
      httpGet:
        path: /status.php
        port: http
        httpHeaders:
          - name: Host
            value: cloud.pxldi.de
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

    readinessProbe:
      httpGet:
        path: /status.php
        port: http
        httpHeaders:
          - name: Host
            value: cloud.pxldi.de
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

    startupProbe:
      httpGet:
        path: /status.php
        port: http
        httpHeaders:
          - name: Host
            value: cloud.pxldi.de
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

    cronjob:
      enabled: true
      type: sidecar
      sidecar:
        # crond runs as root and starts each job as www-data.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
            add: [SETUID, SETGID, DAC_OVERRIDE, AUDIT_WRITE]
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
