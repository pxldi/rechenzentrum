# House only (LAN and tailnet). No forward-auth: RomM's own OIDC login against
# authentik is the gate, and handheld clients (Argosy, muOS) send API tokens
# that cannot follow a login redirect. Only romm-users and romm-admins
# complete the flow.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: romm
  namespace: romm
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`games.pxldi.de`)
      priority: 10
      middlewares:
        - name: internal-only
          namespace: traefik
      services:
        - name: romm
          port: 8080
