---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: searxng
data:
  settings.yml: |
    use_default_settings: true

    general:
      debug: false
      instance_name: "SearXNG (Internal)"
      contact_url: false

    server:
      limiter: false
      image_proxy: true
      secret_key: ""  # Will be set via env var

    ui:
      static_use_hash: true
      default_theme: simple
      default_locale: en
      theme_args:
        simple_style: dark
      infinite_scroll: true
      query_in_title: true

    search:
      safe_search: 0
      autocomplete: "duckduckgo"
      default_lang: "en"
      formats:
        - html
        - json

    enabled_plugins:
      - 'Hash plugin'
      - 'Self Information'
      - 'Tracker URL remover'
      - 'Ahmia blacklist'
      - 'Hostname replace'
      - 'Open Access DOI rewrite'
      - 'Calculator'
      - 'Unit Converter'

    engines:
      # General web engines. With only DuckDuckGo, Brave, Qwant and
      # Startpage, one burst of queries from the chat bot got all four
      # rate-limited or CAPTCHA'd at once and every search came back empty,
      # so the load is spread wider. Startpage and Mojeek stay off: both now
      # answer with a proof-of-work CAPTCHA and upstream marks them inactive.
      - name: duckduckgo
        disabled: false
        weight: 1.5

      - name: duckduckgo web
        disabled: false

      - name: brave
        disabled: false
        weight: 1.3

      - name: qwant
        disabled: false

      - name: google
        disabled: false

      - name: bing
        disabled: false

      - name: yahoo
        disabled: false

      - name: wikipedia
        disabled: false
      - name: github
        disabled: false
      - name: stackoverflow
        disabled: false

      - name: archwiki
        engine: archlinux
        disabled: false
      - name: youtube
        disabled: false
