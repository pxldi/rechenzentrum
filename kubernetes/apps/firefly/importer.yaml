---
# Firefly III Data Importer. Pulls Volksbank and Revolut transactions through
# Enable Banking (free restricted mode for one's own accounts; the consent is
# renewed every 90 days in the importer's UI) and writes them to Firefly over
# the API with a Personal Access Token, in-cluster, past forward-auth.
#
# It has no login of its own, so its route is house only and behind authentik.
# Enable Banking's redirect comes back through the user's browser to
# https://finance-import.pxldi.de/eb-callback, which already holds the
# authentik session.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-importer
  namespace: firefly
  labels:
    app: firefly-importer
spec:
  replicas: 1
  # No volume; an import's state lives in the browser session and the saved
  # configuration file the user downloads.
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: firefly-importer
  template:
    metadata:
      labels:
        app: firefly-importer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: importer
          image: fireflyiii/data-importer:version-2.3.5@sha256:2627644321afdcb52b49b258126bfe98312c2f93a709cc3a07c90327854e6aa2
          env:
            - name: FIREFLY_III_URL
              value: http://firefly.firefly.svc.cluster.local:8080
            # What the importer shows as links to Firefly.
            - name: VANITY_URL
              value: https://finance.pxldi.de
            - name: FIREFLY_III_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: firefly-importer
                  key: FIREFLY_III_ACCESS_TOKEN
            - name: ENABLE_BANKING_APP_ID
              valueFrom:
                secretKeyRef:
                  name: firefly-importer
                  key: ENABLE_BANKING_APP_ID
            - name: ENABLE_BANKING_PRIVATE_KEY_FILE
              value: /secrets/enable-banking.pem
            # Some banks want the user's address in a header. "autodetect"
            # asks icanhazip.com, which keeps the house's address out of Git.
            - name: ENABLE_BANKING_IMPORT_IP
              value: autodetect
            - name: AUTO_IMPORT_SECRET
              valueFrom:
                secretKeyRef:
                  name: firefly-importer
                  key: AUTO_IMPORT_SECRET
            - name: TRUSTED_PROXIES
              value: "**"
            - name: TZ
              value: Europe/Berlin
            - name: FALLBACK_LOCALE
              value: de_DE
            - name: LOG_LEVEL
              value: notice
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              memory: 384Mi
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: enable-banking
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: enable-banking
          secret:
            secretName: firefly-importer
            items:
              - key: ENABLE_BANKING_PRIVATE_KEY
                path: enable-banking.pem
---
apiVersion: v1
kind: Service
metadata:
  name: firefly-importer
  namespace: firefly
  labels:
    app: firefly-importer
spec:
  selector:
    app: firefly-importer
  ports:
    - port: 8080
      targetPort: http
      name: http
