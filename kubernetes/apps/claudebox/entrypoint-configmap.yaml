---
# Startup sequence for the Remote Control servers. Kept in a ConfigMap rather
# than inline in the Deployment so the shell is readable and diffable on its
# own — the split the multica daemon used, which this repository no longer
# deploys.
#
# Two things have to be true before `claude remote-control` will start, and
# neither can be expressed in a manifest because both are per-account state on
# the PVC rather than configuration:
#
#   1. an eligible claude.ai login  — without it the command exits with an
#      error rather than starting (it is not a warning; there is no degraded
#      mode)
#   2. workspace trust for each directory a server runs in — Claude Code
#      refuses to operate in a directory nobody has accepted the trust dialog
#      for, and the dialog is interactive by design
#
# The login is done by one `kubectl exec` documented in deployment.yaml, and
# this script waits for it, polling and saying what it is waiting for, rather
# than exiting. It used to exit after 60 seconds, and that window was exactly
# the problem on 2026-09-03: the OAuth flow prints a URL, a human opens it and
# pastes a code back, and the container was gone before the code arrived,
# taking the half-finished login with it. A pod that stays Running can be
# exec'd into at leisure. Workspace trust is recorded by this script itself,
# for the projects root and every repository it finds there; see below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claudebox-entrypoint
  namespace: claudebox
data:
  entrypoint.sh: |
    #!/bin/sh
    set -eu

    hint() {
      echo "    kubectl exec -it -n claudebox deploy/claudebox -- claude auth login" >&2
      echo "  open the URL it prints, paste the code back. The login persists on the PVC" >&2
      echo "  and this script picks it up on its next poll." >&2
    }

    mkdir -p "$CLAUDEBOX_PROJECTS_ROOT"
    cd "$CLAUDEBOX_PROJECTS_ROOT"

    echo "==> git identity"
    git config --global user.name "$GIT_AUTHOR_NAME"
    git config --global user.email "$GIT_AUTHOR_EMAIL"
    # Every repo under the projects root is checked out by a different process
    # than the one reading it (a session, an exec'd shell, this script), and
    # git's ownership check fires on the ones it did not create itself.
    git config --global --add safe.directory '*'

    # Private clones. Same arrangement the multica daemon used: gh answers git's
    # credential requests from GH_TOKEN in the environment, so the token is
    # never written to the PVC.
    #
    # REPLACE_ME is the value the Secret ships with, because the repo's CI
    # rejects a Secret whose payload is not SOPS-encrypted and an empty string
    # encrypts to nothing. Treating it as absent is the difference between "no
    # token, public repos only" in this log and a 401 from gh on every clone.
    case "${GH_TOKEN:-}" in
      "" | REPLACE_ME)
        echo "==> no GITHUB_TOKEN — public repos only, private clones will 403"
        echo "    fill it in with: sops kubernetes/apps/claudebox/secret.yaml"
        unset GH_TOKEN
        ;;
      *)
        echo "==> wiring gh up as git's credential helper for github.com"
        gh auth setup-git --hostname github.com
        ;;
    esac

    echo "==> claude $(claude --version)"

    # `claude remote-control --help` checks Remote Control eligibility before it
    # prints anything, which makes it the documented way to ask "is this machine
    # signed in and allowed" without starting a server or guessing at the name
    # of a credentials file.
    until claude remote-control --help >/dev/null 2>&1; do
      echo "==> not signed in, or Remote Control is not available for this account." >&2
      echo "  Sign in once:" >&2
      hint
      sleep 30
    done

    # The repositories: every git checkout directly under the projects root.
    # Nothing names them; a clone made from any session is a server after the
    # next restart. Discovery happens once, here, because recording trust means
    # rewriting ~/.claude.json (below), and that file is not touched while
    # sessions are running.
    repos=""
    count=0
    for dir in "$CLAUDEBOX_PROJECTS_ROOT"/*/; do
      dir=${dir%/}
      [ -d "$dir/.git" ] || continue
      if [ "$count" -ge "${CLAUDEBOX_MAX_REPO_SERVERS:-8}" ]; then
        echo "==> not serving $dir: CLAUDEBOX_MAX_REPO_SERVERS reached" >&2
        continue
      fi
      repos="$repos $dir"
      count=$((count + 1))
    done
    echo "==> $count repositories under $CLAUDEBOX_PROJECTS_ROOT:$repos"

    # Two answers Claude Code otherwise asks for interactively, recorded where
    # it would record them itself so that it does not ask. Neither is a
    # permission; both are one-time UI dialogs.
    #
    #   remoteDialogSeen   `claude remote-control` asks "Enable Remote Control?
    #                      (y/n)" on first use. Its stdin here is /dev/null, so
    #                      that read returns EOF, the server exits 0 and this
    #                      script restarts the pod — every thirty seconds, until
    #                      someone answers a question nobody can see.
    #   hasTrustDialogAccepted  per directory. `claude` refuses to run in a
    #                      directory without it, and the dialog is interactive.
    #                      Granting it here is the same grant for every
    #                      directory a server runs in. Trust is per directory,
    #                      not inherited, so each repository gets its own entry.
    #
    # jq writes a temp file and moves it over the original, because
    # ~/.claude.json is tens of kilobytes of state Claude Code writes itself
    # and a truncated write there costs the login.
    echo "==> recording remote-control consent and workspace trust"
    trust_filter='.remoteDialogSeen = true | .hasUsedRemoteControl = true'
    for root in "$CLAUDEBOX_PROJECTS_ROOT" $repos; do
      trust_filter="$trust_filter | .projects[\"$root\"].hasTrustDialogAccepted = true"
    done
    jq "$trust_filter" "$HOME/.claude.json" > "$HOME/.claude.json.tmp" \
      && mv "$HOME/.claude.json.tmp" "$HOME/.claude.json" \
      && chmod 600 "$HOME/.claude.json"

    # The luna MCP server: a session here can hand a task to a Codex agent on
    # gpt-5.6-luna, the same way the workstation's sessions can. The server is
    # /opt/codex-mcp (a ConfigMap, see kustomization.yaml); it shells out to
    # the `codex` binary the init container installed.
    #
    # Registered at user scope, which lands in ~/.claude.json on the PVC and so
    # applies to every session in every root. Idempotent: `claude mcp add`
    # refuses a name that exists, so ask first.
    #
    # Codex's own config is seeded only if absent. It is user state that codex
    # rewrites (model-availability counters and the like), so overwriting it
    # every boot would be wrong; but a fresh PVC needs approvals_reviewer set,
    # because server.mjs runs workspace-write tasks with --approve-for-me and
    # that flag routes approvals through whatever reviewer is configured. The
    # trust entries are what let `codex exec` run in those directories without
    # asking. A repository cloned after the seed needs its entry added by hand.
    #
    # The Codex *login* is not seeded. Like the Claude one, it is per-account
    # state done by hand: `codex login --device-auth` from an exec'd shell,
    # which prints a URL and a code and needs no browser callback into the pod.
    #
    # Do NOT copy the workstation's ~/.codex/auth.json here instead. That file
    # holds one refresh token and OpenAI accepts each refresh token once. Two
    # machines holding the same one race: the first to refresh wins, the other
    # gets 401 refresh_token_reused on its next run and stays broken until it
    # logs in again. That is how every luna run failed on 2026-09-07.
    if ! claude mcp get luna >/dev/null 2>&1; then
      echo "==> registering the luna MCP server"
      claude mcp add --transport stdio --scope user luna -- node /opt/codex-mcp/server.mjs
    fi
    mkdir -p "$CODEX_MCP_RUNS_DIR" "$HOME/.codex"
    if [ ! -f "$HOME/.codex/config.toml" ]; then
      echo "==> seeding ~/.codex/config.toml"
      {
        echo 'approvals_reviewer = "auto_review"'
        echo 'model_reasoning_effort = "medium"'
        for root in "$CLAUDEBOX_PROJECTS_ROOT" $repos; do
          printf '\n[projects."%s"]\ntrust_level = "trusted"\n' "$root"
        done
      } > "$HOME/.codex/config.toml"
    fi
    if [ -f "$HOME/.codex/auth.json" ]; then
      echo "==> codex $(codex --version 2>/dev/null || echo '(version unknown)'), signed in"
    else
      echo "==> codex is not signed in; the luna tools will fail until it is:" >&2
      echo "    kubectl exec -it -n claudebox deploy/claudebox -- codex login --device-auth" >&2
    fi

    # The vault. The bridge sidecar mirrors ~/second_brain from CouchDB, and
    # Claude Code's global instructions, skills and session-context hook all
    # live in its ops/ folder, the same layout the workstation uses. On a fresh
    # volume the mirror fills only after the bridge has connected, so wait a
    # bounded time for the hook script before starting servers: a session
    # started before it exists would print a hook error and run without its
    # project context. On every later boot the file is already there.
    vault="$HOME/second_brain"
    hook="$vault/ops/bin/session-context.sh"
    waited=0
    until [ -f "$hook" ] || [ "$waited" -ge "${CLAUDEBOX_VAULT_WAIT_SECONDS:-120}" ]; do
      [ "$waited" -eq 0 ] && echo "==> waiting for the bridge to mirror the vault into $vault"
      sleep 5
      waited=$((waited + 5))
    done
    if [ -f "$hook" ]; then
      echo "==> vault mirror present"
    else
      echo "==> vault mirror still empty after ${waited}s; starting without it. Check: kubectl logs -n claudebox deploy/claudebox -c bridge" >&2
    fi

    # ~/.claude/skills and ~/.claude/CLAUDE.md point into the vault, as on the
    # workstation. The links dangle harmlessly until the mirror arrives. A real
    # directory or file already at either path is moved aside, not deleted:
    # `ln -sfn` onto an existing directory would create the link inside it.
    mkdir -p "$HOME/.claude"
    for pair in "skills:$vault/ops/skills" "CLAUDE.md:$vault/ops/CLAUDE.md"; do
      link="$HOME/.claude/${pair%%:*}"
      target=${pair#*:}
      if [ -e "$link" ] && [ ! -L "$link" ]; then
        echo "==> moving aside $link (not a symlink) to $link.local"
        mv "$link" "$link.local"
      fi
      ln -sfn "$target" "$link"
    done

    # One Remote Control server per repository, plus one in the projects root
    # for work that belongs to no repo. No session is created up front
    # (--no-create-session-in-dir): a session exists when someone creates one
    # from claude.ai/code or the phone, in that server's directory, and that
    # directory is what the vault's session-context hook keys on. The cost is
    # that stopping a server archives its sessions, so a pod restart ends every
    # conversation in the app; the transcripts stay on the PVC and
    # `claude --resume` from an exec'd shell brings one back.
    #
    # --spawn same-dir: sessions of one server share its directory. worktree
    # mode would isolate them but needs the server rooted in one git
    # repository, which rules it out for the projects root, and a worktree per
    # phone session is more than this needs.
    #
    # --capacity is a per-server cap on concurrent sessions, not a reservation.
    # Measured on this image:
    #   ~165Mi   a server process, whether or not it has sessions
    #   ~230Mi   an ordinary session
    #   ~520Mi   a session resumed from a very large transcript
    # Memory is not the constraint that bites first. Four cores are: one session
    # running a build wants all of them, and --capacity cannot prevent two
    # sessions from doing that at once no matter what it is set to.
    #
    # --permission-mode auto is also pinned by the managed settings, which win
    # over this flag; it is repeated here so the intent is visible where the
    # servers start. Approving individual tool calls from a phone is unusable
    # enough that the alternative is not using this at all. Neither this flag
    # nor the setting is unrestricted: the deny and ask rules in
    # /etc/claude-code/managed-settings.json still apply, and are mounted
    # read-only precisely so a session running without prompts cannot edit them.
    #
    # The session name prefix is the repository, so the app shows
    # schall-brave-otter rather than the pod's random hostname. Each server
    # logs to its own file under /tmp, because several servers redrawing their
    # status onto one stdout make the pod log unreadable; the projects-root
    # server keeps stdout so `kubectl logs` shows at least one of them. Logs
    # are appended (>>), so a restart loop leaves a history instead of
    # truncating the evidence of why it restarted, and so that opening
    # /dev/stdout does not truncate whatever stdout is.
    #
    # Each server runs under a small supervisor subshell that reports its exit
    # on a fifo, because POSIX sh has no `wait -n` and `kill -0` cannot tell a
    # zombie from a live process. The fifo is opened read-write on fd 3 so a
    # report never blocks, even after this script has stopped reading.
    fifo=$(mktemp -u); mkfifo "$fifo"; exec 3<>"$fifo"; rm -f "$fifo"
    server_pids=""
    start_server() {
      dir=$1
      prefix=$2
      log=$3
      echo "==> Remote Control server '$prefix' in $dir (log: $log)"
      (
        cd "$dir" || exit 1
        claude remote-control \
          --spawn same-dir \
          --no-create-session-in-dir \
          --capacity "${CLAUDEBOX_SESSION_CAPACITY:-2}" \
          --permission-mode auto \
          --remote-control-session-name-prefix "$prefix" >>"$log" 2>&1 &
        child=$!
        trap 'kill -TERM "$child" 2>/dev/null || true' TERM INT
        rc=0
        wait "$child" || rc=$?
        echo "$prefix $rc" >&3
      ) &
      server_pids="$server_pids $!"
    }
    for dir in $repos; do
      name=$(basename "$dir")
      start_server "$dir" "$name" "/tmp/remote-control-$name.log"
    done
    start_server "$CLAUDEBOX_PROJECTS_ROOT" projects /dev/stdout

    # Forward pod shutdown to the servers rather than letting the shell take the
    # signal and leave them orphaned for the grace period. Without this a
    # rollout would leave them running through the grace period and be killed
    # by SIGKILL instead. 143 is what a shell killed by TERM reports.
    trap 'kill -TERM $server_pids 2>/dev/null || true; exit 143' TERM INT

    # Reached on one ordinary path: the ~10 minute network outage after which
    # server mode gives up and a server exits. That is why this pod restarts
    # rather than stays down. The servers all see the same network, so one
    # exiting means the rest are about to; restart them together by exiting.
    exited=""
    rc=0
    read -r exited rc <&3 || true
    echo "==> Remote Control server '$exited' exited ($rc); stopping the rest so the pod restarts them together." >&2
    kill -TERM $server_pids 2>/dev/null || true

    # A server that exits on its own reports below 128; a shell that took a
    # signal reports 128+signum, which here means the pod is being stopped
    # rather than the server having failed. Pausing on that path would burn the
    # whole termination grace period on every rollout and end in a SIGKILL;
    # pausing on a real failure is the point, so that a permanently failing
    # start does not fill the log faster than anyone can read it.
    if [ "${rc:-1}" -lt 128 ]; then
      sleep 30
    fi
    exit "${rc:-1}"
