---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: seerr-chart
      version: "3.9.1"
      sourceRef:
        kind: HelmRepository
        name: seerr
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/seerr-team/seerr
      tag: "v3.4.1"
    config:
      persistence:
        existingClaim: seerr-config-pvc
    env:
      TZ: "Europe/Berlin"
    service:
      port: 80
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
