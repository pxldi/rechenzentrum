---
# The recipe MCP server in chatops reads and writes recipes over the API. It
# is the only pod in that namespace allowed in: the agent itself never talks
# to Tandoor directly and never holds its token.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-tandoor-mcp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: chatops
          podSelector:
            matchLabels:
              app: tandoor-mcp
