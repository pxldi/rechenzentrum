apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wardrowbe
  namespace: wardrowbe
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: "Host(`wear.pxldi.de`) && PathPrefix(`/outpost.goauthentik.io/`)"
      priority: 20
      services:
        - name: authentik-server
          namespace: authentik
          port: 9000
    - kind: Rule
      match: "Host(`wear.pxldi.de`) && PathPrefix(`/api/v1`)"
      priority: 15
      middlewares:
        - name: authentik-forward-auth
          namespace: traefik
      services:
        - name: wardrowbe-backend
          port: 8000
    - kind: Rule
      match: "Host(`wear.pxldi.de`)"
      priority: 10
      middlewares:
        - name: authentik-forward-auth
          namespace: traefik
      services:
        - name: wardrowbe-frontend
          port: 3000
