apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
  - rbac.yaml
  - service.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - ingressroute.yaml
components:
  # Egress. The dashboard reads a widget out of 24 services in 15 namespaces,
  # which is why it takes the cluster-wide rule rather than two dozen selectors.
  # The internet rule is for the weather widget and the Traefik rule for the few
  # links it resolves by public name.
  - ../../../components/default-deny-egress
  - ../../../components/allow-dns
  - ../../../components/allow-intra-namespace-egress
  - ../../../components/allow-internet-egress
  - ../../../components/allow-egress-to-cluster
  - ../../../components/allow-egress-to-ingress
  - ../../infrastructure-config/networkpolicies/default-deny-ingress
  - ../../infrastructure-config/networkpolicies/allow-intra-namespace
  - ../../infrastructure-config/networkpolicies/allow-from-traefik
  - ../../infrastructure-config/networkpolicies/allow-from-monitoring

# Resource metadata only: preserve existing Service/Deployment selectors and pod templates.
labels:
  - pairs:
      app.kubernetes.io/name: gethomepage
      app.kubernetes.io/instance: gethomepage
      app.kubernetes.io/component: application
      app.kubernetes.io/part-of: rechenzentrum
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
    includeTemplates: false
