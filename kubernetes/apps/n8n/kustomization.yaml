---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: n8n
resources:
  - helmrelease.yaml
  - ingress.yaml
  - pvc.yaml
components:
  # Egress. A workflow engine: a workflow can legitimately call anything,
  # including gotify in another namespace and the outside world, so it takes the
  # cluster-wide rule. It also reaches n8n-postgresql-rw here, and the API
  # server is for that instance manager. An n8n-egress NetworkPolicy of the same
  # shape has been in this namespace since 2026-04-17, applied by hand and never
  # in git; these components replace it and it should be deleted.
  - ../../../components/default-deny-egress
  - ../../../components/allow-dns
  - ../../../components/allow-intra-namespace-egress
  - ../../../components/allow-internet-egress
  - ../../../components/allow-egress-to-cluster
  - ../../../components/allow-egress-to-ingress
  - ../../../components/allow-egress-to-apiserver
  - ../../infrastructure-config/networkpolicies/default-deny-ingress
  - ../../infrastructure-config/networkpolicies/allow-intra-namespace
  - ../../infrastructure-config/networkpolicies/allow-from-traefik
  - ../../infrastructure-config/networkpolicies/allow-from-monitoring
  - ../../infrastructure-config/networkpolicies/allow-from-homepage

# Resource metadata only: preserve existing Service/Deployment selectors and pod templates.
labels:
  - pairs:
      app.kubernetes.io/name: n8n
      app.kubernetes.io/instance: n8n
      app.kubernetes.io/component: application
      app.kubernetes.io/part-of: rechenzentrum
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
    includeTemplates: false
