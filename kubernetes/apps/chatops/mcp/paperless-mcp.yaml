---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-mcp
  namespace: chatops
  labels:
    app: paperless-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-mcp
  template:
    metadata:
      labels:
        app: paperless-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paperless-mcp
          image: ghcr.io/pxldi/homelab-mcp:sha-21f0d074499bbdf6d6e794cb4ab9174ec0fa61b4
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "paperless_mcp"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PAPERLESS_URL
              value: http://paperless.paperless.svc.cluster.local
            - name: PAPERLESS_PUBLIC_URL
              value: https://paperless.pxldi.de
            - name: PAPERLESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chatops-paperless
                  key: PAPERLESS_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # The kubernetes client writes certificate material to a temp file
          # when it loads a config, and a read-only root has nowhere for it.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-mcp
  namespace: chatops
spec:
  selector:
    app: paperless-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
