---
# velero-ui shipped bound to cluster-admin, because the chart defaults to
# `rbac.clusterAdministrator: true` with `clusterAdministratorName: cluster-admin`.
# That is a web application, reachable over HTTP, holding write access to every
# object in the cluster including every Secret. It sits behind forward-auth, so
# it takes one auth bypass — or one XSS in the UI — to go from "read my backups"
# to "read every credential in the cluster and schedule a pod on the node".
#
# The chart already creates two namespaced Roles in `velero` that cover
# everything the UI actually does:
#   velero-ui-velero-permissions -> velero.io/* (all verbs) + read pods,
#                                   secrets and configmaps in `velero`
#   velero-ui-permissions        -> read pods
# So creating, deleting and restoring backups keeps working untouched. The only
# thing cluster-admin added on top was cluster-scoped reach, and the UI needs
# exactly one kind of it: reading, so its namespace/PVC/storage-class pickers and
# its restore views can enumerate the cluster.
#
# This ClusterRole is that, and nothing else — no writes, no deletes, no exec, no
# cluster-wide secret access. The chart's ClusterRoleBinding is repointed at it
# via `rbac.clusterAdministratorName` in the HelmRelease.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: velero-ui-cluster-reader
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - persistentvolumes
      - persistentvolumeclaims
      - pods
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshotcontents", "volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # Velero's own CRs are namespaced in `velero` and writable there through the
  # chart's Role. This is the cluster-wide *read* the UI uses to notice CRs that
  # live outside that namespace, e.g. a BackupStorageLocation added elsewhere.
  - apiGroups: ["velero.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
