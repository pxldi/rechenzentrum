---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: minecraft
# No server runs here. The namespace only keeps the old Architect's Exodus world.
resources:
  - pvcs.yaml
components:
  - ../../../components/default-deny-egress
  - ../../infrastructure-config/networkpolicies/default-deny-ingress

# Resource metadata only: preserve existing PVC specs.
labels:
  - pairs:
      app.kubernetes.io/name: minecraft
      app.kubernetes.io/instance: minecraft
      app.kubernetes.io/component: application
      app.kubernetes.io/part-of: rechenzentrum
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
    includeTemplates: false
