---
# cloudflared only dials out: to Cloudflare's edge, and to Traefik's `tunnel`
# entrypoint. Nothing in the cluster has a reason to connect to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cloudflared
spec:
  podSelector: {}
  policyTypes:
    - Ingress
