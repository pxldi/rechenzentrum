---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: adventurelog
resources:
  - secret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
components:
  # Egress. The frontend calls the backend and the backend calls the
  # database, both by Service name in this namespace, so the intra-namespace
  # twin is required; the ingress-only component next to it does not permit
  # a pod to open a connection. The backend also geocodes against
  # OpenStreetMap, which no hostname rule can express, so it gets the
  # internet minus everything inside the house.
  - ../../../components/default-deny-egress
  - ../../../components/allow-dns
  - ../../../components/allow-intra-namespace-egress
  - ../../../components/allow-internet-egress
  - ../../infrastructure-config/networkpolicies/default-deny-ingress
  - ../../infrastructure-config/networkpolicies/allow-intra-namespace
  - ../../infrastructure-config/networkpolicies/allow-from-traefik
  - ../../infrastructure-config/networkpolicies/allow-from-monitoring
  - ../../infrastructure-config/networkpolicies/allow-from-homepage

# Resource metadata only: preserve existing Service/Deployment selectors and pod templates.
labels:
  - pairs:
      app.kubernetes.io/name: adventurelog
      app.kubernetes.io/instance: adventurelog
      app.kubernetes.io/component: application
      app.kubernetes.io/part-of: rechenzentrum
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
    includeTemplates: false
