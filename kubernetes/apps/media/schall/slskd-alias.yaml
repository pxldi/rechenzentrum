---
# Schall stores slskd's address in its own settings table as http://slskd:5030,
# a short name that only resolved while both lived in media. slskd moved to
# its own namespace on 2026-09-13; this alias keeps the short name working so
# the setting did not have to change under the app. Remove it once the
# setting says slskd.slskd.svc.cluster.local.
apiVersion: v1
kind: Service
metadata:
  name: slskd
  namespace: media
spec:
  type: ExternalName
  externalName: slskd.slskd.svc.cluster.local
  ports:
    - name: http
      port: 5030
