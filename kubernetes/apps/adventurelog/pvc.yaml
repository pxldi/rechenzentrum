---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adventurelog-db
  namespace: adventurelog
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-ssd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adventurelog-media
  namespace: adventurelog
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-ssd
  resources:
    requests:
      storage: 10Gi
