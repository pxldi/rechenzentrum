---
# Nightly logical dump of the Nextcloud database.
# It goes to the dumps/ directory of its own data volume.
#
# Velero copies that volume file by file while Postgres runs, so the data
# directory it carries off is only crash-consistent, and a restore from it is
# Postgres recovering from a crash. pg_dump reads one snapshot of the database
# and gives a file that restores on any server of the same or newer major.
# The raw copy stays in the backup next to it.
#
# The dump goes onto a volume the database pod mounts:
# Velero's file-system backup only copies volumes of pods that are running at
# 02:20, and this Job's pod is not. RWO binds a volume to a node, not a pod, so
# the Job mounts it beside the running database.
#
# Same shape as karakeep/backup.yaml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-db-dump
  namespace: nextcloud
spec:
  # Before Velero's daily run at 02:20 UTC in summer and winter, and clear of
  # the 03:00 WAN drop. The five dumps are ten minutes apart.
  schedule: "10 1 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              # pg_dump 17, the server's major. The alpine build because it
              # carries wget for the pings; the server's own image does not.
              # A newer server major makes pg_dump refuse, which fails the job
              # and the ping.
              image: postgres:17.12-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
              command:
                - sh
                - -c
                - |
                  set -eu
                  # healthchecks.io: a start ping, then the exit status from the
                  # EXIT trap, so a failed dump, a hung one and a night the job
                  # never ran all reach a phone without this node. busybox wget,
                  # which the alpine image already has. Failed pings are ignored
                  # and an empty key skips them.
                  hc() {
                    [ -n "${HC_PING_KEY:-}" ] || return 0
                    for _ in 1 2 3; do
                      wget -q -T 10 -O /dev/null \
                        "https://hc-ping.com/${HC_PING_KEY}/nextcloud-db-dump$1" && return 0
                      sleep 5
                    done
                    return 0
                  }
                  trap 'hc "/$?"' EXIT
                  hc /start
                  # Owner and group only: the dump holds what the database holds.
                  umask 027
                  mkdir -p /volume/dumps
                  rm -f /volume/dumps/*.partial
                  out="/volume/dumps/nextcloud-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  pg_dump --format=custom --file="$out.partial"
                  # A dump pg_restore cannot read is not kept, and the older
                  # ones are not rotated out for it.
                  pg_restore --list "$out.partial" >/dev/null
                  mv "$out.partial" "$out"
                  printf 'wrote %s (%s)\n' "$out" "$(du -h "$out" | cut -f1)"

                  # Three nights here; Velero keeps the history. The file just
                  # written is held out of the list, so a clock that has moved
                  # backwards cannot delete it.
                  ls -1t /volume/dumps/nextcloud-*.dump | grep -v -F "$out" |
                    tail -n +3 | while read -r stale; do rm -f "$stale"; done
              env:
                - name: PGHOST
                  value: nextcloud-postgresql
                - name: PGDATABASE
                  value: nextcloud
                - name: PGUSER
                  value: nextcloud
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-credentials
                      key: POSTGRES_PASSWORD
                - name: HC_PING_KEY
                  valueFrom:
                    secretKeyRef:
                      name: healthchecks
                      key: ping-key
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: dumps
                  mountPath: /volume
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 512Mi
          volumes:
            # The chart's data volume, at /bitnami/postgresql in the database
            # pod. The data directory is data/ beside dumps/. uid 1001 is the
            # chart's postgres user.
            - name: dumps
              persistentVolumeClaim:
                claimName: data-nextcloud-postgresql-0
