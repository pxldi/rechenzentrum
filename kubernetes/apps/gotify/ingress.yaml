---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gotify
  namespace: gotify
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`gotify.pxldi.de`)
      priority: 10
      middlewares:
        - name: internal-or-cluster
          namespace: traefik
      services:
        - name: gotify
          port: 80
