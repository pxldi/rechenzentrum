---
# Base backup nightly; WAL streams continuously between them.
#
# Staggered across clusters and kept clear of velero's 02:00 window so six
# Postgres uploads and a full cluster backup are not competing for the same
# residential uplink.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: multica-postgresql-daily
  namespace: multica
spec:
  # Six fields, not five: CNPG's cron includes a leading seconds specifier.
  schedule: "0 30 0 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: multica-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
