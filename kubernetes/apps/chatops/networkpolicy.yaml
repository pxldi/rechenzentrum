# Five pods, five different sets of destinations, so these are written per
# pod rather than pulled from the namespace-wide components. The `app` label
# is the pod's own; the app.kubernetes.io labels stop at the Deployment.
#
# Ingress: only Traefik, and only to the containers claude.ai uses. Those check
# a bearer token themselves: the vault's, the recipe server's and the calendar
# server's second containers on 8001, the gate in front of Snacky, and the
# openGym server. Port 8000 on the first three served the retired Telegram
# agent and accepts nothing now.
---
# The recipe server reaches Tandoor by its Service name; the matching
# ingress rule lives in kubernetes/apps/tandoor. Its claude.ai container also
# fetches Authentik's signing keys, the same rule as the vault pod's.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tandoor-mcp-egress
spec:
  podSelector:
    matchLabels:
      app: tandoor-mcp
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tandoor
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - protocol: TCP
          port: 9000
---
# The calendar server reaches Nextcloud by its Service name; the matching
# ingress rule lives in kubernetes/apps/nextcloud. Its claude.ai container
# also fetches Authentik's signing keys.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: calendar-mcp-egress
spec:
  podSelector:
    matchLabels:
      app: calendar-mcp
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nextcloud
          podSelector:
            matchLabels:
              app.kubernetes.io/name: nextcloud
      # The pod's port, not the Service's: the Service maps 8080 to 80, and a
      # policy sees the packet after that translation.
      ports:
        - protocol: TCP
          port: 80
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - protocol: TCP
          port: 9000
---
# The vault pod's bridge replicates with CouchDB in obsidian-sync and nothing
# else; the matching ingress rule lives in kubernetes/apps/obsidian.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-mcp-egress
spec:
  podSelector:
    matchLabels:
      app: vault-mcp
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: obsidian-sync
          podSelector:
            matchLabels:
              app: obsidian-sync
      ports:
        - protocol: TCP
          port: 5984
    # The claude.ai server fetches Authentik's signing keys over the
    # in-cluster Service. Egress matches after DNAT, so this names the
    # server's container port, not the Service's 80; and the whole namespace
    # rather than a pod label, because only the server listens on 9000 there
    # and a wrong label would fail silently.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - protocol: TCP
          port: 9000
---
# Traefik forwards vault-mcp.<domain> to the claude.ai server and nothing
# else in this namespace; nothing reaches port 8000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vault-mcp-claude-from-traefik
spec:
  podSelector:
    matchLabels:
      app: vault-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8001
---
# Traefik forwards tandoor-mcp, calendar-mcp and snacky-mcp.<domain> to the
# claude.ai side of each, and to nothing else in these pods: the recipe
# server's port 8000 is closed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tandoor-mcp-claude-from-traefik
spec:
  podSelector:
    matchLabels:
      app: tandoor-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-calendar-mcp-claude-from-traefik
spec:
  podSelector:
    matchLabels:
      app: calendar-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-snacky-mcp-gate-from-traefik
spec:
  podSelector:
    matchLabels:
      app: snacky-mcp-gate
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8000
---
# The gate forwards to Snacky's MCP port and fetches Authentik's signing
# keys; nothing else. Snacky's side of the first rule is in
# kubernetes/apps/snacky/networkpolicy.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: snacky-mcp-gate-egress
spec:
  podSelector:
    matchLabels:
      app: snacky-mcp-gate
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: snacky
          podSelector:
            matchLabels:
              app: snacky
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - protocol: TCP
          port: 9000
---
# Traefik forwards opengym-mcp.<domain> to the openGym server, which checks
# the bearer token itself.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-opengym-mcp-from-traefik
spec:
  podSelector:
    matchLabels:
      app: opengym-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8000
---
# The openGym server reaches openGym's Service and fetches Authentik's signing
# keys; nothing else. openGym's side of the first rule is in
# kubernetes/apps/opengym/networkpolicy-chatops.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opengym-mcp-egress
spec:
  podSelector:
    matchLabels:
      app: opengym-mcp
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opengym
          podSelector:
            matchLabels:
              app: opengym
      ports:
        - protocol: TCP
          port: 80
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - protocol: TCP
          port: 9000
