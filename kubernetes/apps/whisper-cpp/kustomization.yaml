apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: whisper-cpp
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
components:
  - ../../infrastructure-config/networkpolicies/default-deny-ingress
  - ../../infrastructure-config/networkpolicies/allow-intra-namespace
  - ../../infrastructure-config/networkpolicies/allow-from-monitoring
