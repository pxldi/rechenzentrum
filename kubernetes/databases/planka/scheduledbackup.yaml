---
# Base backup once a week, on Sunday; WAL streams continuously between them,
# so any point in the retention window can still be recovered. Daily base
# backups were full copies kept for 30 days, in a bucket that held 91 GB in
# November 2026. A weekly base means a restore replays up to a week of WAL,
# and the Wednesday restore test replays three days of it.
#
# The name still says daily. Renaming would make Flux delete this object and
# with it every Backup object it owns.
#
# Staggered across clusters and kept clear of velero's 02:00 window so six
# Postgres uploads and a full cluster backup are not competing for the same
# residential uplink.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: planka-postgresql-daily
  namespace: planka
spec:
  # Six fields, not five: CNPG's cron includes a leading seconds specifier.
  schedule: "0 30 1 * * 0"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: planka-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
