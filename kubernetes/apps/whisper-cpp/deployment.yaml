apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-cpp
  namespace: whisper-cpp
  labels:
    app: whisper-cpp
spec:
  # One replica is the whole feature: ZeroClaw posts every Telegram voice note
  # here (`[transcription]` in chatops/zeroclaw/config.toml), and at zero the
  # note fails on a refused connection with no error anywhere but the agent's
  # log. It was parked once to save the ~1.9Gi ggml-medium keeps resident, when
  # nothing called it. Medium stays for German accuracy; ggml-small in the args
  # below saves ~1Gi if memory gets tight.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whisper-cpp
  template:
    metadata:
      labels:
        app: whisper-cpp
    spec:
      priorityClassName: rechenzentrum-bulk
      initContainers:
        - name: download-model
          image: ghcr.io/ggml-org/whisper.cpp:main-e6234cd435eb1299ac405916f4083a62ac044b81
          args:
            - |
              test -f /models/ggml-medium.bin || ./models/download-ggml-model.sh medium /models
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: whisper-cpp
          image: ghcr.io/ggml-org/whisper.cpp:main-e6234cd435eb1299ac405916f4083a62ac044b81
          args:
            - |
              ./build/bin/whisper-server \
                --host 0.0.0.0 \
                --port 8080 \
                --model /models/ggml-medium.bin \
                --language de \
                --threads 6 \
                --processors 1 \
                --convert \
                --max-context 0
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              memory: 6Gi
          volumeMounts:
            - name: models
              mountPath: /models
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: whisper-cpp-models
