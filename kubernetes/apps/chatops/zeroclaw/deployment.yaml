---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeroclaw
  namespace: chatops
  labels:
    app: zeroclaw
spec:
  replicas: 1
  # Holds the RWO data claim with SQLite databases in it: one pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zeroclaw
  template:
    metadata:
      labels:
        app: zeroclaw
      annotations:
        backup.velero.io/backup-volumes: data
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The image runs as nobody (65534) and has no shell to chown with.
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zeroclaw
          image: ghcr.io/zeroclaw-labs/zeroclaw:v0.8.5@sha256:ba9c76b9287c125ec9cc9a8270654f2c0efbd610eef3e00eece3cd11f6c083e0
          imagePullPolicy: IfNotPresent
          args: ["daemon"]
          env:
            - name: LANG
              value: C.UTF-8
            - name: TZ
              value: Europe/Berlin
            - name: HOME
              value: /zeroclaw-data
            # ZeroClaw resolves its install root from the config dir first, so
            # sessions, state and the agent workspace all land under this
            # directory on the PVC. config.toml is a read-only file inside it.
            - name: ZEROCLAW_CONFIG_DIR
              value: /zeroclaw-data/zeroclaw
            - name: ZEROCLAW_DATA_DIR
              value: /zeroclaw-data/zeroclaw
            - name: ZEROCLAW_channels__telegram__home__bot_token
              valueFrom:
                secretKeyRef:
                  name: chatops-credentials
                  key: TELEGRAM_BOT_TOKEN
            - name: ZEROCLAW_peer_groups__telegram_home__external_peers
              valueFrom:
                secretKeyRef:
                  name: chatops-credentials
                  key: TELEGRAM_PEERS
            - name: ZEROCLAW_providers__models__anthropic__default__api_key
              valueFrom:
                secretKeyRef:
                  name: chatops-credentials
                  key: ANTHROPIC_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /zeroclaw-data
            - name: config
              mountPath: /zeroclaw-data/zeroclaw/config.toml
              subPath: config.toml
              readOnly: true
            - name: config
              mountPath: /zeroclaw-data/zeroclaw/agents/haus/workspace/SOUL.md
              subPath: SOUL.md
              readOnly: true
            - name: config
              mountPath: /zeroclaw-data/zeroclaw/agents/haus/workspace/AGENTS.md
              subPath: AGENTS.md
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # The image's own HEALTHCHECK. Telegram is long-polled outbound, so
          # there is no port a probe could ask, and the dashboard is loopback.
          startupProbe:
            exec:
              command: ["zeroclaw", "status", "--format=exit-code"]
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["zeroclaw", "status", "--format=exit-code"]
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zeroclaw-data
        - name: config
          configMap:
            name: zeroclaw-config
        - name: tmp
          emptyDir: {}
