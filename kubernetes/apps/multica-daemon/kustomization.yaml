---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: multica-daemon
resources:
  - pvc.yaml
  - secret.yaml
  - entrypoint-configmap.yaml
  - deployment.yaml
components:
  # No ingress of any kind: the daemon dials out to the server and serves
  # nothing. No allow-from-traefik, no Service.
  - ../../infrastructure-config/networkpolicies/default-deny-ingress
  - ../../infrastructure-config/networkpolicies/allow-from-monitoring

# Resource metadata only: preserve existing Service/Deployment selectors and pod templates.
labels:
  - pairs:
      app.kubernetes.io/name: multica-daemon
      app.kubernetes.io/instance: multica-daemon
      app.kubernetes.io/component: application
      app.kubernetes.io/part-of: rechenzentrum
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
    includeTemplates: false
