---
# Scrutiny sends disk warnings through the Alertmanager bridges' app token.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-scrutiny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: scrutiny
      ports:
        - port: 80
          protocol: TCP
