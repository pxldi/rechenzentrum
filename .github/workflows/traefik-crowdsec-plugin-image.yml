---
# Builds the CrowdSec bouncer plugin source image that Traefik loads locally
# (kubernetes/infrastructure/networking/traefik). Same shape as
# livesync-bridge-image.yml: pull requests build and smoke-test, a push to main
# or a manual run publishes, tagged with the commit it built.
name: Traefik CrowdSec Plugin Image

on:
  # So a build can be started by hand once ENABLE_IMAGE_PUBLISH is set,
  # without a commit to trigger it.
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "images/traefik-crowdsec-plugin/**"
      - ".github/workflows/traefik-crowdsec-plugin-image.yml"
  push:
    branches: ["main"]
    paths:
      - "images/traefik-crowdsec-plugin/**"
      - ".github/workflows/traefik-crowdsec-plugin-image.yml"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/traefik-crowdsec-plugin
  # On a pull_request `github.sha` is the ephemeral merge commit; the branch
  # head is the commit that actually holds the Dockerfile.
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    if: vars.ENABLE_IMAGE_PUBLISH == 'true'
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign trades this token for a short-lived certificate.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: images/traefik-crowdsec-plugin/Dockerfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/traefik-crowdsec-plugin
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ env.SHA }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:main', env.IMAGE) || '' }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}
          provenance: false

      # Scans the image just built: loaded locally on a pull request, pulled
      # from GHCR after a push. The first step lists HIGH and CRITICAL in the
      # job log; the second fails the build on a CRITICAL with a fix available.
      # An unfixed one does not fail, because no change here could clear it.
      - name: List high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ env.SHA }}
          severity: HIGH,CRITICAL
          format: table
      - name: Gate on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ env.SHA }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-setup-trivy: true

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signature binds the pushed digest to this workflow in this
      # repository through GitHub's OIDC identity, so there is no key to keep.
      # Check one with
      #   cosign verify "$IMAGE@<digest>" \
      #     --certificate-identity-regexp '^https://github.com/pxldi/rechenzentrum/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the pushed digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # The copy must land where Traefik expects a local plugin: the manifest
      # and the vendored source, written as the pod user into an empty volume.
      - name: Smoke-test the copy
        run: |
          set -euo pipefail
          mkdir -p /tmp/plugin && chmod 0777 /tmp/plugin
          docker run --rm --user 65532:65532 -v /tmp/plugin:/plugins-local "${IMAGE}:sha-${SHA}"
          test -f /tmp/plugin/.traefik.yml
          test -f /tmp/plugin/bouncer.go
          test -d /tmp/plugin/vendor
          grep -q "import: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin" /tmp/plugin/.traefik.yml
