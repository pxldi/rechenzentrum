---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: anchor
# Generated so the name carries a content hash: an edit to the file rolls the
# pod.
configMapGenerator:
  - name: anchor-supervisord
    files:
      - supervisord.conf
resources:
  - secret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
components:
  # Egress. The app reaches anchor-postgresql-rw in this namespace and speaks
  # OIDC to authentik by its public name, which resolves to the node or to the
  # internet depending on the upstream (hence both the ingress and internet
  # rules). The internet rule is also for the barman sidecar in the Postgres
  # pod, which ships WAL and base backups to B2. allow-egress-to-apiserver is
  # for the CNPG instance manager.
  - ../../../components/default-deny-egress
  - ../../../components/allow-dns
  - ../../../components/allow-intra-namespace-egress
  - ../../../components/allow-internet-egress
  - ../../../components/allow-egress-to-ingress
  - ../../../components/allow-egress-to-apiserver
  - ../../infrastructure-config/networkpolicies/default-deny-ingress
  - ../../infrastructure-config/networkpolicies/allow-intra-namespace
  - ../../infrastructure-config/networkpolicies/allow-from-traefik
  - ../../infrastructure-config/networkpolicies/allow-from-monitoring

# Resource metadata only: preserve existing Service/Deployment selectors and pod templates.
labels:
  - pairs:
      app.kubernetes.io/name: anchor
      app.kubernetes.io/instance: anchor
      app.kubernetes.io/component: application
      app.kubernetes.io/part-of: rechenzentrum
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
    includeTemplates: false
