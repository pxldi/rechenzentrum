apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage
  namespace: homepage
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pxldi.de`)
      kind: Rule
      services:
        - name: homepage
          port: 3000
      middlewares:
        # The apex is the only name still proxied by Cloudflare in public DNS,
        # so this route depends on AdGuard rewriting the bare name to Traefik
        # locally; without that, requests arrive wearing Cloudflare's address
        # and the allowlist refuses them from the LAN as well. The wildcard
        # rewrite does not cover the apex, and that missing entry is what made
        # this route answer 403 to everyone from 2026-09-13 to 09-15. If the
        # rewrite is ever dropped, this route breaks first.
        - name: internal-only
          namespace: traefik
        - name: authentik-forward-auth
          namespace: traefik
