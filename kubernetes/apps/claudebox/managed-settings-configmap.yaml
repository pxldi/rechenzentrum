---
# The guardrails that survive the session they constrain.
#
# The servers spawn their sessions in auto mode, and this file pins that mode
# for every session in the pod, including the ones an exec'd `claude` starts.
# In auto mode a classifier reviews actions instead of a person; it skips
# every prompt except explicit `ask` rules, and it can still be blocked by
# explicit `deny` rules. Those two lists are what this file mostly is.
#
# It is delivered as managed settings — /etc/claude-code/managed-settings.json,
# read-only, from a ConfigMap — rather than as ~/.claude/settings.json, because
# HOME is the PVC and a session running without prompts can edit anything on
# it, including its own restrictions. Managed settings are also the highest
# precedence there is: no user setting, project setting or command-line flag
# overrides a managed permission rule. So these rules are reviewed here, in
# git, or they are not rules.
#
# What this is NOT: a security boundary. Bash rules match on command prefixes,
# and the same command spelled differently — through an exec wrapper, with an
# extra flag before the subcommand, via a script — does not match. These stop
# the plausible accident, which is the failure mode that actually happens when
# nobody is watching the approval prompts. The boundaries that hold are
# elsewhere and are not made of string matching: the branch-protection ruleset
# on GitHub, the absence of age.key in this pod, and the fact that the
# ServiceAccount token is not mounted.
#
# `gh pr merge` and `git push` are deliberately not denied. A session that can
# open a PR but not land it leaves every piece of finished work waiting on
# someone to come back and click merge, which is the opposite of what these
# sessions are for. Merging is also the point where the real boundary applies:
# the branch-protection ruleset decides what may land on main, and it is not
# this file's job to duplicate that badly. Pushing straight to main stays an
# `ask` rather than a deny — the ruleset would reject it anyway, so the rule is
# there to catch the mistake early, not to hold a line.
#
# Only `Edit(path)` rules are matched by the file permission checks; a
# `Write(path)` rule matches nothing and Claude Code logs a warning about it on
# every start. Edit rules already cover every file-editing tool, Write included.
#
# No Read() rule with a glob. `Read(**/age.key)` was here until 2026-09-19.
# A Bash command that reads a whole directory (`grep -r`, `rg`, `cat dir/*`)
# cannot be proven not to touch a file a Read() deny rule covers, so Claude
# Code hands it to a person, in every permission mode, and a `**` glob covers
# every directory there is. That was the prompt on every repository-wide grep
# from the phone. The rule bought nothing: age.key is gitignored and has never
# been on this volume, and `sops -d` is denied below regardless. The one
# Read() rule left names an absolute path under ~/.claude, which no grep over
# ~/projects overlaps. A project's own settings can reintroduce the problem
# for that project; schall's .env rules do.
#
# `defaultMode` is read from the highest-ranked source only, so this value
# wins over the `--permission-mode` flag the entrypoint passes as well; the
# flag stays for anyone reading the entrypoint alone.
#
# `additionalDirectories` is what stopped the prompts of 2026-09. A session's
# working directory is the repo its server sits in. Everything else on the
# volume — a sibling repo after a `cd`, a linked worktree under
# .claude/worktrees that a subagent greps recursively, the vault, /tmp — was
# "outside the working directories", and the first read outside them prompts
# even in auto mode, per session, with the answer recorded nowhere a server can
# reach. Listing the three roots here makes those reads ordinary. Directories
# added this way grant file access only; they load no settings, skills or
# CLAUDE.md of their own, which is the point.
#
# `hooks.PreToolUse` denies one shape of Bash command: `cd <dir>` chained
# with anything after it. Claude Code cannot resolve a relative path after a
# cd inside one command, and as soon as any Read() deny rule exists (the one
# below, or a project's .env rule) it must ask a person before running it,
# even in auto mode. That prompt is what a phone session cannot answer, and it
# was the 2026-09 complaint. The hook refuses the shape once with the
# alternative spelled out; the retry costs seconds, the prompt cost the
# session. Same script the workstation runs.
#
# `hooks.SessionStart` is the vault's session-context hook, the same one the
# workstation runs from ~/.claude/settings.json. It prints the matching project
# spec and its open tasks from ~/second_brain/ops/ into every new session. It is
# here and not in a user settings file for the same reason as the rules above:
# the PVC is writable by the sessions, this ConfigMap is not. `sh` in front
# because the bridge mirrors files as 0644 and the script is not executable on
# the pod. The hook only prints; it changes nothing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claudebox-managed-settings
  namespace: claudebox
data:
  managed-settings.json: |
    {
      "permissions": {
        "defaultMode": "auto",
        "additionalDirectories": [
          "/home/pxldi/projects",
          "/home/pxldi/second_brain",
          "/tmp"
        ],
        "deny": [
          "Edit(//home/pxldi/.claude/**)",
          "Edit(//home/pxldi/.claude.json)",
          "Read(//home/pxldi/.claude/.credentials.json)",
          "Bash(sops -d:*)",
          "Bash(sops --decrypt:*)",
          "Bash(gh repo delete:*)"
        ],
        "ask": [
          "Bash(git push --force:*)",
          "Bash(git push -f:*)",
          "Bash(git push --delete:*)",
          "Bash(git push origin --delete:*)",
          "Bash(git push origin main:*)",
          "Bash(git push origin HEAD:main:*)",
          "Bash(gh release delete:*)"
        ]
      },
      "hooks": {
        "PreToolUse": [
          {
            "matcher": "Bash",
            "hooks": [
              {
                "type": "command",
                "command": "sh \"$HOME/second_brain/ops/bin/no-cd-compound.sh\"",
                "timeout": 10
              }
            ]
          }
        ],
        "SessionStart": [
          {
            "matcher": "startup|resume|clear",
            "hooks": [
              {
                "type": "command",
                "command": "sh \"$HOME/second_brain/ops/bin/session-context.sh\"",
                "timeout": 10
              }
            ]
          }
        ]
      }
    }
