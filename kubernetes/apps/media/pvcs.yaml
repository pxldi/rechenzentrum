  name: media-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-hdd1
  resources:
    requests:
      storage: 4Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soundcloud-music-pvc
  namespace: media
  labels:
    # Downloaded audio. Navidrome rebuilds its index from the files,
    # and the files come back from SoundCloud.
    backup.rechenzentrum.dev/reproducible: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-hdd1
  resources:
    requests:
      storage: 200Gi
