---
# claudebox drives the cluster: it carries a ServiceAccount token and rbac.yaml
# gives it real permissions, so an agent working in there runs kubectl against
# this API server. `allow-egress-to-apiserver` is not reusable here, because it
# selects CNPG instance pods; this is the same rule with the selector this
# namespace needs.
#
# The address is the node's, on the API port. A request to the API Service
# address is rewritten to exactly that, so the rule sees it either way; see
# docs/EGRESS.md on matching after DNAT.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claudebox-egress-to-apiserver
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.8.226/32
      ports:
        - protocol: TCP
          port: 6443
---
# The bridge sidecar replicates the second_brain database with CouchDB in
# obsidian-sync. allow-internet-egress excludes RFC1918, so a cluster address
# needs its own rule. The matching ingress rule is
# kubernetes/apps/obsidian/networkpolicy-claudebox.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claudebox-egress-to-obsidian-sync
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: obsidian-sync
          podSelector:
            matchLabels:
              app: obsidian-sync
      ports:
        - protocol: TCP
          port: 5984
