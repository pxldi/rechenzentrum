---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: overleaf-mongo
  namespace: overleaf
spec:
  serviceName: overleaf-mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:8
          command:
            - mongod
            - --replSet=rs0
            - --bind_ip_all
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: sharelatex
          resources:
            requests:
              memory: "768Mi"
              cpu: "100m"
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    sleep 5
                    until mongosh --eval "db.adminCommand('ping')" 2>/dev/null; do sleep 2; done
                    mongosh --eval "try { rs.status() } catch(e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'overleaf-mongo-0.overleaf-mongo.overleaf.svc.cluster.local:27017' }] }) }"
          startupProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "rs.status().ok"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping')"
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "rs.status().ok"
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-ssd
        resources:
          requests:
            storage: 20Gi
