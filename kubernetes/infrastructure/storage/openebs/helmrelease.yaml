apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: openebs
spec:
  interval: 30m
  chart:
    spec:
      chart: openebs
      version: 4.6.1
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
      interval: 12h

  install:
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    localpv-provisioner:
      enabled: true
      localpv:
        image:
          registry: openebs
          repository: provisioner-localpv
          tag: 4.6.0
        # Requests only. This provisioner is what binds every new PVC in the
        # cluster; BestEffort put it at the front of the kubelet's eviction
        # queue, ahead of workloads that did declare something. A limit is wrong
        # here for the same reason it is wrong on the databases -- idle almost
        # always, briefly busy exactly when a volume is being created.
        #
        # Nested under `localpv`, not beside it: the subchart reads
        # localpv-provisioner.localpv.resources. Put one level up it parses
        # fine, renders nothing, and the container stays BestEffort -- which is
        # exactly what #984 did.
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
      hostpathClass:
        enabled: true
        name: openebs-hostpath
        isDefaultClass: false

    zfs-localpv:
      enabled: false

    lvm-localpv:
      enabled: false

    mayastor:
      enabled: false

    ndm:
      enabled: false

    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false
    loki:
      enabled: false
    alloy:
      enabled: false
