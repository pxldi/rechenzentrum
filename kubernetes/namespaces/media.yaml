---
apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    # baseline since 2026-09-13. slskd's gluetun sidecar (NET_ADMIN) was the
    # last violation here and moved to its own namespace; jellyfin had been
    # clean since #927. Verified before the flip with a server dry-run of this
    # label, which warns about every running pod that would violate it and
    # warned about none.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.33
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    name: media
