apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ryot
resources:
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pvcs.yaml
components:
  # Egress. The app reaches ryot-postgres by Service name in this namespace,
  # so the intra-namespace twin is required. The internet rule is for the
  # metadata providers it queries. allow-egress-to-ingress is for
  # SERVER_OIDC_ISSUER_URL: a pxldi.de name resolves to the node's address or
  # to the public one depending on which upstream CoreDNS last asked, and only
  # the public one falls inside allow-internet-egress.
  - ../../../components/default-deny-egress
  - ../../../components/allow-dns
  - ../../../components/allow-intra-namespace-egress
  - ../../../components/allow-internet-egress
  - ../../../components/allow-egress-to-ingress
  - ../../infrastructure-config/networkpolicies/default-deny-ingress
  - ../../infrastructure-config/networkpolicies/allow-intra-namespace
  - ../../infrastructure-config/networkpolicies/allow-from-traefik
  - ../../infrastructure-config/networkpolicies/allow-from-monitoring
  - ../../infrastructure-config/networkpolicies/allow-from-homepage

# Resource metadata only: preserve existing Service/Deployment selectors and pod templates.
labels:
  - pairs:
      app.kubernetes.io/name: ryot
      app.kubernetes.io/instance: ryot
      app.kubernetes.io/component: application
      app.kubernetes.io/part-of: rechenzentrum
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
    includeTemplates: false
