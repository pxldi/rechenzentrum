---
# Where a browser upload waits while Schall checks it arrived whole, before it
# is filed into the music volume. Deliberately its own claim rather than a
# subdirectory of cantus-music-pvc: a scan of /music would walk into one of
# those and index a half-written upload as music the library holds, and Schall
# refuses to start if its staging path is inside a music folder. Sized for a few
# lossless releases in flight at once, not for keeping them.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cantus-uploads-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-hdd1
  resources:
    requests:
      storage: 50Gi
