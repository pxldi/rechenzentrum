---
apiVersion: v1
kind: Service
metadata:
  name: sure-redis
  namespace: sure
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: sure-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sure-redis
  namespace: sure
spec:
  serviceName: sure-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sure-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sure-redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-ssd
        resources:
          requests:
            storage: 2Gi
