---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
  namespace: arc-systems
spec:
  interval: 30m
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      interval: 12h
  install:
    timeout: 10m
    crds: Create
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    crds: CreateReplace
    remediation:
      retries: 3

  values:
    replicaCount: 1

    # The ServiceAccount name is pinned rather than left to the chart's
    # fullname template because the runner scale set has to name it explicitly
    # (controllerServiceAccount, in helmrelease-runners.yaml) to authorise a
    # controller that lives in another namespace. A generated name that shifted
    # on a chart upgrade would break that link quietly.
    serviceAccount:
      create: true
      name: arc-controller-gha-rs-controller

    flags:
      # The chart ships logLevel: debug, which is a firehose for something that
      # spends most of its life idle.
      logLevel: "info"
      logFormat: "text"

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
