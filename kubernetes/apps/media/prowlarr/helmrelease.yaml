---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: prowlarr
      version: "22.13.2"
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    env:
      TZ: "Europe/Berlin"
    metrics:
      main:
        enabled: false
    persistence:
      config:
        enabled: true
        existingClaim: prowlarr-config-pvc
