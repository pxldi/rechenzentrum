---
# For an application that calls another service here by its public hostname,
# the way ryot points its OIDC issuer at a name on this domain.
#
# What a pod gets back for one of these names is not stable. CoreDNS forwards to
# two upstreams: AdGuard, which rewrites them to the node, and Quad9, which
# answers with the public record. Measured in the ryot pod on 2026-09-15, ten
# lookups in a row returned the public address and a few minutes later the same
# name returned the node's, because the cache had turned over. Both reach the
# same Traefik, one straight at the node and one back in through the router.
#
# The public answer needs no rule here: it leaves as a public address and
# `allow-internet-egress` covers it. This rule is for the other answer, and it
# is written as a selector rather than as the node's address on purpose.
#
# **An egress policy matches the destination after DNAT.** A packet a pod sends
# to the node on 443, or to a Service address, has already been rewritten to the
# receiving pod and its container port by the time kube-router evaluates it. So
# `ipBlock: <node>/32` port 443 never matches anything; measured on 2026-09-15,
# a pod holding exactly that rule still could not reach the node, while the same
# pod reached the public address fine. The destination that has to be named is
# the Traefik pod on 8443, which is what `websecure` resolves to.
#
# The same reasoning is why `allow-dns` works: it selects the CoreDNS pods, and
# a query to the kube-dns Service address arrives as the pod behind it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-ingress
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8443
