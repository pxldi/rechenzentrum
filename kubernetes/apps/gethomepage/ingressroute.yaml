apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage
  namespace: homepage
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pxldi.de`)
      kind: Rule
      services:
        - name: homepage
          port: 3000
      middlewares:
        # internal-only is deliberately absent, unlike every other private
        # route. `pxldi.de` is the only name that resolves to Cloudflare
        # (188.114.96.3) instead of the house (78.43.53.100), so requests reach
        # Traefik wearing Cloudflare's address and the allowlist rejected them
        # from the LAN as well, 403 for everyone from 2026-09-13 to 09-15.
        #
        # Restore it once the apex resolves like every subdomain: add an AdGuard
        # rewrite for `pxldi.de` -> 192.168.8.226, or stop proxying the apex
        # through Cloudflare. Trusting X-Forwarded-For instead is not an option
        # while the subdomains reach Traefik directly.
        - name: authentik-forward-auth
          namespace: traefik
