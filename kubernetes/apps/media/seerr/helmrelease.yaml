---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: seerr-chart
      version: "3.10.1"
      sourceRef:
        kind: HelmRepository
        name: seerr
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Scaled to zero to free memory for the GTNH server. The chart has no
  # replicaCount, so the patch sets it. Remove this block to resume.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: seerr-seerr-chart
            patch: |
              - op: replace
                path: /spec/replicas
                value: 0
  values:
    image:
      repository: ghcr.io/seerr-team/seerr
      tag: "v3.5.1"
    config:
      persistence:
        existingClaim: seerr-config-pvc
    env:
      TZ: "Europe/Berlin"
    service:
      port: 80
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
