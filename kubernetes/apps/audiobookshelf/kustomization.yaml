---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: audiobookshelf
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
components:
  # Egress. Metadata providers (Audible, Google Books, iTunes, OpenLibrary),
  # podcast feeds and cover images are on the internet. OIDC goes to authentik
  # by its public name, which resolves to the node or to the internet
  # depending on the upstream, hence both the ingress and internet rules.
  - ../../../components/default-deny-egress
  - ../../../components/allow-dns
  - ../../../components/allow-internet-egress
  - ../../../components/allow-egress-to-ingress
  - ../../infrastructure-config/networkpolicies/default-deny-ingress
  - ../../infrastructure-config/networkpolicies/allow-from-traefik
  - ../../infrastructure-config/networkpolicies/allow-from-monitoring

# Resource metadata only: preserve existing Service/Deployment selectors and pod templates.
labels:
  - pairs:
      app.kubernetes.io/name: audiobookshelf
      app.kubernetes.io/instance: audiobookshelf
      app.kubernetes.io/component: application
      app.kubernetes.io/part-of: rechenzentrum
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
    includeTemplates: false
