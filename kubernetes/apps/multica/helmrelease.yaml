---
# Multica — issue tracker / workspace where AI coding agents (Claude Code,
# Codex, and ~20 other CLIs) work as assignable teammates. Deployed from the
# official OCI chart with the bundled postgres and Ingress disabled: the
# database is a CNPG cluster (house rule) and routing is a Traefik
# IngressRoute (ingress.yaml) on the single host code.pxldi.de.
#
# There are no LLM credentials here and none in the cluster at all: agents run
# on external "runtimes" — the multica daemon on whatever machine should
# execute the work — which connect inbound to this server with their own
# tokens. Subscription logins (Claude Max, ChatGPT) live on the daemon
# machine, used by the official agent CLIs the daemon spawns.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multica
  namespace: multica
spec:
  interval: 30m
  chart:
    spec:
      chart: multica
      version: "0.4.36"
      sourceRef:
        kind: HelmRepository
        name: multica
        namespace: flux-system
      interval: 12h
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3

  values:
    # multica-secrets (secret.yaml): JWT_SECRET, DATABASE_URL, the optional
    # integration keys, and MULTICA_DEV_VERIFICATION_CODE. With no email
    # provider configured, login verification codes are printed to the
    # backend pod logs instead — see the PR/README notes.
    #
    # The chart mounts this Secret with `envFrom`, so every key in it becomes
    # a backend env var and no values here need to change to add one. That is
    # how the GitHub App integration (Settings → "Connect GitHub": repo
    # picker, PR cards with CI status and mergeability, webhooks) is wired:
    # GITHUB_APP_SLUG, GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY and
    # GITHUB_WEBHOOK_SECRET ship empty, which leaves the feature off, and are
    # filled with `sops kubernetes/apps/multica/secret.yaml` once the App
    # exists at github.com/settings/apps. Register it with
    #   Webhook URL   https://code.pxldi.de/api/webhooks/github
    #   Setup URL     https://code.pxldi.de/api/github/setup
    # both of which the IngressRoute already sends to the backend via /api.
    #
    # This is the *server* half only. It does not authenticate the agent
    # daemon's git clones — the daemon gets a clone URL and nothing else, and
    # carries its own credential (see apps/multica-daemon).
    existingSecret: multica-secrets

    postgres:
      # CNPG cluster from postgres-cluster.yaml; DATABASE_URL comes from
      # multica-secrets. The chart's pgvector Deployment/PVC are not created.
      external:
        enabled: true

    backend:
      # Parked at 0 alongside the frontend and the daemon: the app is idle and
      # this frees the node. The CNPG cluster (postgres-cluster.yaml) and the
      # uploads PVC below are deliberately left running/bound, so setting both
      # replicas back to 1 restores the app with its data intact.
      replicas: 0
      uploads:
        persistence:
          enabled: true
          size: 5Gi
          storageClass: local-ssd
      config:
        appEnv: production
        appUrl: https://code.pxldi.de
        frontendOrigin: https://code.pxldi.de
        # Uploads are served by the backend on the same host (the /uploads
        # route in ingress.yaml), so the public base URL is the app host.
        localUploadBaseUrl: https://code.pxldi.de
        googleRedirectUri: https://code.pxldi.de/auth/callback

    frontend:
      # See backend.replicas above — parked at 0 with the rest of the stack.
      replicas: 0
      config:
        # Empty remoteApiUrl → the Next.js runtime proxy targets this
        # release's backend Service; publicApiUrl/publicWsUrl stay empty for
        # same-origin. The IngressRoute short-circuits /api, /ws, /uploads
        # and /auth straight to the backend anyway.
        remoteApiUrl: ""

    ingress:
      # Managed by ingress.yaml (Traefik IngressRoute, single host) instead
      # of the chart's two-host Ingress pair.
      enabled: false
