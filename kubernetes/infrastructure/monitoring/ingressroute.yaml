---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: observability
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`grafana.pxldi.de`)
      middlewares:
        - name: authentik-forward-auth
          namespace: traefik
      priority: 10
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
    - kind: Rule
      match: "Host(`grafana.pxldi.de`) && PathPrefix(`/outpost.goauthentik.io/`)"
      priority: 15
      services:
        - name: authentik-server
          namespace: authentik
          port: 9000
