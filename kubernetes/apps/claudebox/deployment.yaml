---
# A Claude Code session that lives on the node instead of on a laptop.
#
# It runs `claude remote-control` in server mode. That process registers with
# the Anthropic API over outbound HTTPS and waits: the sessions it serves show
# up at https://claude.ai/code and in the Claude mobile app, and the phone or
# browser is only a screen. Execution, the filesystem and the toolchain are all
# here. Nothing is exposed — there is no Service, no IngressRoute, no hostname
# and no inbound port, which is why this app needs none of the ingress and
# forward-auth wiring every other app in this repo has.
#
# This is the workload #908 deleted, brought back smaller. What was removed
# there was not this idea but foscal: the Android emulator in a second
# container (7Gi limit, ~4.8Gi resident) and the Gradle and Kotlin daemons
# beside it, which between them caused both OOM incidents and the memory.max
# grind that took the apiserver down on 2026-08-19. Neither is here. What is
# left is the repositories cloned under ~/projects and the sessions that work
# on them, and the pod's whole footprint is 512Mi requested against a 6Gi
# ceiling rather than 15Gi of limits across two containers.
#
# One Remote Control server per repository, discovered at boot. The entrypoint
# starts a server in every git checkout directly under ~/projects, plus one in
# ~/projects itself for work that belongs to no repo. No session exists until
# one is created from claude.ai/code or the phone, and it is created in that
# server's directory, so the vault's session-context hook sees the right
# project. A new clone shows up as a server on the next pod restart. Nothing in
# this manifest names a repository any more.
#
# The vault rides along. A livesync-bridge sidecar (the same image the chatops
# vault pod runs) mirrors the second_brain LiveSync database into
# ~/second_brain on the PVC, both directions, so sessions here find the vault
# where the workstation keeps it: the global CLAUDE.md, the skills, the project
# specs and the tasks in ~/second_brain/ops/, all through the same paths. The
# entrypoint symlinks ~/.claude/skills and ~/.claude/CLAUDE.md into it. The
# bridge runs as uid 1000, the same as the sessions, because both sides write
# the same files; see the container below for what that costs.
#
# The image is the one built for the Multica daemon, unchanged. Multica itself
# was deleted from this repository on 2026-09-15, so claudebox is now the only
# consumer and `images/multica-daemon/` plus
# `.github/workflows/multica-daemon-image.yml` exist for it alone. They keep the
# old name rather than being renamed in the same change as the deletion; that is
# a rename of a published package and belongs on its own. That image was
# already the reviewed answer to "what does an agent expect to find on PATH" —
# Go 1.24.13, Node 24, kubectl/helm/flux/kustomize/stern/k9s, sops and age, gh,
# sqlc and goose, the PostgreSQL 17 client, Playwright's Chromium. It also
# carries a JDK 17 and an Android SDK that nothing here uses, which is roughly
# 1GiB of the 1.76GiB compressed pull and is being paid rather than argued
# about: stripping them means a second Dockerfile or a conditional stage, and
# the node has 740GB free. Splitting the image is its own reviewed change.
#
# Sessions run in auto permission mode, pinned by managed-settings-configmap.yaml
# and repeated as a flag in the entrypoint. The rules that still bind them are
# in that same file, mounted read-only at /etc/claude-code so that a session
# running without prompts cannot rewrite its own restrictions.
#
# There are deliberately NO API keys. Claude Code authenticates with a
# subscription login stored under HOME on the PVC, done once by hand:
#   kubectl exec -it -n claudebox deploy/claudebox -- claude auth login
# then open the URL it prints and paste the code back. The entrypoint waits for
# the login, polling, and says so. Workspace trust for ~/projects and every
# repository it discovers there is recorded by the entrypoint itself. The Codex CLI (for the luna MCP server)
# signs in with `codex login --device-auth`, its own login, never a copy of
# the workstation's auth.json (see the entrypoint for why). Both logins
# persist on the volume.
# Do NOT set ANTHROPIC_BASE_URL — Remote Control refuses to start when the API
# endpoint is anything other than api.anthropic.com, gateway or not.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claudebox
  namespace: claudebox
  labels:
    app.kubernetes.io/name: claudebox
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    # Single RWO PVC, and two servers sharing a projects root would edit the
    # same working copies — never run two pods against it at once.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: claudebox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claudebox
      annotations:
        # The one volume here is git checkouts, node_modules, Go and npm caches
        # and build output — all of it either a `git clone` or a rebuild away,
        # and all of it churning enough to make a weekly Kopia pass to B2
        # expensive for nothing. weekly-full-backup includes every namespace
        # ("*"), so without this it would be swept up by default.
        #
        # The two things on the volume that are NOT reconstructible are the
        # claude.ai login and the transcripts the project sessions resume from.
        # The login is a five-minute manual redo (see the header of this file).
        # The transcripts are not, which is why the last copy of them was taken
        # by hand before #908 deleted the volume, and why the same `tar czf -`
        # out of ~/.claude is worth repeating before anything destructive here.
        backup.velero.io/backup-volumes-excludes: "data"
    spec:
      # A token, deliberately.
      #
      # Mounting a ServiceAccount hands this code the API server, which is true
      # and remains true. What makes it defensible is the scope: the token below
      # is bound to agent-read (read verbs only, no secrets, no nodes/proxy)
      # plus exec in `media` alone. A session cannot mutate the cluster with it,
      # because every change here flows git -> PR -> Flux and RBAC grants no
      # write verb to match.
      #
      # See rbac.yaml for the read grant and infrastructure-config/
      # claudebox-exec/ for the exec boundary — including why `media` is a
      # coarser grant than it looks.
      serviceAccountName: claudebox
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
      initContainers:
        # Take ownership of the PVC root as uid 1000. A dynamically provisioned
        # volume's top-level dir is created root-owned; fsGroup only sets the
        # group, not the owner, and the runtime drops ALL capabilities so it
        # cannot chown it itself. HOME must be writable — Claude Code enforces
        # 0700 on ~/.claude.
        #
        # second_brain and the three .livesync-bridge/* directories are the
        # bridge's subPath mounts. The kubelet creates a missing subPath
        # directory root-owned, so they are created here first, as uid 1000,
        # or the bridge cannot write them.
        - name: fix-perms
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /home/pxldi/projects /home/pxldi/second_brain \
                /home/pxldi/.livesync-bridge/data /home/pxldi/.livesync-bridge/deno \
                /home/pxldi/.livesync-bridge/location_data
              chown 1000:1000 /home/pxldi /home/pxldi/projects /home/pxldi/second_brain \
                /home/pxldi/.livesync-bridge /home/pxldi/.livesync-bridge/data \
                /home/pxldi/.livesync-bridge/deno /home/pxldi/.livesync-bridge/location_data
              echo "chowned PVC roots to 1000:1000"
              # The kubelet creates the /tmp emptyDir as 0:1000 mode 2777 (the
              # pod's fsGroup, no sticky bit). Claude Code refuses to put its
              # cross-session socket in a world-writable /tmp without the
              # sticky bit and warns on every start; uid 1000 cannot fix a
              # root-owned directory's mode, so it is done here.
              chmod 1777 /tmp
              echo "set /tmp to 1777"
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /home/pxldi
            - name: tmp
              mountPath: /tmp
        # Claude Code and the Codex CLI, onto an emptyDir rather than the PVC,
        # so a version bump is a pod restart and nothing stale survives it.
        #
        # Codex is here because of the luna MCP server (see codex-mcp/ and the
        # entrypoint): it shells out to `codex exec`, and the tool it registers
        # with Claude Code is only as present as that binary. It signs in with
        # the operator's ChatGPT subscription, stored under ~/.codex on the PVC
        # — no API key, same shape as the Claude login.
        #
        # Pinned as plain env values: the Kubernetes Renovate manager only
        # reads `image:` fields, so these are bumped by hand. Check with
        #   npm view @anthropic-ai/claude-code version
        #   npm view @openai/codex version
        # Do not go below 2.1.224 — Remote Control's resume flags need 2.1.200
        # and a stale-token bug that made startup fail intermittently was fixed
        # in 2.1.224.
        #
        # Same image as the runtime container, so the pod pulls one image rather
        # than two and this step already has the node and npm it needs.
        - name: install-tools
          image: ghcr.io/pxldi-labs/multica-daemon:sha-ec91dd10fbc6f6ac11f3adc38d7002330ead8b8c
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              npm install -g --prefix /toolbin/npm \
                "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" \
                "@openai/codex@${CODEX_VERSION}"
              echo "installed:" && ls -l /toolbin/npm/bin
          env:
            - name: CLAUDE_CODE_VERSION
              value: "2.1.280"
            - name: CODEX_VERSION
              value: "0.153.4"
            # npm's default cache is $HOME/.npm and HOME is / for uid 0 here.
            - name: npm_config_cache
              value: /tmp/npm-cache
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: toolbin
              mountPath: /toolbin
            - name: tmp
              mountPath: /tmp
        # The bridge reads a JSON config that has to contain the CouchDB
        # credentials and the vault's E2EE passphrase in clear. It is rendered
        # from the Secret into a memory-backed emptyDir that only the bridge
        # mounts, so the passphrase is never on the volume and never in a
        # directory a session can read. Copied from the chatops vault pod.
        - name: render-bridge-config
          image: alpine:3.24
          command:
            - sh
            - -c
            - >-
              sed -e "s|@COUCHDB_USER@|${COUCHDB_USER}|g"
              -e "s|@COUCHDB_PASSWORD@|${COUCHDB_PASSWORD}|g"
              -e "s|@VAULT_PASSPHRASE@|${VAULT_PASSPHRASE}|g"
              /config-src/config.json > /rendered/config.json &&
              ! grep -q '@' /rendered/config.json &&
              ! grep -q 'REPLACE_ME' /rendered/config.json
          env:
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: claudebox-vault
                  key: COUCHDB_USER
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claudebox-vault
                  key: COUCHDB_PASSWORD
            - name: VAULT_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: claudebox-vault
                  key: VAULT_PASSPHRASE
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: bridge-config
              mountPath: /config-src
              readOnly: true
            - name: bridge-rendered
              mountPath: /rendered
      containers:
        # Note the owner: pxldi-labs, not pxldi. The image workflow tags
        # ghcr.io/${github.repository_owner}/multica-daemon and this repo moved
        # to the pxldi-labs org, so builds land there.
        - name: claudebox
          image: ghcr.io/pxldi-labs/multica-daemon:sha-ec91dd10fbc6f6ac11f3adc38d7002330ead8b8c
          imagePullPolicy: IfNotPresent
          command: ["sh", "/entrypoint/entrypoint.sh"]
          # So that an interactive `kubectl exec ... -- claude` starts in the
          # directory whose trust dialog needs accepting, rather than in one
          # that will still be untrusted afterwards.
          workingDir: /home/pxldi/projects
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: TZ
              value: "Europe/Berlin"
            # /home/pxldi rather than /data, and the reason is portability of
            # conversation history. Claude Code files transcripts under
            # ~/.claude/projects/<absolute-cwd-with-dashes>/, so a repo checked
            # out at /data/projects/schall records under -data-projects-schall
            # while the same repo on the operator's workstation records under
            # -home-pxldi-projects-schall. Same conversations, two filing
            # systems, and `claude --resume` on either machine finds nothing the
            # other wrote. Mounting the volume where the workstation keeps its
            # home makes the two identical, so history moves with an rsync in
            # either direction and nothing has to be renamed on the way. That is
            # also what makes the 2026-08-23 archive of the old volume usable
            # here: its transcripts are already filed under the paths below.
            - name: HOME
              value: /home/pxldi
            # Every git checkout directly under this directory gets a Remote
            # Control server of its own at boot, and the directory itself gets
            # one for work that belongs to no repo. The checkouts are NOT
            # created by this manifest; they are clones on the PVC, made by hand
            # or by a session, and a new one is picked up on the next restart.
            #
            # foscal must not be cloned here. It is the Android project, and
            # building it here is what needed the JDK, the Gradle daemons and
            # the emulator container that made this pod the largest consumer on
            # a 32Gi node. It builds on the workstation.
            - name: CLAUDEBOX_PROJECTS_ROOT
              value: /home/pxldi/projects
            # Concurrent sessions each server will hand out. A cap, not a
            # reservation. See entrypoint.sh for the measured memory numbers,
            # and for why four cores rather than 6Gi is the limit that bites.
            - name: CLAUDEBOX_SESSION_CAPACITY
              value: "2"
            # Idle servers cost ~165Mi each; more repositories than this get a
            # log line instead of a server.
            - name: CLAUDEBOX_MAX_REPO_SERVERS
              value: "8"
            # How long the entrypoint waits for the bridge to mirror the vault
            # before starting servers without it. Only a fresh PVC waits at all.
            - name: CLAUDEBOX_VAULT_WAIT_SECONDS
              value: "120"
            # /toolbin/npm/bin for the CLI the init container fetches, then
            # /home/pxldi/go/bin so anything `go install`ed during a session is
            # reachable in the same session, then the system default. Every
            # baked tool lives in /usr/local/bin or /usr/bin and does not
            # depend on this value.
            - name: PATH
              value: /toolbin/npm/bin:/home/pxldi/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: npm_config_cache
              value: /home/pxldi/.npm
            # Where the luna MCP server keeps its per-run status and event
            # files. Its default is .luna-runs next to server.mjs, which is a
            # read-only ConfigMap mount here; the PVC is the writable place,
            # and keeping them there also means `node /opt/codex-mcp/monitor.mjs`
            # from an exec'd shell sees the runs of every session.
            - name: CODEX_MCP_RUNS_DIR
              value: /home/pxldi/.luna-runs
            - name: GIT_AUTHOR_NAME
              value: "pxldi"
            # Out of this file because the repository is public. Git stamps it
            # on every commit an agent makes in here, so it has to be the real
            # mailbox rather than a noreply address.
            - name: GIT_AUTHOR_EMAIL
              valueFrom:
                secretKeyRef:
                  name: claudebox-secrets
                  key: GIT_AUTHOR_EMAIL
            # Read by `gh`, and therefore by git via the credential helper the
            # entrypoint installs, so sessions can clone and push private
            # repos. Empty is a supported state: public repos still work.
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claudebox-secrets
                  key: GITHUB_TOKEN
          resources:
            requests:
              # Deliberately small. This pod is idle whenever nobody is typing
              # at it, and the node's request budget is the scarce thing here:
              # 25184Mi of 28820Mi allocatable was already committed when this
              # was written.
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "4"
              # 6Gi, down from 8. The 8 was sized so that a Gradle daemon, a
              # Kotlin daemon and three sessions could coexist; with no JVM in
              # the picture the worst case is the capped number of idle servers
              # plus a handful of sessions, measured at roughly 2Gi. The
              # remaining headroom is for whatever a session builds or tests,
              # and a Go build that overruns it now kills this pod alone.
              memory: 6Gi
          # No probes. The server exposes no HTTP and its health is the process:
          # if it exits, the container exits and the pod restarts, which is also
          # how it recovers its sessions after a long network outage.
          volumeMounts:
            - name: data
              mountPath: /home/pxldi
            - name: toolbin
              mountPath: /toolbin
              readOnly: true
            - name: entrypoint
              mountPath: /entrypoint
              readOnly: true
            # Claude Code reads managed settings from this path on Linux. The
            # directory holds nothing else in this image, so mounting over it is
            # safe, and read-only is the point: sessions run without permission
            # prompts and must not be able to edit the rules that constrain them.
            - name: managed-settings
              mountPath: /etc/claude-code
              readOnly: true
            # The luna MCP server. Read-only for the same reason as the managed
            # settings: a session running without prompts should not be able to
            # rewrite the code that its own subagents run through.
            - name: codex-mcp
              mountPath: /opt/codex-mcp
              readOnly: true
            - name: tmp
              mountPath: /tmp
        # The vault mirror. livesync-bridge keeps ~/second_brain in step with
        # the second_brain LiveSync database in both directions, decrypting with
        # the vault passphrase, the same as the chatops vault pod does for the
        # bot. What differs is the uid. The image runs as deno (1993) and owns
        # /app and /deno-dir; here the sessions are uid 1000 and both sides
        # edit the same notes, so the bridge runs as 1000 too. Every directory
        # the bridge writes is therefore a PVC subPath owned by 1000:
        #   /app/data        its local database and state (the chatops pod
        #                    mounts its volume here for the same reason; with
        #                    only /app/data/vault mounted the first start died
        #                    with "PermissionDenied (os error 13)" on every
        #                    CouchDB connect attempt, 2026-09-19)
        #   /app/data/vault  the mirror, nested inside the one above
        #   /deno-dir        DENO_DIR. The image's cached jsr modules are hidden
        #                    behind the mount and are downloaded again on the
        #                    first start (the pod has internet egress), then
        #                    kept. npm modules come from /app/node_modules in
        #                    the image, readable by anyone.
        #   /deno-dir/location_data
        #                    Deno's localStorage, the bridge's record of which
        #                    files it has already scanned; delete
        #                    .livesync-bridge/location_data to force a full
        #                    rescan. Mounted on its own, although it lies inside
        #                    the mount above, because the image declares it as a
        #                    VOLUME and containerd honours image volumes the way
        #                    Docker does: a VOLUME path no mount covers gets a
        #                    fresh directory seeded from the image, owned by the
        #                    image's uid 1993, and uid 1000 then fails every
        #                    localStorage call with "PermissionDenied (os error
        #                    13)". That was the 2026-09-19 failure after the
        #                    /app/data mount was already right. The other two
        #                    VOLUMEs, /app/dat and /app/data, are covered.
        #
        # Only this container and render-bridge-config see the rendered config
        # with the passphrase. Do not mount bridge-rendered into claudebox.
        - name: bridge
          image: ghcr.io/pxldi/livesync-bridge:sha-00d9b6cbf891d01a5225a1ad8bea5006ba8458bd
          imagePullPolicy: IfNotPresent
          env:
            - name: LSB_CONFIG
              value: /app/dat/config.json
            # deno's home in the image belongs to uid 1993; point HOME at the
            # one directory this uid can write.
            - name: HOME
              value: /deno-dir
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: bridge-rendered
              mountPath: /app/dat
              readOnly: true
            - name: data
              mountPath: /app/data
              subPath: .livesync-bridge/data
            - name: data
              mountPath: /app/data/vault
              subPath: second_brain
            - name: data
              mountPath: /deno-dir
              subPath: .livesync-bridge/deno
            - name: data
              mountPath: /deno-dir/location_data
              subPath: .livesync-bridge/location_data
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: claudebox-data-pvc
        - name: toolbin
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: bridge-config
          configMap:
            name: claudebox-bridge-config
        - name: bridge-rendered
          emptyDir:
            medium: Memory
        - name: entrypoint
          configMap:
            name: claudebox-entrypoint
            defaultMode: 0555
        - name: managed-settings
          configMap:
            name: claudebox-managed-settings
            defaultMode: 0444
        - name: codex-mcp
          configMap:
            name: claudebox-codex-mcp
            defaultMode: 0444
