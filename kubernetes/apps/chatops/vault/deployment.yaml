---
# One pod, two jobs: livesync-bridge keeps /data/vault in step with the
# vault's CouchDB database in both directions, and vault-mcp serves that
# directory to the agent. They share the volume, so they share the pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-mcp
  namespace: chatops
  labels:
    app: vault-mcp
spec:
  replicas: 1
  # RWO volume with the bridge's scan state in it: one pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vault-mcp
  template:
    metadata:
      labels:
        app: vault-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        # deno's uid in the bridge image; the MCP server runs as it too so
        # both can write the mirrored files.
        runAsNonRoot: true
        runAsUser: 1993
        runAsGroup: 1993
        fsGroup: 1993
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The bridge reads a JSON config that has to contain the CouchDB
        # credentials and the vault's E2EE passphrase in clear. It is
        # rendered from the Secret into a memory-backed emptyDir, so the
        # passphrase is never on the volume. The same step creates the
        # mirror directory: the bridge stats its baseDir at start and exits
        # when it is missing, and a subPath mount only creates the subPath.
        - name: render-config
          image: alpine:3.24
          command:
            - sh
            - -c
            - >-
              sed -e "s|@COUCHDB_USER@|${COUCHDB_USER}|g"
              -e "s|@COUCHDB_PASSWORD@|${COUCHDB_PASSWORD}|g"
              -e "s|@VAULT_PASSPHRASE@|${VAULT_PASSPHRASE}|g"
              /config-src/config.json > /rendered/config.json &&
              ! grep -q '@' /rendered/config.json &&
              ! grep -q 'REPLACE_ME' /rendered/config.json &&
              mkdir -p /data/vault-root/vault /data/bridge-state
          env:
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: chatops-vault
                  key: COUCHDB_USER
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chatops-vault
                  key: COUCHDB_PASSWORD
            - name: VAULT_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: chatops-vault
                  key: VAULT_PASSPHRASE
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: config
              mountPath: /config-src
              readOnly: true
            - name: rendered
              mountPath: /rendered
            - name: data
              mountPath: /data
      containers:
        - name: bridge
          image: ghcr.io/pxldi/livesync-bridge:sha-00d9b6cbf891d01a5225a1ad8bea5006ba8458bd
          imagePullPolicy: IfNotPresent
          env:
            - name: LSB_CONFIG
              value: /app/dat/config.json
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: rendered
              mountPath: /app/dat
              readOnly: true
            - name: data
              mountPath: /app/data
              subPath: vault-root
            # Deno localStorage: which files the offline scan already knows.
            - name: data
              mountPath: /deno-dir/location_data
              subPath: bridge-state
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
        - name: vault-mcp
          image: ghcr.io/pxldi/homelab-mcp:sha-b62efca7f31f1c5238d9b5bc1ebc1ba734de7cba
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "vault_mcp"]
          ports:
            - name: http
              containerPort: 8000
          env:
            # The whole mirrored vault is readable. Writes stay under Clanky/:
            # the bot reads Telegram and imported pages, and the rest of the
            # vault (ops/CLAUDE.md, the skills, the project specs) is what
            # Claude Code sessions load as instructions. Unset, the server
            # refuses every write.
            - name: VAULT_ROOT
              value: /data/vault
            - name: VAULT_WRITE_ROOT
              value: Clanky
            - name: TZ
              value: Europe/Berlin
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: vault-root
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
        # The same server a second time, for claude.ai. Its own port, its own
        # write root and a bearer-token check that the Clanky container does
        # not have: a custom connector calls from Anthropic's network, through
        # the IngressRoute beside this file, so the NetworkPolicy that stands
        # in for auth on port 8000 does not cover it. The token is Authentik's,
        # verified against the provider's JWKS over the in-cluster Service
        # (oauth.py in the image). Writes may land in ops/, the specs, tasks
        # and ideas a chat is meant to produce, and nowhere else.
        - name: vault-mcp-claude
          image: ghcr.io/pxldi/homelab-mcp:sha-b62efca7f31f1c5238d9b5bc1ebc1ba734de7cba
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "vault_mcp"]
          ports:
            - name: claude
              containerPort: 8001
          env:
            - name: PORT
              value: "8001"
            - name: VAULT_ROOT
              value: /data/vault
            - name: VAULT_WRITE_ROOT
              value: ops
            # The provider and its client id are authentik_provider_oauth2.vault_mcp
            # in terraform/authentik/oidc-apps.tf; the id is public.
            - name: OAUTH_ISSUER
              value: https://auth.pxldi.de/application/o/vault-mcp/
            - name: OAUTH_AUDIENCE
              value: E2NX2npEUxw6ZTCRfGpCpA5iZmtsfabEXWcfngTz
            - name: OAUTH_RESOURCE_URL
              value: https://vault-mcp.pxldi.de/mcp
            - name: OAUTH_JWKS_URL
              value: http://authentik-server.authentik.svc.cluster.local/application/o/vault-mcp/jwks/
            - name: TZ
              value: Europe/Berlin
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: vault-root
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: claude
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: claude
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vault-data
        - name: config
          configMap:
            name: vault-bridge-config
        - name: rendered
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir: {}
