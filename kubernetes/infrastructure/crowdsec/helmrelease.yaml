---
# CrowdSec reads Traefik's access log, recognises brute force and scanning, and
# decides which client addresses to block. Traefik enforces those decisions
# through the crowdsec-bouncer plugin (infrastructure-config/traefik/
# middleware-crowdsec.yaml).
#
# It ran in simulation from 2026-09-25 to 2026-09-30: 3,287 alerts from 180
# addresses, all scanners on cloud hosting, none from the LAN, the tailnet, a
# German carrier or Anthropic. Since then it enforces.
#
# Log source: the `kubernetes` datasource (CrowdSec 1.8) streams Traefik's
# stdout through pods/log. That needs no hostPath and no sidecar in the traefik
# namespace, which enforces restricted and would not admit this root image.
#
# The Central API is off. Enabling it brings the community blocklist, but it
# also shares signals from this house's address, and a listed carrier address
# could block a family phone. The alert database stores request paths with
# query strings, some of which carry API keys (apikey=, Subsonic t=/s=), so
# console context sharing must stay off too.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: crowdsec
spec:
  interval: 30m
  chart:
    spec:
      chart: crowdsec
      version: 0.24.3
      sourceRef:
        kind: HelmRepository
        name: crowdsec
        namespace: flux-system
      interval: 12h

  # Chart 0.24.2's values.schema.json lists every datasource except the new
  # `kubernetes` one, so it rejects the acquisition below although the template
  # renders it verbatim into acquis.yaml. Drop these two lines once the schema
  # accepts `source: kubernetes`.
  install:
    disableSchemaValidation: true
    remediation:
      retries: 3

  upgrade:
    disableSchemaValidation: true
    cleanupOnFail: true
    remediation:
      retries: 3

  # The chart registers the agent under its pod name. A pod that survives a
  # node reboot keeps that name, the LAPI answers 403 "user already exist", and
  # the init container crash-loops until someone deletes the pod (2026-11-10 to
  # 2026-11-12). A timestamp suffix makes every registration a new machine;
  # agents_autodelete below removes the old ones.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: crowdsec-agent
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: crowdsec-agent
              spec:
                template:
                  spec:
                    initContainers:
                      - name: wait-for-lapi-and-register
                        command:
                          - sh
                          - -c
                          - >-
                            until nc "$LAPI_HOST" "$LAPI_PORT" -z; do echo waiting for lapi to start; sleep 5; done;
                            ln -s /staging/etc/crowdsec /etc/crowdsec &&
                            cscli lapi register --machine "$USERNAME-$(date +%s)" -u "$LAPI_URL" --token "$REGISTRATION_TOKEN" &&
                            cp /etc/crowdsec/local_api_credentials.yaml /tmp_config/local_api_credentials.yaml

  values:
    # The chart's default mounts /var/lib/docker/containers from the host even
    # when the agent is a Deployment. containerd mounts nothing.
    container_runtime: containerd

    secrets:
      externalSecret:
        name: crowdsec-secrets

    config:
      simulation.yaml: |
        simulation: false
      # Every agent start registers a new machine (see postRenderers). A
      # running agent keeps its heartbeat fresh, so only dead ones age out, and
      # only once max_age has flushed their alerts: the LAPI keeps any machine
      # that still owns an alert.
      config.yaml.local: |
        db_config:
          flush:
            max_items: 5000
            max_age: 7d
            agents_autodelete:
              login_password: 72h
      parsers:
        s02-enrich:
          # The image's own whitelist covers the private ranges: the LAN, pods,
          # hairpinned requests that arrive with the router's LAN address, and
          # the svclb fallback. The tailnet is the one range it does not know.
          tailnet-whitelist.yaml: |
            name: rechenzentrum/tailnet-whitelist
            description: "Clients on the tailnet are the household's own devices"
            whitelist:
              reason: "tailnet"
              cidr:
                - 100.64.0.0/10
          # claude.ai's connectors call the vault MCP route from here and
          # retry on 401 during token refresh, which could look like brute
          # force (kubernetes/apps/chatops/vault/ingress.yaml).
          anthropic-whitelist.yaml: |
            name: rechenzentrum/anthropic-whitelist
            description: "Anthropic's published egress range for claude.ai connectors"
            whitelist:
              reason: "anthropic connectors"
              cidr:
                - 160.79.104.0/21

    lapi:
      env:
        # Must be the string "true": the chart compares it with eq.
        - name: DISABLE_ONLINE_API
          value: "true"
        - name: BOUNCER_KEY_traefik
          valueFrom:
            secretKeyRef:
              name: crowdsec-secrets
              key: bouncerKey
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      # cscli runs inside this container. On 2026-09-30 `cscli alerts list -l 0
      # -o json` over ~3,300 alerts pushed it past 256Mi and the OOM kill took
      # the LAPI down for a minute and a half.
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          memory: 384Mi
      persistentVolume:
        data:
          enabled: true
          storageClassName: local-ssd
          size: 1Gi
        config:
          enabled: true
          storageClassName: local-ssd
          size: 100Mi

    agent:
      isDeployment: true
      hostVarLog: false
      serviceAccountName: crowdsec-agent
      acquisition: []
      additionalAcquisition:
        - source: kubernetes
          namespace: traefik
          selector: "app.kubernetes.io/name=traefik,app.kubernetes.io/instance=traefik-traefik"
          labels:
            type: traefik
      env:
        # crowdsecurity/traefik pulls in base-http-scenarios and http-cve.
        - name: COLLECTIONS
          value: "crowdsecurity/traefik"
        # Nextcloud's DAV clients and Jellyfin's players produce 4xx in normal
        # use; these whitelists keep that from counting as probing.
        - name: PARSERS
          value: "crowdsecurity/nextcloud-whitelist crowdsecurity/jellyfin-whitelist"
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 320Mi
