---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dashboard
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`traefik.pxldi.de`)
      middlewares:
        - name: authentik-forward-auth
          namespace: traefik
      services:
        - name: api@internal
          kind: TraefikService
