---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tandoor-mcp
  namespace: chatops
  labels:
    app: tandoor-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tandoor-mcp
  template:
    metadata:
      labels:
        app: tandoor-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tandoor-mcp
          image: ghcr.io/pxldi/homelab-mcp:sha-128d0e819fb0d830b7a36bfe596c572bfa296a1d
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "tandoor_mcp"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: TANDOOR_URL
              value: http://tandoor.tandoor.svc.cluster.local
            - name: TANDOOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chatops-credentials
                  key: TANDOOR_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # The kubernetes client writes certificate material to a temp file
          # when it loads a config, and a read-only root has nowhere for it.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
        # The same server a second time, for claude.ai, as in the vault pod:
        # its own port and a bearer-token check that the bot's container does
        # not have. Tokens are Authentik's, for the tandoor-mcp client in
        # terraform/authentik/oidc-apps.tf (the id is public), verified against
        # the provider's JWKS over the in-cluster Service.
        - name: tandoor-mcp-claude
          image: ghcr.io/pxldi/homelab-mcp:sha-128d0e819fb0d830b7a36bfe596c572bfa296a1d
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "tandoor_mcp"]
          ports:
            - name: claude
              containerPort: 8001
          env:
            - name: PORT
              value: "8001"
            - name: TANDOOR_URL
              value: http://tandoor.tandoor.svc.cluster.local
            - name: TANDOOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chatops-credentials
                  key: TANDOOR_TOKEN
            - name: OAUTH_ISSUER
              value: https://auth.pxldi.de/application/o/tandoor-mcp/
            - name: OAUTH_AUDIENCE
              value: QGbHNMokfArGxiq2I2AoeZbkqBpVvyr8d58D9Mhm
            - name: OAUTH_RESOURCE_URL
              value: https://tandoor-mcp.pxldi.de/mcp
            - name: OAUTH_JWKS_URL
              value: http://authentik-server.authentik.svc.cluster.local/application/o/tandoor-mcp/jwks/
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: claude
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: claude
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tandoor-mcp
  namespace: chatops
spec:
  selector:
    app: tandoor-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
    # The claude.ai copy; only the IngressRoute forwards to it.
    - name: claude
      port: 8001
      targetPort: claude
