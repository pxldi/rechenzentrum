---
# Builds the image behind the two MCP servers in kubernetes/apps/chatops.
#
# Pull requests build and smoke-test but do not push; a push to main or a
# manual run publishes, tagged with the commit it built. So the tag a Deployment
# pins only exists after the PR that adds the Dockerfile has merged, which is
# why the manifests land in a second PR (see docs/CHATOPS.md).
name: Homelab MCP Image

on:
  # So a build can be started by hand once ENABLE_IMAGE_PUBLISH is set,
  # without a commit to trigger it.
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "images/homelab-mcp/**"
      - ".github/workflows/homelab-mcp-image.yml"
  push:
    branches: ["main"]
    paths:
      - "images/homelab-mcp/**"
      - ".github/workflows/homelab-mcp-image.yml"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/homelab-mcp
  # On a pull_request `github.sha` is the ephemeral merge commit; the branch
  # head is the commit that actually holds the Dockerfile.
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    if: vars.ENABLE_IMAGE_PUBLISH == 'true'
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: images/homelab-mcp/Dockerfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: images/homelab-mcp
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ env.SHA }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ env.SHA }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:main', env.IMAGE) || '' }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}
          provenance: false

      # Both servers must come up and answer /health as uid 1000 on a
      # read-only root filesystem, which is how the Deployments run them.
      - name: Smoke-test both servers
        run: |
          set -euo pipefail
          for mod in homelab_mcp tandoor_mcp; do
            docker run -d --rm --name "$mod" --read-only --user 1000:1000 \
              -e TANDOOR_TOKEN=smoke -p 8000:8000 \
              "${IMAGE}:sha-${SHA}" python -m "$mod"
            for _ in $(seq 1 20); do
              if curl -sf http://127.0.0.1:8000/health; then echo; break; fi
              sleep 1
            done
            curl -sf http://127.0.0.1:8000/health | grep -q "\"server\":\"${mod%_mcp}\""
            docker stop "$mod" >/dev/null
          done

      # The vault server is the one claude.ai reaches. With OAUTH_ISSUER set it
      # must publish the resource metadata, refuse /mcp without a token and
      # say in the 401 where the metadata is; without it, /mcp must still
      # answer ZeroClaw's untokened initialize.
      - name: Smoke-test the vault server's token check
        run: |
          set -euo pipefail
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}'
          post() {
            curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
              -d "$init" http://127.0.0.1:8000/mcp
          }
          wait_healthy() {
            for _ in $(seq 1 20); do
              if curl -sf http://127.0.0.1:8000/health; then echo; return; fi
              sleep 1
            done
            return 1
          }
          docker run -d --rm --name vault_open --read-only --user 1000:1000 \
            -p 8000:8000 "${IMAGE}:sha-${SHA}" python -m vault_mcp
          wait_healthy
          test "$(post)" = 200
          docker stop vault_open >/dev/null
          docker run -d --rm --name vault_locked --read-only --user 1000:1000 \
            -e OAUTH_ISSUER=https://auth.example.test/application/o/vault-mcp/ \
            -e OAUTH_AUDIENCE=smoke \
            -e OAUTH_RESOURCE_URL=http://127.0.0.1:8000/mcp \
            -p 8000:8000 "${IMAGE}:sha-${SHA}" python -m vault_mcp
          wait_healthy
          curl -sf http://127.0.0.1:8000/.well-known/oauth-protected-resource/mcp \
            | grep -q 'auth.example.test/application/o/vault-mcp/'
          test "$(post)" = 401
          curl -si -X POST -H 'Content-Type: application/json' -d "$init" http://127.0.0.1:8000/mcp \
            | grep -qi '^www-authenticate: Bearer .*resource_metadata='
          docker stop vault_locked >/dev/null
