---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    app: minecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  # RWO node-local PV + a single stateful game process: never run two at once.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minecraft
      annotations:
        # The live world is copied mid-write and the pack re-installs itself, so
        # Velero takes only the restic repository the backup sidecar writes.
        backup.velero.io/backup-volumes-excludes: "data"
    spec:
      priorityClassName: rechenzentrum-bulk
      # local-ssd PV is node-local, so pin to the node that holds it.
      nodeSelector:
        kubernetes.io/hostname: rechenzentrum
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # itzg traps SIGTERM to save the world and stop cleanly; give it room.
      terminationGracePeriodSeconds: 120
      containers:
        - name: minecraft
          image: itzg/minecraft-server:2026.10.1-java25
          imagePullPolicy: IfNotPresent
          # Keep a console attachable via `kubectl attach -it`.
          stdin: true
          tty: true
          ports:
            - containerPort: 25565
              name: game
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/Berlin"
            - name: UID
              value: "1000"
            - name: GID
              value: "1000"
            - name: EULA
              value: "TRUE"
            # --- Modpack: GT New Horizons, pinned so no update rewrites mods/ ---
            # itzg's GTNH updater deletes and replaces mods/ and config/ when the
            # pinned version changes. MODS re-adds Extra Nerf after the install.
            - name: TYPE
              value: "GTNH"
            - name: GTNH_PACK_VERSION
              value: "2.9.0"
            # Extra Nerf 1.0.1 targets exactly GTNH 2.9.0. Players need the same
            # jar in their client mods folder.
            - name: MODS
              value: "https://extranerf.kuba6000.pl/downloads/gtnhextranerf-1.0.1.jar"
            # --- Memory / GC ---
            # GTNH wants 6G plus headroom for the late game. The 10Gi limit leaves
            # ~2Gi for off-heap; if exceeded only this pod OOMs.
            - name: INIT_MEMORY
              value: "8G"
            - name: MAX_MEMORY
              value: "8G"
            - name: USE_AIKAR_FLAGS
              value: "true"
            # GTNH clients take long to receive the mod registry on login.
            - name: JVM_OPTS
              value: "-Dfml.readTimeout=180"
            # --- Gameplay / server.properties (OVERRIDE lets env win on restart) ---
            - name: OVERRIDE_SERVER_PROPERTIES
              value: "true"
            - name: MOTD
              value: "pxldi — GTNH Extra Nerf"
            # GTNH 2.9's server zip still defaults to the old RWG generator. The
            # pack's own default is RWG2_CONTINENTS; plain RWG2 is not in its
            # generator whitelist. A new level name, because a world keeps the
            # generator it was created with.
            # Hand-placed on the volume, not from this manifest: mods/ holds an
            # unreleased RWG2 build from the taint-reduction-config branch
            # (sha256 1cac3392...), the pack's rwg2-2.0.6.jar sits in
            # mods-disabled/. Clients need the same jar. A pack version bump
            # replaces mods/ and undoes this.
            - name: LEVEL_TYPE
              value: "RWG2_CONTINENTS"
            - name: LEVEL
              value: "World-taint-reduced"
            - name: DIFFICULTY
              value: "normal"
            - name: MAX_PLAYERS
              value: "2"
            - name: VIEW_DISTANCE
              value: "10"
            # Several pack mods teleport/elytra players; avoids false flight kicks.
            - name: ALLOW_FLIGHT
              value: "TRUE"
            - name: SPAWN_PROTECTION
              value: "0"
            # RCON is for the backup sidecar on localhost. The NetworkPolicy only
            # admits 25565 from outside the namespace.
            - name: ENABLE_RCON
              value: "true"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-secrets
                  key: RCON_PASSWORD
            - name: OPS
              value: "pxldi"
            # Solo server: only whitelisted accounts may join, even if a router
            # forward still points at 25565.
            - name: ENABLE_WHITELIST
              value: "TRUE"
            - name: ENFORCE_WHITELIST
              value: "TRUE"
            - name: WHITELIST
              value: "pxldi"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              memory: 10Gi
          # First boot downloads the pack, runs the Forge installer and generates
          # the world — minutes of work — so startup gets a long grace window
          # before liveness can kill it.
          startupProbe:
            tcpSocket:
              port: game
            periodSeconds: 15
            # 30 minutes: the first boot downloads the whole pack.
            failureThreshold: 120
          livenessProbe:
            tcpSocket:
              port: game
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: game
            periodSeconds: 15
        # Saves the world over RCON (save-off, save-all), then snapshots it into
        # a deduplicating restic repository. Velero copies that repository off
        # site every night.
        - name: backup
          image: itzg/mc-backup:2026.11.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: TZ
              value: "Europe/Berlin"
            - name: BACKUP_METHOD
              value: "restic"
            - name: BACKUP_NAME
              value: "gtnh"
            # A fixed host keeps retention working across pod restarts.
            - name: RESTIC_HOST
              value: "gtnh"
            - name: RESTIC_REPOSITORY
              value: "/backups/restic"
            # UID 1000 has no writable home in this image.
            - name: RESTIC_CACHE_DIR
              value: "/backups/.cache"
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-secrets
                  key: RESTIC_PASSWORD
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-secrets
                  key: RCON_PASSWORD
            # First boot installs the pack; wait for it before the first save.
            - name: INITIAL_DELAY
              value: "30m"
            - name: BACKUP_INTERVAL
              value: "2h"
            - name: PRUNE_RESTIC_RETENTION
              value: "--keep-hourly 24 --keep-daily 14 --keep-weekly 8"
            # Pack files come back from the GTNH installer; back up world and config.
            - name: EXCLUDES
              value: "*.jar,cache,logs,*.tmp,crash-reports,libraries,mods,resources,backups,gtnh-upgrade-*"
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: backups
              mountPath: /backups
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gtnh-data
        - name: backups
          persistentVolumeClaim:
            claimName: gtnh-backups
