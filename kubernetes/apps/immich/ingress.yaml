---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich
  namespace: immich
spec:
  entryPoints:
    - websecure
    # Public through the Cloudflare Tunnel; family members use it off the tailnet.
    - tunnel
  routes:
    - kind: Rule
      match: Host(`photos.pxldi.de`)
      services:
        - name: immich-server
          port: 2283
