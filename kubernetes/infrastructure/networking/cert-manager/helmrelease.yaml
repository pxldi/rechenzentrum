apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: v1.21.2
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 12h

  install:
    createNamespace: true
    remediation:
      retries: 3
    crds: CreateReplace

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace

  values:
    # Certs are named in rechenzentrum-critical's description. Evicting the
    # issuer does not break TLS today, but it breaks every renewal after —
    # a failure that surfaces weeks later as an expired certificate.
    # global.priorityClassName covers the controller, webhook and cainjector.
    global:
      priorityClassName: rechenzentrum-critical

    prometheus:
      enabled: false

    installCRDs: true

    resources:
      requests:
        cpu: 10m
        memory: 32Mi

    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi

    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
