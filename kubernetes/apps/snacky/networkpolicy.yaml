# Two ways in, and they must not share a port. 8000 is MCP with no login of its
# own, so only the chat assistant's pod may reach it. 8080 is the web UI, and
# Traefik reaches it through the allow-from-traefik component (see the
# kustomization). Traefik has no route to 8000.
#
# The podSelector uses the pod's own `app` label: the app.kubernetes.io labels
# stop at the Deployment.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mcp-from-zeroclaw
  namespace: snacky
spec:
  podSelector:
    matchLabels:
      app: snacky
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: chatops
          podSelector:
            matchLabels:
              app: zeroclaw
      ports:
        - protocol: TCP
          port: 8000
---
# Tandoor and openGym, by their pods' container ports: a policy sees the packet
# after the Service has rewritten it. Tandoor's pod carries only the
# app.kubernetes.io labels (chart-rendered); openGym's carries `app`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: snacky-egress
  namespace: snacky
spec:
  podSelector:
    matchLabels:
      app: snacky
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tandoor
          podSelector:
            matchLabels:
              app.kubernetes.io/name: tandoor
      ports:
        - protocol: TCP
          port: 80
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opengym
          podSelector:
            matchLabels:
              app: opengym
      ports:
        - protocol: TCP
          port: 80
