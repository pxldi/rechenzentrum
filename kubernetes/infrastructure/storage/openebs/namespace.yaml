apiVersion: v1
kind: Namespace
metadata:
  name: openebs
  labels:
    # privileged, not baseline, and it has to be.
    #
    # OpenEBS provisions a hostpath volume by launching a short-lived helper pod
    # (`init-pvc-<uid>`, image openebs/linux-utils) that mounts the host
    # directory and runs privileged to create and chown it. That is how
    # local-path storage works; there is no unprivileged variant of it.
    #
    # #919 set baseline here along with every other namespace, which silently
    # broke *all* volume provisioning cluster-wide:
    #
    #   pods "init-pvc-..." is forbidden: violates PodSecurity "baseline:v1.33":
    #   hostPath volumes (volume "data"), privileged (container
    #   "local-path-init" must not set securityContext.privileged=true)
    #
    # Nothing noticed, because every existing PVC had already been provisioned
    # and bound. The first new one after that merge is what surfaced it, and a
    # PVC that cannot bind leaves its pod Pending forever with the real reason
    # three levels down in the provisioner's logs.
    #
    # The blast radius is narrow: the helper pod is the only privileged thing
    # here, it lives for seconds, and the provisioner Deployment itself is
    # unprivileged. audit and warn stay restricted so anything *else* that
    # tries to exploit the relaxed enforcement still shows up in the log.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.33
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
