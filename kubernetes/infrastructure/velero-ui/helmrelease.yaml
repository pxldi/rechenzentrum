---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero-ui
  namespace: velero
spec:
  interval: 30m
  chart:
    spec:
      chart: velero-ui
      version: "1.2.0"
      sourceRef:
        kind: HelmRepository
        name: otwld-charts
        namespace: velero
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    configuration:
      general:
        veleroNamespace: "velero"
        # Chart 1.x needs a JWT signing passphrase; it lives in secret-jwt.yaml.
        secretPassPhrase:
          existingSecret: velero-ui-jwt
          key: pass_phrase

    # The chart's RBAC is off. Its Role in `velero` granted every verb on
    # velero.io and read on the namespace's Secrets (the B2 credentials), and
    # velero-server carries out whatever a Backup, Restore or
    # DeleteBackupRequest says with cluster-admin. With the app's own login off,
    # one forward-auth session was enough to restore any namespace anywhere.
    # rbac.yaml grants read-only access instead; backups and restores are made
    # with the velero CLI.
    rbac:
      create: false

    ingress:
      enabled: false

    # The app's own login ran on the chart's default credentials, which 0.12
    # refuses to start with. The route already requires the LAN or tailnet
    # and an Authentik login (ingress.yaml), so the second login goes. That is
    # acceptable only because the UI can no longer write anything.
    env:
      - name: BASIC_AUTH_ENABLED
        value: "false"

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
