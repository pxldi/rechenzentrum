---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - gatus
components:
  # Egress. Gatus checks public apps on their public names (internet and
  # Traefik, since in-cluster DNS may answer with either address) and house-only
  # apps on their Services in other namespaces, which is why it takes the
  # cluster-wide rule rather than a selector per target.
  - ../../../components/default-deny-egress
  - ../../../components/allow-dns
  - ../../../components/allow-internet-egress
  - ../../../components/allow-egress-to-cluster
  - ../../../components/allow-egress-to-ingress
  - ../../infrastructure-config/networkpolicies/default-deny-ingress
  - ../../infrastructure-config/networkpolicies/allow-intra-namespace
  - ../../infrastructure-config/networkpolicies/allow-from-traefik
  # Prometheus scrapes Gatus's results; the alerts are built on them.
  - ../../infrastructure-config/networkpolicies/allow-from-observability
