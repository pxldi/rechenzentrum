# The web port only. The MCP port has no route: the assistant reaches it over
# the cluster network. Behind the house allowlist and authentik, like the other
# browser-only apps. Priority 10 matches the rest of the repo's IngressRoutes.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: snacky
  namespace: snacky
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`snacky.pxldi.de`)
      priority: 10
      middlewares:
        - name: internal-only
          namespace: traefik
        - name: authentik-forward-auth
          namespace: traefik
      services:
        - name: snacky
          port: 8080
