---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: navidrome
  namespace: media
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`music.pxldi.de`)
      kind: Rule
      middlewares:
        - name: internal-or-cluster
          namespace: traefik
      services:
        - name: navidrome
          port: 4533
