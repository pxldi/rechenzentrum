# House only. Git clients and the Actions runner send basic auth or tokens and
# cannot follow a forward-auth redirect, so Forgejo keeps its own login behind
# the internal-only allowlist and there is no authentik-forward-auth here.
# Priority 10 matches the rest of the repo's IngressRoutes.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: forgejo
  namespace: forgejo
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`git.pxldi.de`)
      priority: 10
      middlewares:
        - name: internal-only
          namespace: traefik
      services:
        - name: forgejo
          port: 3000
