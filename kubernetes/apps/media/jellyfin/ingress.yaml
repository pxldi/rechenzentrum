---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: media
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`jellyfin.pxldi.de`)
      kind: Rule
      middlewares:
        - name: internal-or-cluster
          namespace: traefik
      services:
        - name: jellyfin
          port: 8096
