---
# Stop handing out API credentials nobody uses.
#
# 77 of 103 running pods mount a ServiceAccount token. The legitimate consumers
# are the operators -- flux, cert-manager, cnpg, velero, prometheus, traefik,
# the device plugin, ARC, homepage's widget SA -- and they keep theirs. The
# rest are media and web apps holding a valid credential for the Kubernetes API
# for no reason at all.
#
# Every namespace below was selected by evidence, not by eyeball: its `default`
# ServiceAccount is the subject of *zero* RoleBindings and *zero*
# ClusterRoleBindings anywhere in the cluster. The token it hands out therefore
# authorises nothing beyond API discovery. Removing it cannot break a
# permission that was being used, because there is no permission to use.
#
# Set on the ServiceAccount rather than on each pod spec, deliberately:
#
#   - it works the same whether the workload is a raw Deployment in this repo
#     or a container buried in someone else's Helm chart, so it needs no
#     per-chart values archaeology
#   - a pod that *does* declare automountServiceAccountToken still wins, so
#     nothing is overridden silently
#   - it applies to pods created from now on. Nothing restarts because of this
#     file; coverage moves as pods churn.
#
# Namespaces deliberately absent: kube-*, flux-system, cnpg-system, arc-*,
# device-plugins -- operators, or k3s's own, and both need their tokens.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: adventurelog
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: authentik
automountServiceAccountToken: false
