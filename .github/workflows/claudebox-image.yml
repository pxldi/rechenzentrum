---
# Builds the agent toolchain image claudebox runs. It was the Multica daemon's
# image until Multica was deleted on 2026-09-15. It was published as
# multica-daemon, a package this repository cannot write to since the move
# out of pxldi-labs, so it is published as claudebox from 2026-09-28.
#
# Pull requests build, scan and test the image but do not push; a push to main
# publishes it, tagged with the commit it built. So the tag a Deployment pins
# only exists after the PR that changes the Dockerfile has merged, which is why
# the manifest bump lands in a second PR.
#
# Tags are immutable and named for the commit that produced them. `main` moves
# and is only ever a convenience for a human running `crane`/`skopeo` by hand —
# manifests pin the `sha-` tag, per AGENTS.md.
name: Claudebox Image

on:
  pull_request:
    branches: ["main"]
    paths:
      - "images/claudebox/**"
      - ".github/workflows/claudebox-image.yml"
  push:
    branches: ["main"]
    paths:
      - "images/claudebox/**"
      - ".github/workflows/claudebox-image.yml"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/claudebox
  # On a pull_request, `github.sha` is the ephemeral merge commit — a sha that
  # stops existing the moment the PR merges or the base moves. Tagging with it
  # produces an image nobody can trace back to a commit, which is worse than an
  # untagged one because it looks fine. The branch head is the commit that
  # actually produced the Dockerfile.
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # Both jobs run the same steps. A pull request gets `check` and a token that
  # can only read, so code from a branch never holds packages: write or an OIDC
  # token. The login, push and sign steps also test the event themselves.
  check:
    if: github.event_name == 'pull_request' && vars.ENABLE_IMAGE_PUBLISH == 'true'
    name: Build and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps: &build-steps
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: images/claudebox/Dockerfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: images/claudebox
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          # `main` only moves from main. A pull request that repointed it would
          # be a branch quietly redefining what "main" means in the registry.
          tags: |
            ${{ env.IMAGE }}:sha-${{ env.SHA }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:main', env.IMAGE) || '' }}
          # The registry cache keeps the Playwright layer — two thirds of the
          # image and all of the download time — out of every rebuild that only
          # moves a pin.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}
          provenance: false
          # Links a package the first push creates to this repository, so its
          # Actions access comes from here.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Scans the image just built: loaded locally on a pull request, pulled
      # from GHCR after a push. The first step lists HIGH and CRITICAL in the
      # job log; the second fails the build on a CRITICAL with a fix available.
      # An unfixed one does not fail, because no change here could clear it.
      - name: List high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ env.SHA }}
          severity: HIGH,CRITICAL
          format: table
      # Fails on a fixable CRITICAL, like the other images. It only reported
      # them for a while (2026-10-02) because claudebox bundles upstream
      # release binaries (age, kustomize, the Android SDK's Bouncy Castle)
      # whose fixes arrive when upstream rebuilds them. When that happens
      # again, bump the release or replace the component in the Dockerfile.
      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ env.SHA }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-setup-trivy: true

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab  # v4.1.4

      # Keyless: the signature binds the pushed digest to this workflow in this
      # repository through GitHub's OIDC identity, so there is no key to keep.
      # Check one with
      #   cosign verify "$IMAGE@<digest>" \
      #     --certificate-identity-regexp '^https://github.com/pxldi/rechenzentrum/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the pushed digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Every tool, its version, and where it came from — asserted in the image
      # that was just built rather than in a README somebody edited once. A tool
      # that is installed but unreachable from a PATH nobody customised fails
      # here, which is the failure that cost two review runs.
      - name: Verify the toolchain
        run: |
          docker run --rm --user 1000:1000 \
            -v "${PWD}/images/claudebox/verify.sh:/verify.sh:ro" \
            "${IMAGE}:sha-${SHA}" \
            env -i \
              PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              HOME=/tmp \
              PLAYWRIGHT_BROWSERS_PATH=/usr/local/share/playwright \
              /bin/sh /verify.sh | tee /tmp/verification.txt
          if grep -q MISSING /tmp/verification.txt; then
            echo "::error::a tool is missing from the image"
            exit 1
          fi

      - name: Smoke-test the things a version string does not prove
        run: |
          docker run --rm --user 1000:1000 -e HOME=/tmp -w /tmp \
            "${IMAGE}:sha-${SHA}" \
            bash -euo pipefail -c '
              export PGDATA=/tmp/pgdata
              initdb -D "$PGDATA" -A trust -U postgres >/dev/null
              pg_ctl -D "$PGDATA" -o "-k /tmp -p 55432 -c listen_addresses=" \
                -l /tmp/pg.log start >/dev/null
              psql -h /tmp -p 55432 -U postgres -tAc "select 1" >/dev/null
              pg_ctl -D "$PGDATA" stop >/dev/null
              echo "postgres: a cluster comes up as uid 1000"

              printf "<h1>baked</h1>" > /tmp/p.html
              playwright screenshot --browser chromium file:///tmp/p.html /tmp/s.png >/dev/null
              test -s /tmp/s.png
              echo "chromium: renders as uid 1000"

              mkdir -p /tmp/g && cd /tmp/g
              printf "package main\nimport \"C\"\nfunc main() { println(\"ok\") }\n" > main.go
              go mod init smoke >/dev/null 2>&1
              CGO_ENABLED=1 go build -o smoke . && ./smoke
              echo "go: cgo builds"
            '

      # Both numbers, because they answer different questions and disagree by
      # more than anyone expects. `docker image inspect` sums the uncompressed
      # layers — what the image costs on the node's disk. The manifest sums the
      # compressed blobs — what a pull costs over the wire, and what the
      # registry stores. Reporting only the first once produced a figure 2.7x
      # the one a local build showed, with nothing to explain the gap.
      - name: Report the size
        run: |
          base=$(grep -oP '^FROM \K\S+' images/claudebox/Dockerfile)
          docker pull -q "$base" >/dev/null

          uncompressed() { docker image inspect "$1" --format '{{ .Size }}'; }
          compressed() {
            docker manifest inspect "$1" \
              | jq '[.layers[].size] | add'
          }

          {
            echo "| | on disk (uncompressed) | over the wire (compressed) |"
            echo "| --- | --- | --- |"
            printf '| base | %.2f GB | — |\n' \
              "$(echo "$(uncompressed "$base") / 1000000000" | bc -l)"
            printf '| claudebox | %.2f GB | %.2f GB |\n' \
              "$(echo "$(uncompressed "${IMAGE}:sha-${SHA}") / 1000000000" | bc -l)" \
              "$(echo "$(compressed "${IMAGE}:sha-${SHA}") / 1000000000" | bc -l)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          echo
          echo "layers, largest first:"
          docker history --format '{{.Size}}\t{{.CreatedBy}}' \
            "${IMAGE}:sha-${SHA}" | head -20

  publish:
    if: github.event_name != 'pull_request' && vars.ENABLE_IMAGE_PUBLISH == 'true'
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign trades this token for a short-lived certificate.
      id-token: write
    steps: *build-steps
