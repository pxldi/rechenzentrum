---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: restore-test
---
# Create a Cluster, watch it, delete it. Delete is held to the one name, so this
# account cannot remove the production Cluster next to it. Create cannot be
# held to a name by RBAC; the cnpg-restore-test admission policy does that, and
# also refuses any Cluster from this account that could archive WAL.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: restore-test
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    resourceNames: ["restore-test"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: restore-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: restore-test
subjects:
  - kind: ServiceAccount
    name: restore-test
