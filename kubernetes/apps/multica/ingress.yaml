---
# Single-host routing for Multica: the browser, the CLI, and remote runtime
# daemons all use https://code.pxldi.de. Backend paths mirror the frontend's
# own runtime proxy list (apps/web/config/runtime-urls.ts): /api, /ws,
# /uploads and /auth go to the Go backend — except /auth/callback and
# /auth/hg-sso/callback, which are frontend pages. Routing these at Traefik
# (higher priority wins) keeps WebSockets off the Next.js proxy.
#
# Deliberately NO authentik-forward-auth middleware: Multica ships its own
# auth (JWT sessions, signup controls), and runtime daemons + webhooks must
# reach /api and /ws directly — a forward-auth redirect would break them.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: multica
  namespace: multica
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: "Host(`code.pxldi.de`)"
      priority: 10
      services:
        - name: multica-frontend
          port: 3000
    - kind: Rule
      match: "Host(`code.pxldi.de`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/uploads`) || PathPrefix(`/auth`))"
      priority: 20
      services:
        - name: multica-backend
          port: 8080
    - kind: Rule
      match: "Host(`code.pxldi.de`) && (PathPrefix(`/auth/callback`) || PathPrefix(`/auth/hg-sso/callback`))"
      priority: 30
      services:
        - name: multica-frontend
          port: 3000
